server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # בלי זה, דפדפנים שומרים עותק ישן של index.html בזיכרון (cache) ולא
        # בודקים שיש גרסה חדשה - בדיוק הבאג שגרם למשתמש לא לראות עדכון חדש
        # למרות שהשרת כבר הריץ אותו. no-cache לא אומר "בלי שמירה בכלל" -
        # זה אומר "שמור, אבל תמיד תבדוק מול השרת קודם אם יש גרסה חדשה".
        add_header Cache-Control "no-cache";
    }
}
