<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - גרסת תמונות שטוחות</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  canvas { display: block; }
  #loaderPanel {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 20;
    background: rgba(0,0,0,0.6);
    padding: 12px 14px;
    border-radius: 12px;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 260px;
  }
  #loaderPanel .hint { font-size: 0.8rem; opacity: 0.85; line-height: 1.4; }
  #loaderPanel .btn {
    background: #ffb300;
    color: #23252b;
    font-weight: bold;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    text-align: center;
    font-size: 0.92rem;
  }
  #loaderPanel .btn:hover { background: #ffc63d; }
  #loadStatus { font-size: 0.85rem; min-height: 1.1em; }
</style>
</head>
<body>
<div id="label">🖼️ אופציה 3: דמויות מתמונה שטוחה - טען תמונות בפינה השמאלית התחתונה</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121a29);
scene.fog = new THREE.Fog(0x121a29, 26, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
// המצלמה יושבת בחלל הפתוח שבין הזירה ליציעים, ומביטה מעל החבל העליון
camera.position.set(0, 3.9, 8.0);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
scene.add(new THREE.HemisphereLight(0xaec6e8, 0x2f2a24, 0.8));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff3dd, 2.2);
keyLight.position.set(-6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0012;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.9);
fillLight.position.set(7, 8, -6);
scene.add(fillLight);

// זרקורי זירה - נותנים תחושת אולם אגרוף
const spotA = new THREE.SpotLight(0xfff6e5, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotA.position.set(-3.5, 10, 3.5);
spotA.target.position.set(-1.7, 0.7, 0);
scene.add(spotA, spotA.target);

const spotB = new THREE.SpotLight(0xeaf2ff, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotB.position.set(3.5, 10, -3.5);
spotB.target.position.set(1.7, 0.7, 0);
scene.add(spotB, spotB.target);

// ---------- מידות הזירה ----------
const RING_HALF = 4.2;        // חצי רוחב הבמה
const RING_TOP = 0.7;         // גובה פני הבמה
const POST_HEIGHT = 1.75;     // גובה עמודי הפינה מעל הבמה
const ROPE_HEIGHTS = [0.5, 0.95, 1.4]; // 3 חבלים בכל צלע

// ---------- רצפת האולם ----------
const hallFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x39404e, roughness: 1 })
);
hallFloor.rotation.x = -Math.PI / 2;
hallFloor.receiveShadow = true;
scene.add(hallFloor);

// ---------- במת הזירה ----------
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.8, RING_TOP, RING_HALF * 2 + 0.8),
  new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.85 })
);
platform.position.y = RING_TOP / 2;
platform.castShadow = true;
platform.receiveShadow = true;
scene.add(platform);

// יריעת הקנבס (משטח הלחימה)
const canvasMat = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.85, 0.06, RING_HALF * 2 + 0.85),
  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, roughness: 0.95 })
);
canvasMat.position.y = RING_TOP + 0.01;
canvasMat.receiveShadow = true;
scene.add(canvasMat);

// עמודי פינה + כריות ריפוד
const cornerColors = [0xd32f2f, 0x1565c0, 0xd32f2f, 0x1565c0];
const corners = [
  [-RING_HALF, -RING_HALF],
  [ RING_HALF, -RING_HALF],
  [ RING_HALF,  RING_HALF],
  [-RING_HALF,  RING_HALF],
];

corners.forEach(([cx, cz], i) => {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, POST_HEIGHT, 14),
    new THREE.MeshStandardMaterial({ color: 0xc2c9d4, roughness: 0.35, metalness: 0.75 })
  );
  post.position.set(cx, RING_TOP + POST_HEIGHT / 2, cz);
  post.castShadow = true;
  scene.add(post);

  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.17, 1.15, 14),
    new THREE.MeshStandardMaterial({ color: cornerColors[i], roughness: 0.8 })
  );
  pad.position.set(cx, RING_TOP + 0.95, cz);
  pad.castShadow = true;
  scene.add(pad);
});

// חבלים - 3 בכל אחת מ-4 הצלעות
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
const ropeLen = RING_HALF * 2;

ROPE_HEIGHTS.forEach((h) => {
  const y = RING_TOP + h;

  [-RING_HALF, RING_HALF].forEach((z) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.z = Math.PI / 2;
    rope.position.set(0, y, z);
    rope.castShadow = true;
    scene.add(rope);
  });

  [-RING_HALF, RING_HALF].forEach((x) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.x = Math.PI / 2;
    rope.position.set(x, y, 0);
    rope.castShadow = true;
    scene.add(rope);
  });
});

// ---------- יציעים וקהל ----------
// חשוב: כל יציע נבנה כ"מסגרת" חלולה מ-4 קטעים, ולא כקובייה מלאה -
// אחרת הקובייה הגדולה בולעת את הזירה ואת המצלמה.
const TIERS = 5;
const TIER_WIDTH = 2.0;
const FIRST_TIER_INNER = 9.0;   // מרוחק מספיק כדי להשאיר חלל פתוח למצלמה
const crowdPositions = [];

for (let t = 0; t < TIERS; t++) {
  const innerHalf = FIRST_TIER_INNER + t * TIER_WIDTH;
  const outerHalf = innerHalf + TIER_WIDTH;
  const height = 0.55 + t * 0.7;
  const mid = innerHalf + TIER_WIDTH / 2;

  const tierMat = new THREE.MeshStandardMaterial({
    color: t % 2 ? 0x3d4553 : 0x343b48,
    roughness: 0.95
  });

  // שני קטעים לאורך ציר X (מלוא הרוחב)
  [-mid, mid].forEach((z) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(outerHalf * 2, height, TIER_WIDTH), tierMat);
    seg.position.set(0, height / 2, z);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // שני קטעים לאורך ציר Z (בלי הפינות, שכבר נוצרו)
  [-mid, mid].forEach((x) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(TIER_WIDTH, height, innerHalf * 2), tierMat);
    seg.position.set(x, height / 2, 0);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // פיזור צופים על גג היציע - שתי שורות בכל צלע
  [0.6, 1.4].forEach((rowOffset) => {
    const out = innerHalf + rowOffset;
    const step = 0.8;
    const span = innerHalf + TIER_WIDTH * 0.5;
    for (let d = -span; d <= span; d += step) {
      const along = d + (Math.random() - 0.5) * 0.3;
      const outJ = out + (Math.random() - 0.5) * 0.25;
      [[along, -outJ], [along, outJ], [-outJ, along], [outJ, along]].forEach(([x, z]) => {
        crowdPositions.push({ x, y: height, z, phase: Math.random() * Math.PI * 2 });
      });
    }
  });
}

const crowdCount = crowdPositions.length;

const crowdBodyGeo = new THREE.CapsuleGeometry(0.17, 0.34, 4, 8);
const crowdHeadGeo = new THREE.SphereGeometry(0.145, 10, 10);
const crowdMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });

const crowdBodies = new THREE.InstancedMesh(crowdBodyGeo, crowdMat, crowdCount);
const crowdHeads = new THREE.InstancedMesh(crowdHeadGeo, crowdMat, crowdCount);
crowdBodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
crowdHeads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const shirtPalette = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xe67e22, 0xecf0f1, 0x1abc9c];
const skinPalette = [0xf0c39a, 0xd9a273, 0xb07a4e, 0x8a5a35, 0x66401f];

const dummy = new THREE.Object3D();
const colorTmp = new THREE.Color();

crowdPositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y + 0.36, p.z);
  dummy.updateMatrix();
  crowdBodies.setMatrixAt(i, dummy.matrix);

  dummy.position.set(p.x, p.y + 0.76, p.z);
  dummy.updateMatrix();
  crowdHeads.setMatrixAt(i, dummy.matrix);

  crowdBodies.setColorAt(i, colorTmp.setHex(shirtPalette[Math.floor(Math.random() * shirtPalette.length)]));
  crowdHeads.setColorAt(i, colorTmp.setHex(skinPalette[Math.floor(Math.random() * skinPalette.length)]));
});

scene.add(crowdBodies, crowdHeads);

// ---------- בניית דמות אנושית מחוברת ----------
// כל "עצם" נמתחת בין שתי נקודות שלד, ובכל מפרק יש כדור שמסתיר את התפר.
// כך לא נוצרים פערים ולא חפיפות כפולות.

const UP = new THREE.Vector3(0, 1, 0);

function bone(mat, rTop, rBottom, from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, len, 14), mat);
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function joint(mat, r, pos) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 12), mat);
  mesh.position.copy(pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ============================================================
//  אופציה 3: לוחמים כתמונות שטוחות בתוך זירה תלת-מימדית
//  (כך נבנו משחקי הלחימה הקלאסיים כמו מורטל קומבט המקורי)
// ============================================================

const FIGHTER_HEIGHT = 1.95;   // גובה הדמות ביחידות עולם - זהה בערך לדמויות הבנויות בקוד

// ---------- הכנת התמונה: הסרת רקע לבן + חיתוך אוטומטי ----------
// תמונות מג'מיני מגיעות עם רקע לבן ולא שקוף, ובנוסף הן ברובן שטח ריק.
// כאן הופכים את הלבן לשקוף, ואז חותכים בדיוק סביב הדמות.
function prepareTexture(img, whiteThreshold = 236) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const px = imgData.data;

  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;

  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      const isWhite = px[i] > whiteThreshold && px[i + 1] > whiteThreshold && px[i + 2] > whiteThreshold;
      if (isWhite) {
        px[i + 3] = 0;
      } else {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  if (maxX < 0) return null; // התמונה כולה לבנה

  ctx.putImageData(imgData, 0, 0);

  // חיתוך סביב הדמות, עם שוליים קטנים
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;

  const cut = document.createElement('canvas');
  cut.width = cw;
  cut.height = ch;
  cut.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, cw, ch);

  const tex = new THREE.CanvasTexture(cut);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;

  return { texture: tex, aspect: cw / ch };
}

// ---------- יצירת לוחם שטוח ----------
function createSpriteFighter(x, faceLeft) {
  const group = new THREE.Group();
  group.position.set(x, RING_TOP, 0);

  // צל מזויף על הרצפה - נותן תחושה שהדמות באמת עומדת על הבמה
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.42, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.05;
  group.add(shadow);

  // מציין מקום עד שנטענת תמונה
  const placeholder = new THREE.Mesh(
    new THREE.PlaneGeometry(0.9, FIGHTER_HEIGHT),
    new THREE.MeshBasicMaterial({ color: faceLeft ? 0x8c3b3b : 0x3b5a8c, transparent: true, opacity: 0.35 })
  );
  placeholder.position.y = FIGHTER_HEIGHT / 2;
  group.add(placeholder);

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, FIGHTER_HEIGHT),
    new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.45, side: THREE.DoubleSide })
  );
  mesh.visible = false;
  group.add(mesh);

  scene.add(group);

  return {
    group,
    setImage(img) {
      const prepared = prepareTexture(img);
      if (!prepared) return false;

      mesh.geometry.dispose();
      const w = FIGHTER_HEIGHT * prepared.aspect;
      mesh.geometry = new THREE.PlaneGeometry(w, FIGHTER_HEIGHT);
      mesh.material.map = prepared.texture;
      mesh.material.needsUpdate = true;
      mesh.position.y = FIGHTER_HEIGHT / 2;
      // היפוך אופקי כדי שהדמות תפנה אל היריב
      mesh.scale.x = faceLeft ? -1 : 1;
      mesh.visible = true;
      placeholder.visible = false;
      shadow.scale.setScalar(Math.max(0.8, w / 1.1));
      return true;
    }
  };
}

const spriteSwark = createSpriteFighter(-1.7, false);
const spriteBo    = createSpriteFighter(1.7, true);

// ---------- ממשק טעינת התמונות ----------
const panel = document.createElement('div');
panel.id = 'loaderPanel';
panel.innerHTML = `
  <div class="hint">בחר תמונות PNG/JPG על רקע לבן. הרקע הלבן יוסר אוטומטית.</div>
  <label class="btn">🧑‍🦱 טען תמונה של סווארק<input type="file" accept="image/*" id="fileSwark" hidden></label>
  <label class="btn">👽 טען תמונה של בו<input type="file" accept="image/*" id="fileBo" hidden></label>
  <div id="loadStatus"></div>
`;
document.body.appendChild(panel);

const status = panel.querySelector('#loadStatus');

function hookInput(inputId, target, name) {
  panel.querySelector(inputId).addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;

    // קריאת הקובץ כ-data URL: זו הדרך היחידה שעובדת כשפותחים
    // את הקובץ ישירות מהמחשב, בלי שרת (הדפדפן חוסם טעינת קבצים מקומיים)
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const ok = target.setImage(img);
        status.textContent = ok ? `✅ ${name} נטען` : `⚠️ ${name}: התמונה נראית ריקה`;
      };
      img.onerror = () => { status.textContent = `⚠️ ${name}: לא ניתן לקרוא את התמונה`; };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

hookInput('#fileSwark', spriteSwark, 'סווארק');
hookInput('#fileBo', spriteBo, 'בו');

// ---------- לולאת רינדור ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // תנועת קהל עדינה - נותנת חיים לאולם
  crowdPositions.forEach((p, i) => {
    const bob = Math.sin(t * 2.2 + p.phase) * 0.06;
    dummy.position.set(p.x, p.y + 0.36 + bob, p.z);
    dummy.updateMatrix();
    crowdBodies.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, p.y + 0.76 + bob, p.z);
    dummy.updateMatrix();
    crowdHeads.setMatrixAt(i, dummy.matrix);
  });
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
