        map: ribbedKnit('#ffffff'),
        transparent: true, opacity: sk.opacity ?? 0.62,
      });
      BIND = { chain: legKey };
      part(garment(sockMat, legCurve, LEG_PROFILE,
        { u0: sk.from ?? 0.40, u1: 1.0, pad: 0.010, steps: 22 }));
    }
  });

  // ---------- גבישים סביב הברכיים ----------
  // לוסטר - "רגליים עבות וכבדות עם גבישים גדולים מסביב לברכיים". קשיח
  // על עצם הברך (כמו הצמיד על שורש כף היד), לא chain - אשכול קטן של
  // חרוטים מזוויות שונות סביב אותה נקודה, לא איבר שמתעוות.
  if (cfg.kneeCrystals) {
    const crystalMat = new THREE.MeshStandardMaterial({
      color: cfg.crystalColor ?? 0x6fe8f0, roughness: 0.12, metalness: 0.25,
    });
    ['kneeL', 'kneeR'].forEach((knee) => {
      BIND = { bone: knee };
      const p = S[knee];
      [0, 1.3, 2.6, 3.9, 5.2].forEach((a) => {
        const shard = new THREE.Mesh(new THREE.ConeGeometry(0.020, 0.075, 6), crystalMat);
        shard.position.set(
          p.x + Math.cos(a) * 0.045, p.y + Math.sin(a) * 0.02, p.z + Math.sin(a) * 0.045);
        shard.rotation.z = a + Math.PI / 2;
        shard.castShadow = true;
        part(shard);
      });
    });
  }

  // ---------- זרועות ----------
  // המסלול מתחיל בתוך בית החזה, והדלתא היא פשוט הקטע העבה של הזרוע.
  // אין כדור כתף בכלל — זה מה שהעיף את "הידיים הנפוחות".
  const ARM_KEYS = ['armL', 'armR'];
  const WRIST_BONES = ['wristL', 'wristR'];
  [[S.shoulderL, S.elbowL, S.wristL, -1], [S.shoulderR, S.elbowR, S.wristR, 1]]
    .forEach(([sh, el, wr, side], ai) => {
      const shIn = V(sh.x * 0.38, sh.y - 0.045, sh.z);
      const armCurve = makeCurve([shIn, sh, el, wr]);
      BIND = { chain: ARM_KEYS[ai] };
      part(sweepCurve(skinMat, armCurve, ARM_PROFILE, { refDir: V(0, 1, 0), steps: 36 }));

      const dir = armCurve.getTangentAt(1).normalize();
      const across = new THREE.Vector3().crossVectors(dir, V(0, 1, 0)).normalize();

      // תחבושת צמודה לאמה — לא עבה ממנה, כמו ברפרנס
      if (cfg.handWraps) {
        part(garment(wrapMat, armCurve, ARM_PROFILE, { u0: 0.76, u1: 1.0, pad: 0.006, steps: 14 }));
      }

      // קעקוע על הכתף - עדיין BIND={chain} כאן (לפני שהאגרוף מחליף לעצם
      // שורש כף יד) כדי שיתעוות טבעי עם הכתף בתנועה. עיגול שקוף (ראה
      // tattooTex) כדי שהעור ייראה מסביב לציור, לא רק עיגול צבעוני.
      const tattooTexFn = ai === 0 ? cfg.tattooL : cfg.tattooR;
      if (tattooTexFn) {
        const tu = 0.24;
        const tp = armCurve.getPointAt(tu);
        const tT = armCurve.getTangentAt(tu).normalize();
        const { N: tN } = frameAt(tT, V(0, 1, 0));
        const { rx: trx } = profileAt(ARM_PROFILE, tu);
        const tattoo = new THREE.Mesh(new THREE.CircleGeometry(0.032, 20),
          new THREE.MeshBasicMaterial({ map: tattooTexFn(), transparent: true, side: THREE.DoubleSide }));
        tattoo.position.copy(tp.clone().addScaledVector(tN, trx + 0.004));
        tattoo.quaternion.setFromUnitVectors(V(0, 0, 1), tN);
        // קשיח על עצם הכתף, לא chain - עיגול קטן ודחוס כזה מבלבל את
        // chainBinder (שנועד למשטחי עור רציפים, לא לאביזר נקודתי), ואצל
        // Playty זה גרם לקעקוע להיעלם לגמרי אחרי ה-skinning. אותה שיטה
        // בדיוק כמו תגי הקבוצה של לורד (chest/hipR) שכן עבדו נכון.
        const savedBind = BIND;
        BIND = { bone: ai === 0 ? 'shoulderL' : 'shoulderR' };
        part(tattoo);
        BIND = savedBind;
      }

      // ---------- אגרוף ----------
      // לא כדור: רחב מעומקו, מתנפח בפרקי האצבעות ומתעגל בקצה.
      // האגרוף על כל פרטיו נוסע קשיח עם עצם שורש כף היד.
      const fistMat = cfg.handWraps ? wrapMat : skinMat;
      BIND = { bone: WRIST_BONES[ai] };
      part(sweep(fistMat,
        [wr.clone().addScaledVector(dir, -0.010),
         wr.clone().addScaledVector(dir, 0.030),
         wr.clone().addScaledVector(dir, 0.068)],
        [pr(0.00, 0.30, 0.28), pr(0.5, 0.44, 0.40), pr(1.00, 0.41, 0.37)],
        { steps: 16, refDir: across, capEnd: 'round', domeScale: 0.8 }));

      // פרקי אצבעות — ארבע בליטות קטנות בחזית האגרוף
      const up2 = new THREE.Vector3().crossVectors(across, dir).normalize();
      [-1.5, -0.5, 0.5, 1.5].forEach((k) => {
        const kn = new THREE.Mesh(new THREE.SphereGeometry(R * 0.075, 12, 10), fistMat);
        kn.position.copy(wr.clone()
          .addScaledVector(dir, 0.052)
          .addScaledVector(across, k * 0.0175)
          .addScaledVector(up2, 0.014));
        kn.scale.set(1, 0.85, 0.8);
        kn.castShadow = true;
        part(kn);
      });

      // אגודל מקופל על צד האגרוף
      part(sweep(fistMat,
        [wr.clone().addScaledVector(dir, 0.004).addScaledVector(across, side * 0.036),
         wr.clone().addScaledVector(dir, 0.048).addScaledVector(across, side * 0.022)],
        [pr(0, 0.16, 0.16), pr(1, 0.13, 0.13)],
        { steps: 8, radial: 20, capEnd: 'round' }));

      // cfg.fingerRingBothWrists (חדש, קיטי) - טבעת גם על יד שמאל, לא
      // רק ימין. אין בניית אצבעות נפרדות, אז "טבעות" (ברבים) על יד אחת
      // אינו מיוצג - הריבוי מיוצג בעיקר דרך הצמידים המרובים.
      if (cfg.fingerRing && (side === 1 || cfg.fingerRingBothWrists)) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.036, 0.008, 8, 20), goldMat);
        ring.position.copy(wr.clone().addScaledVector(dir, 0.036));
        ring.quaternion.setFromUnitVectors(V(0, 0, 1), dir);
        ring.castShadow = true;
        part(ring);
      }

      // צמיד — כמו הטבעת אבל רחב יותר וקצת אחורה על שורש כף היד/האמה
      // במקום קדימה על האגרוף, כדי שלא יתנגש איתה.
      // צמידים - ברירת מחדל: אחד, רק יד ימין (כמו לורד/סלייקי). קולין
      // ("מלא צמידי זהב") מבקש כמה, ועל שתי הידיים - cfg.braceletCount/
      // cfg.braceletBothWrists מרחיבים בלי לגעת בברירת המחדל הקיימת.
      if (cfg.bracelet && (side === 1 || cfg.braceletBothWrists)) {
        const count = cfg.braceletCount ?? 1;
        for (let i = 0; i < count; i++) {
          const bracelet = new THREE.Mesh(new THREE.TorusGeometry(0.050, 0.010, 8, 20), goldMat);
          bracelet.position.copy(wr.clone().addScaledVector(dir, -0.085 - i * 0.024));
          bracelet.quaternion.setFromUnitVectors(V(0, 0, 1), dir);
          bracelet.castShadow = true;
          part(bracelet);
        }
      }

      // טפרים - קירוב פשוט של "אצבעות עם טפרים": כמה חרוטים קטנים על
      // חזית האגרוף (שהוא ממילא כדור מוכלל, לא אצבעות נפרדות), לא בניית
      // יד עם אצבעות בפועל. נייטווינג ("טפרים קצרים וחדים").
      if (cfg.claws) {
        const clawMat = M(cfg.clawColor ?? 0x141414, 0.4);
        [-1.5, -0.5, 0.5, 1.5].forEach((k) => {
          const claw = new THREE.Mesh(new THREE.ConeGeometry(0.010, 0.045, 8), clawMat);
          claw.position.copy(wr.clone()
            .addScaledVector(dir, 0.086)
            .addScaledVector(across, k * 0.0175)
            .addScaledVector(up2, 0.014));
          claw.quaternion.setFromUnitVectors(V(0, 1, 0), dir);
          claw.castShadow = true;
          part(claw);
        });
      }
    });

  // ---------- כנפיים ----------
  // נייטווינג - "כנפיים ענקיות ושחורות עם קצוות מחודדות". לא משטח קרום
  // רציף (מורכב מדי לבנייה כרגע) - כמה "אצבעות" שטוחות שיוצאות מאותה
  // נקודת עוגן על הגב במניפה, בדיוק כמו אוזני החתול (כמה sweep-ים
  // מאותו בסיס) רק גדולות, שטוחות (rz קטן מאוד) ולא ביחידות R כי הן
  // גדולות בהרבה מהראש - ביחידות עולם מוחלטות, כמו מיקומי השלד עצמו.
  if (cfg.wings) {
    BIND = { bone: 'chest' };
    const wingMat = M(cfg.wingColor ?? 0x0a0a0d, 0.75);
    // cfg.wingStyle==='butterfly' (חדש, קיטי - "כנפי פרפר לא-אמיתיות
    // (קישוט)") - שתי אונות עגולות ורחבות במקום ארבע אצבעות מחודדות:
    // הקצה (t=1) נשאר רחב עם capEnd:'round' במקום להצטמצם לנקודה.
    const butterfly = cfg.wingStyle === 'butterfly';
    const FINGERS = butterfly
      ? [{ ang: 0.30, len: 0.28 }, { ang: 0.85, len: 0.22 }]
      : [
          { ang: 0.20, len: 0.40 },
          { ang: 0.55, len: 0.56 },
          { ang: 0.92, len: 0.52 },
          { ang: 1.28, len: 0.36 },
        ];
    [-1, 1].forEach((s) => {
      // ⚠️ ניסיון ראשון של הפרפר (rz עד 0.045, base ב-z-0.06) יצא גוש
      // עבה ותפוח קרוב לכתף, לא כנף שטוחה - נראה ברינדור. תוקן עם rz
      // דק בהרבה (כמו כנף העטלף שכבר עבדה) ובסיס רחוק יותר לאחור.
      const base = V(s * 0.06, S.chest.y + 0.10, S.chest.z - (butterfly ? 0.10 : 0.06));
      FINGERS.forEach(({ ang, len }) => {
        const dir2 = V(Math.sin(ang) * s, Math.cos(ang) * 0.55, -0.35 - ang * 0.15).normalize();
        const mid = base.clone().addScaledVector(dir2, len * 0.55);
        const tip = base.clone().addScaledVector(dir2, len);
        part(sweep(wingMat, [base, mid, tip], butterfly ? [
          { t: 0, rx: 0.040, rz: 0.010 },
          { t: 0.5, rx: 0.075, rz: 0.014 },
          { t: 1, rx: 0.055, rz: 0.010 },
        ] : [
          { t: 0, rx: 0.050, rz: 0.014 },
          { t: 0.5, rx: 0.075, rz: 0.010 },
          { t: 1, rx: 0.004, rz: 0.004 },
        ], { steps: 10, radial: 10, refDir: V(0, 1, 0), capStart: 'round', capEnd: butterfly ? 'round' : 'flat', domeScale: 0.5 }));
      });
    });
  }

  // ---------- קריסטל ענק בחזה ----------
  // לוסטר - "במרכז החזה קריסטל ענק וזוהר שמכיל את האנרגיה שלו". עצמאי
  // מ-cfg.chestCrestTex (שדורש חולצה/ז'קט) כי ללוסטר אין בגד כלל -
  // תלוי ישירות על עצם החזה. MeshBasicMaterial (כמו עיניים זוהרות)
  // כדי שייראה זוהר גם באזורים מוצללים, לא חומר רגיל שמתכהה בצל.
  if (cfg.chestGem) {
    BIND = { bone: 'chest' };
    const gemMat = new THREE.MeshBasicMaterial({ color: cfg.chestGemColor ?? 0x6fe8f0 });
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), gemMat);
    gem.position.set(0, S.chest.y - 0.02, S.chest.z + 0.10);
    gem.rotation.y = Math.PI / 4;
    part(gem);
  }

  // ---------- גופייה ----------
  // אותו מסלול של פלג הגוף + מרווח → צמודה, והשוליים עוקבים אחרי קו הגוף.
  // ה-pad קטן מזה של המכנסיים, ולכן היא נכנסת *לתוך* המכנסיים.
  if (topMat) {
    // המסגרת של פלג הגוף היא N=+X, ולכן: θ=0 ימין, θ=π/2 גב, θ=π שמאל, θ=3π/2 חזית.
    // הקצה גבוה בכתפיים (שם נוצרות הכתפיות) ונמוך בחזית ובגב (המחשוף).
    // הזרוע יוצאת מבית החזה מתחת לקצה הגבוה — וזה מייצר את פתח השרוול.
    // cfg.necklineLow/necklineRange (חדש, לסטנבר) מנמיכים את נקודת השפל
    // בחזית/בגב - "חור גדול לצוואר כמו פונצ'ו" - בלי לגעת בברירת המחדל.
    const necklineLow = cfg.necklineLow ?? 0.880;
    const necklineRange = cfg.necklineRange ?? 0.112;
    const edgeU = (th) => necklineLow + necklineRange * Math.pow(Math.abs(Math.cos(th)), 2.1);
    const shirtProfile = (u) => {
      const b = profileAt(TORSO_PROFILE, u);
      return { rx: b.rx + 0.008, rz: b.rz + 0.008 };
    };
    // חולצה קרועה: השוליים התחתונים משוננים במקום ישרים. סכום של שני
    // גלים בתדרים שאינם כפולות זה של זה נותן קרעים לא-סדירים (גל אחד לבדו
    // יוצא דפוס גלי ומסודר מדי, שנראה כמו עיצוב ולא כמו קרע).
    const hemBase = cfg.topHem ?? 0.28;
    const hemU = cfg.tornHem
      ? (th) => hemBase + 0.075 * (0.5 + 0.5 * Math.sin(th * 7)) * (0.55 + 0.45 * Math.sin(th * 3 + 1.2))
      : hemBase;
    BIND = { chain: 'torso' };
    part(sweepShapedEdge(topMat, torsoCurve, shirtProfile,
      { u0: hemU, edgeU, radial: 44, steps: 30, refDir: V(1, 0, 0) }));
  }

  // ---------- ז'קט ----------
  // רץ *מעל* החולצה (pad גדול יותר), ועוצר קצת לפני קו הצווארון שלה -
  // בדיוק הפער הזה הוא מה שנותן "מציצה" קטנה של החולצה מתחת לז'קט.
  // השרוולים בונים על אותה שיטה כמו התחבושות - garment() על עקום הזרוע.
  if (jacketMat) {
    const jacketEdgeU = (th) => 0.865 + 0.10 * Math.pow(Math.abs(Math.cos(th)), 2.1);
    const jacketProfile = (u) => {
      const b = profileAt(TORSO_PROFILE, u);
      return { rx: b.rx + 0.017, rz: b.rz + 0.017 };
    };
    BIND = { chain: 'torso' };
    part(sweepShapedEdge(jacketMat, torsoCurve, jacketProfile,
      { u0: cfg.jacketHem ?? 0.26, edgeU: jacketEdgeU, radial: 44, steps: 30, refDir: V(1, 0, 0) }));

    [[S.shoulderL, S.elbowL, S.wristL, 'armL'], [S.shoulderR, S.elbowR, S.wristR, 'armR']]
      .forEach(([sh, el, wr, chainKey]) => {
        const shIn = V(sh.x * 0.38, sh.y - 0.045, sh.z);
        const armCurve = makeCurve([shIn, sh, el, wr]);
        BIND = { chain: chainKey };
        // u1 קובע עד לאן השרוול מגיע (ברירת מחדל 0.86 = כמעט עד שורש כף היד,
        // "שרוול ארוך"). cfg.sleeveLen מקצר אותו לחולצת ספורט שרוול-קצר.
        part(garment(jacketMat, armCurve, ARM_PROFILE, { u0: 0, u1: cfg.sleeveLen ?? 0.86, pad: 0.014, steps: 26 }));
      });

    // סמל קבוצה על החזה (למשל סמל כדורגל) — עיגול שטוח קשיח על עצם החזה,
    // בצד שמאל (החזה של הלובש, לא של הצופה) - כמו סמל אמיתי על חולצת כדורגל.
    if (cfg.chestCrestTex) {
      BIND = { bone: 'chest' };
      const crest = new THREE.Mesh(new THREE.CircleGeometry(0.038, 24),
        new THREE.MeshBasicMaterial({ map: cfg.chestCrestTex() }));
      crest.position.set(-0.045, S.chest.y - 0.06, S.chest.z + 0.115);
      part(crest);
    }
  }

  // ---------- צוואר ----------
  // קבור משני צדדיו (בחזה ובראש) → אין תפר נראה, ואין כדור מפרק.
  BIND = { chain: 'neck' };
  part(sweep(skinMat, [V(0, 1.285, 0.006), V(0, 1.38, 0.0), V(0, 1.495, -0.006)],
    NECK_PROFILE, { steps: 12, radial: 26 }));

  // ---------- ראש ----------
  // מכאן ועד סוף הפונקציה: ראש, פנים, אוזניים ושיער — הכול קשיח על עצם הראש.
  // אלה חלקים שלא אמורים להתעוות מבפנים, רק לפנות יחד עם הראש.
  BIND = { bone: 'head' };
  const HC = S.headCenter;
  // ראש "מעוך" (cfg.headSquish, סלייקי) - שטוח ורחב, במקום פרופורציית
  // הראש הרגילה. משפיע גם על השיער (cap+RINGS למטה, שמשתמשים באותו
  // headScale) כדי שהוא יישאר צמוד לצורת הגולגולת החדשה, לא לישנה.
  // ראש ענק (cfg.bigHeadMult, מוקרוט) - הגדלה *אחידה* (לא מעוך) - קל
  // יותר להתאים כי כל תו הפנים (עיניים/אף/פה/לסת) פשוט מתרחק פרופורציונלית
  // ממרכז הראש לפי headMult, בלי לשנות יחס רוחב/גובה/עומק בין תו לתו.
  const headMult = cfg.bigHeadMult ?? 1;
  const headScale = cfg.headSquish
    ? { x: 1.35, y: 0.60, z: 1.00 }
    : { x: HEAD_SCALE.x * headMult, y: HEAD_SCALE.y * headMult, z: HEAD_SCALE.z * headMult };
  // ראש משושה (cfg.hexHead, לוסטר - "עשוי כמעט כולו מגבישים... ראש
  // משושה") - מנסרה שישתית (CylinderGeometry עם 6 מקטעים) במקום כדור.
  // rotation.y=π/6 מסובב כך שפאה שטוחה (לא קודקוד) פונה קדימה - חשוב
  // כדי שהחישוב הקיים של עומק הפנים (ez, ראה למטה) יישאר קרוב לנכון.
  // אין לסת/סנטר לראש משושה - כדור רך לא הולם צורה גיאומטרית-קשיחה.
  const head = cfg.hexHead
    ? new THREE.Mesh(
        new THREE.CylinderGeometry(R * 0.95 * headMult, R * 0.95 * headMult, R * 1.9 * headMult, 6), headMat)
    : new THREE.Mesh(new THREE.SphereGeometry(R, 44, 34), headMat);
  head.position.copy(HC);
  if (cfg.hexHead) head.rotation.y = Math.PI / 6;
  else head.scale.set(headScale.x, headScale.y, headScale.z);
  head.castShadow = true;
  head.receiveShadow = true;
  part(head);

  // לסת וסנטר — מרככים את "הכדור המושלם" לצורת פנים
  // נשאר *בתוך* אליפסואיד הראש בכל הכיוונים חוץ מלמטה, ולכן הוא מוסיף סנטר
  // בלי ליצור טבעת תפר נראית סביב הפנים.
  if (!cfg.hexHead) {
    const jaw = new THREE.Mesh(new THREE.SphereGeometry(R * 0.78 * headMult, 34, 26), headMat);
    jaw.position.set(0, HC.y - R * 0.55 * headMult, R * 0.05 * headMult);
    jaw.scale.set(0.68, 0.88, 0.78);
    jaw.castShadow = true;
    part(jaw);
  }

  // ---------- אוזניים ----------
  [-1, 1].forEach((s) => {
    if (cfg.ears === 'pointed' && cfg.headSquish) {
      // ⚠️ הנוסחה הרגילה של אוזן חדה (למטה) הונחה על ראש רגיל וצר - על
      // ראש שטוח ורחב היא יוצאת קבורה כמעט לגמרי בתוך הגולגולת הרחבה
      // הרבה יותר (נראה ברינדור). כאן האוזן יוצאת בעיקר *הצידה*, לאורך
      // הרוחב של הראש, ולא כלפי מעלה כמו בראש הרגיל.
      part(sweep(skinMat,
        [V(s * R * 1.00, HC.y + R * 0.05, -R * 0.10),
         V(s * R * 1.30, HC.y + R * 0.10, -R * 0.18),
         V(s * R * 1.62, HC.y + R * 0.16, -R * 0.28)],
        [pr(0, 0.28, 0.16), pr(0.55, 0.20, 0.10), pr(1, 0.04, 0.025)],
        { steps: 14, radial: 20, refDir: V(0, 0, 1), capEnd: 'round', domeScale: 0.6 }));
    } else if (cfg.ears === 'pointed') {
      part(sweep(skinMat,
        [V(s * R * 0.70, HC.y + R * 0.02, -R * 0.04),
         V(s * R * 1.00, HC.y + R * 0.62, -R * 0.26),
         V(s * R * 1.22, HC.y + R * 1.22, -R * 0.48)],
        [pr(0, 0.28, 0.16), pr(0.55, 0.20, 0.10), pr(1, 0.04, 0.025)],
        { steps: 14, radial: 20, refDir: V(0, 0, 1), capEnd: 'round', domeScale: 0.6 }));
    } else {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(R * 0.26, 18, 16), skinMat);
      ear.position.set(s * R * 0.72, HC.y - R * 0.06, -R * 0.06);
      ear.scale.set(0.40, 1.15, 0.75);
      ear.castShadow = true;
      part(ear);
    }
  });

  // ---------- אוזני חתול ----------
  // תוספת מעל הראש (לא מחליפה את cfg.ears הרגילות בצד) - שני משולשים
  // שמצביעים כלפי מעלה, עם חלק ורוד פנימי קטן יותר. צבע הפרווה הולך
  // אחרי צבע השיער אם לא נקבע צבע נפרד (cfg.catFurColor).
  // ⚠️ גובה: הניסיון הראשון (קצה ב-1.55R) נבלע לגמרי בתוך מסת השיער
  // "הקצר" (שמגיע בפועל עד כ-1.4-1.5R) - נראה ברינדור, לא בקריאת קוד.
  // הקצה הועלה ל-2.05R כדי לבלוט בבירור מעל השיער מכל זווית.
  if (cfg.catEars) {
    const furMat = M(cfg.catFurColor ?? cfg.hair, 0.75);
    const innerMat = M(0xf2b6c6, 0.7);
    [-1, 1].forEach((s) => {
      part(sweep(furMat, [
        V(s * R * 0.40, HC.y + R * 0.95, -R * 0.08),
        V(s * R * 0.58, HC.y + R * 1.55, -R * 0.02),
        V(s * R * 0.74, HC.y + R * 2.05, R * 0.05),
      ], [
        pr(0, 0.24, 0.24), pr(0.6, 0.15, 0.15), pr(1, 0.015, 0.015),
      ], { steps: 10, radial: 14, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.6 }));

      part(sweep(innerMat, [
        V(s * R * 0.33, HC.y + R * 0.98, R * 0.00),
        V(s * R * 0.46, HC.y + R * 1.45, R * 0.03),
        V(s * R * 0.58, HC.y + R * 1.85, R * 0.06),
      ], [
        pr(0, 0.13, 0.13), pr(0.6, 0.08, 0.08), pr(1, 0.006, 0.006),
      ], { steps: 8, radial: 10, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.6 }));
    });
  }

  // ---------- קרניים קטנות פונות לאחור ----------
  // נייטווינג - שתי קרניים קטנות שמתחילות למעלה על הראש ומתעקלות
  // לאחור (z שלילי) במקום לצדדים כמו אוזני חתול. cfg.hornColor ברירת
  // מחדל לצבע העור עצמו (קרן כהה שממשיכה את גוון הגוף).
  if (cfg.backHorns) {
    const hornMat = M(cfg.hornColor ?? cfg.skin, 0.5);
    [-1, 1].forEach((s) => {
      part(sweep(hornMat, [
        V(s * R * 0.26, HC.y + R * 0.88, R * 0.10),
        V(s * R * 0.32, HC.y + R * 1.05, -R * 0.15),
        V(s * R * 0.36, HC.y + R * 1.18, -R * 0.42),
      ], [
        pr(0, 0.10, 0.10), pr(0.6, 0.06, 0.06), pr(1, 0.008, 0.008),
      ], { steps: 8, radial: 10, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.6 }));
    });
  }

  // ---------- גבישי קריסטל מעל הראש ----------
  // לוסטר - "גבישי קריסטלים גדולים מעל הראש כמו קרניים". חרוטים
  // מרובעי-פאות (6 מקטעים, לא עגולים חלקים) כדי שייראו כמו גבישים
  // מלוטשים ולא כמו קרניים אורגניות רכות.
  if (cfg.headCrystals) {
    const crystalMat = new THREE.MeshStandardMaterial({
      color: cfg.crystalColor ?? 0x6fe8f0, roughness: 0.12, metalness: 0.25,
    });
    [
      { x: -0.34, len: 0.80, tilt: -0.20 },
      { x: 0, len: 1.05, tilt: 0 },
      { x: 0.34, len: 0.80, tilt: 0.20 },
    ].forEach(({ x, len, tilt }) => {
      const shard = new THREE.Mesh(new THREE.ConeGeometry(R * 0.22 * headMult, R * len * headMult, 6), crystalMat);
      // בסיס הגביש על פסגת הראש המשושה השטוחה (חצי-הגובה של הצילינדר,
      // R*0.95, לא R*1.10 שהיה מתאים לפסגת כדור רגילה).
      shard.position.set(x * R * headMult, HC.y + R * (0.95 + len * 0.5) * headMult, 0);
      shard.rotation.z = tilt;
      shard.castShadow = true;
      part(shard);
    });
  }

  // ---------- פנים ----------
  // עיניים קטנות ומבטאות כמו ברפרנס — לא עיניים ענקיות בסגנון אנימה
  // עין אחת (cfg.oneEye, סלייקי) - איטרציה על [0] בלבד (עין אחת במרכז,
  // s=0) במקום [-1,1], עם sizeMult שמגדיל את כל חלקי העין כדי שהיא
  // תיראה כמו עין דומיננטית אחת ולא כמו עין קטנה שאיבדה את הזוג שלה.
  // הגבה מדלגת ב-one-eye: הנוסחה שלה תלויה ב-s לכיוון הקשת (s=0 הופך
  // אותה לקו ישר מנוון), ומפלצת עם עין אחת ממילא לא צריכה גבה סימטרית.
  const eyeSlots = cfg.oneEye ? [0] : [-1, 1];
  // cfg.eyeSizeMult (חדש) מאפשר עיניים גדולות בלי עין-אחת (מוקרוט,
  // "שתי עיניים צהובות גדולות") - עצמאי מ-oneEye, לא רק ברירת המחדל שלו.
  const eyeSizeMult = cfg.eyeSizeMult ?? (cfg.oneEye ? 1.9 : 1);
  eyeSlots.forEach((s) => {
    const ex = s * R * 0.40 * headMult, ey = HC.y + R * 0.10 * headMult;
    // ez=0.80R הונח על סמך הראש הרגיל (headScale.z=0.90). ראש שטוח ורחב
    // (headScale.z=1.00, y=0.60) מזיז את פני השטח האמיתיים באותו גובה-עין
    // קדימה (החישוב: z_surface = R*headScale.z*sqrt(1-(0.10/0.60)²)≈0.986R)
    // - ez הישן יצא *מאחורי* פני הראש, והעין נבלעה כליל בלי להיראות בכלל.
    // נמצא ברינדור (עין שלמה נעלמה), לא בחישוב מראש. תוקן עם מרווח קדימה.
    // ראש ענק (headMult) מרחיק את פני השטח פרופורציונלית בכל הכיוונים
    // (ראה ההערה על head.scale למעלה) - ez מוכפל גם הוא כדי להישאר צמוד.
    // ראש משושה (hexHead) - הפאה השטוחה נמצאת באפותם המשושה
    // (R*0.95*cos(30°)≈0.82R), לא על עקומת כדור - מספר קרוב אך שונה.
    const ez = cfg.headSquish ? R * 1.05 : cfg.hexHead ? R * 0.85 * headMult : R * 0.80 * headMult;
    // (ez נבחר כך שחזית הלובן תעבור את פני הפנים בכ-0.001 בלבד)

    // פני הראש בגובה העין נמצאים ב-z=0.876R. כל שכבה כאן בולטת רק במעט מעל
    // קודמתה, אחרת גלגל העין יוצא ככדור מודבק על הפנים במקום עין שקועה בארובה.
    const white = new THREE.Mesh(new THREE.SphereGeometry(R * 0.21 * eyeSizeMult, 24, 22), eyeWhiteMat);
    white.position.set(ex, ey, ez);
    white.scale.set(1, 0.70, 0.42);
    part(white);

    // הקשתית תופסת ~45% מרוחב העין, ולכן הלובן נראה משני צדדיה.
    // ⚠️ ההיסטים הקטנים בין השכבות (0.055/0.088/0.105) הם ברמת "עין
    // רגילה" - עם eyeSizeMult גדול (עין אחת מוגדלת) הלובן המוגדל בלע
    // את הקשתית/האישון/הברק, כי הם בלטו קדימה רק במעט קבוע בעוד שהלובן
    // עצמו גדל. נמצא ברינדור (עין לבנה בלי אישון) - תוקן עם היסטים
    // שגדלים יחד עם eyeSizeMult, לא קבועים.
    const iris = new THREE.Mesh(new THREE.SphereGeometry(R * 0.095 * eyeSizeMult, 20, 18), irisMat);
    iris.position.set(ex + s * R * 0.012, ey - R * 0.008, ez + R * 0.055 * eyeSizeMult);
    iris.scale.set(1, 1, 0.45);
    part(iris);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(R * 0.042 * eyeSizeMult, 16, 14), pupilMat);
    pupil.position.set(ex + s * R * 0.012, ey - R * 0.008, ez + R * 0.088 * eyeSizeMult);
    pupil.scale.set(1, 1, 0.45);
    part(pupil);

    const glint = new THREE.Mesh(new THREE.SphereGeometry(R * 0.028 * eyeSizeMult, 10, 10), glintMat);
    glint.position.set(ex + s * R * 0.058, ey + R * 0.062, ez + R * 0.105 * eyeSizeMult);
    part(glint);

    // עפעף עליון — כיפה בצבע עור שמכסה את החלק העליון של גלגל העין.
    // בלי זה העין נשארת עיגול שלם והמבט יוצא פעור וקפוא.
    const lid = new THREE.Mesh(
      new THREE.SphereGeometry(R * 0.222 * eyeSizeMult, 24, 18, 0, Math.PI * 2, 0, 0.85), skinMat);
    lid.position.set(ex, ey + R * 0.012, ez);
    lid.scale.set(1, 0.70, 0.44);
    lid.castShadow = true;
    part(lid);

    if (!cfg.oneEye) {
      // גבה עבה ומעוקלת (בולטת ברפרנס) — רצועה, לא קופסה
      part(sweep(hairMat,
        [V(ex - s * R * 0.30 * headMult, HC.y + R * 0.235 * headMult, R * 0.780 * headMult),
         V(ex,                          HC.y + R * 0.290 * headMult, R * 0.856 * headMult),
         V(ex + s * R * 0.30 * headMult, HC.y + R * 0.245 * headMult, R * 0.780 * headMult)],
        [pr(0, 0.04, 0.032), pr(0.5, 0.078, 0.055), pr(1, 0.04, 0.032)],
        { steps: 10, radial: 14, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round' }));
    }

    // ריסים — שלוש קווצות דקות שיוצאות מהקצה העליון-חיצוני של העין ונפתחות
    // החוצה ומעלה. זה הסימן הכי ברור וקריא לפרצוף "של בת" בסגנון הזה,
    // בלי לגעת במבנה הפנים המשותף לכל הדמויות.
    if (cfg.eyelashes) {
      const baseX = ex + s * R * 0.14, baseY = ey + R * 0.125, baseZ = ez + R * 0.02;
      [[-0.4, 0.45], [0, 0.62], [0.4, 0.50]].forEach(([spread, up]) => {
        const tipX = baseX + s * R * 0.16 + spread * s * R * 0.05;
        const tipY = baseY + R * up * 0.30;
        part(sweep(lashMat,
          [V(baseX + spread * s * R * 0.02, baseY, baseZ), V(tipX, tipY, baseZ + R * 0.015)],
          [pr(0, 0.017, 0.017), pr(1, 0.003, 0.003)],
          { steps: 3, radial: 6, capStart: 'round', capEnd: 'round' }));
      });
    }
  });

  // ---------- שפמים ----------
  // שלושה קווים דקים בכל לחי, מהאף כלפי חוץ - אותה שיטה כמו הריסים
  // למעלה (sweep דק שנפתח מבסיס לקצה), רק על הלחי ולא על העין.
  if (cfg.whiskers) {
    const whiskerMat = M(0xf5f0e6, 0.55);
    [-1, 1].forEach((s) => {
      const baseX = s * R * 0.30, baseY = HC.y - R * 0.30, baseZ = R * 0.76;
      [[0.12], [0], [-0.12]].forEach(([dy]) => {
        part(sweep(whiskerMat,
          [V(baseX, baseY, baseZ), V(s * R * 1.05, baseY + R * dy, baseZ - R * 0.08)],
          [pr(0, 0.014, 0.014), pr(1, 0.003, 0.003)],
          { steps: 3, radial: 6, capStart: 'round', capEnd: 'round' }));
      });
    });
  }

  // אף = גשר שיוצא מבין הגבות ויורד אל קצה מעוגל, ואז חוזר לתוך הפנים.
  // הגשר קבור בתוך הראש, ולכן אין תפר — רק הקצה בולט החוצה.
  // חלופות: אף-מקדחה (זומי) או חוטם תנין (בונדרילו) במקום האף הרגיל.
  if (cfg.drillNose) {
    // מקדחה: חרוט ארוך שמצביע קדימה, ועליו כמה טבעות שיוצרות את החריץ
    // הספירלי. הבסיס קבור בפנים כדי שלא ייווצר תפר.
    // tip ביחידות R (כמו כל שאר המספרים כאן) - לא מוכפל ב-R כאן, כי הוא
    // מוכפל בהמשך בכל שימוש. הכפלה כפולה נתנה מקדחה באורך אפס, שנבלעה בפנים.
    const tip = 2.30;
    part(sweep(M(0x9aa0a8, 0.35, 0.7), [
      V(0, HC.y - R * 0.14, R * 0.62),
      V(0, HC.y - R * 0.17, R * (0.62 + tip * 0.45)),
      V(0, HC.y - R * 0.20, R * (0.62 + tip)),
    ], [
      pr(0.00, 0.150, 0.150), pr(0.55, 0.085, 0.085), pr(1.00, 0.012, 0.012),
    ], { steps: 20, radial: 18, refDir: V(1, 0, 0), capStart: 'round', capEnd: 'round', domeScale: 0.5 }));
    // חריצי המקדחה - טבעות שהולכות וקטנות לאורך החרוט
    for (let k = 0; k < 5; k++) {
      const f = 0.16 + k * 0.17;
      const rad = R * (0.150 - 0.130 * f) * 1.35;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(rad, R * 0.026, 8, 16), M(0x6f757c, 0.4, 0.75));
      ring.position.set(0, HC.y - R * (0.14 + 0.06 * f), R * (0.62 + tip * f));
      ring.rotation.x = 0.42;   // הטיה קלה = תחושת ספירלה, לא טבעות מקבילות
      ring.castShadow = true;
      part(ring);
    }
  } else if (cfg.snout) {
    // חוטם תנין: קופסה ארוכה ושטוחה שיוצאת מאזור האף, עם לסת תחתונה
    // מעט קצרה יותר ושורת שיניים לבנות ביניהן.
    const sy = HC.y - R * 0.26, sz = R * 0.55, len = R * 1.55;
    part(sweep(skinMat, [
      V(0, sy + R * 0.04, sz), V(0, sy, sz + len * 0.55), V(0, sy - R * 0.02, sz + len),
    ], [
      pr(0.00, 0.46, 0.34), pr(0.55, 0.42, 0.28), pr(1.00, 0.32, 0.20),
    ], { steps: 16, radial: 18, refDir: V(1, 0, 0), capEnd: 'round', domeScale: 0.6 }));
    // cfg.snoutJawColor (חדש, לונג) - ברירת המחדל היא הירוק המקורי של
    // בונדרילו; לונג (דרקון צהוב) צריך שהלסת התחתונה תתאים לצבע גופו.
    part(sweep(M(cfg.snoutJawColor ?? 0x3f5a34, 0.8), [
      V(0, sy - R * 0.26, sz + R * 0.05), V(0, sy - R * 0.30, sz + len * 0.86),
    ], [pr(0, 0.38, 0.20), pr(1, 0.28, 0.15)],
      { steps: 10, radial: 14, refDir: V(1, 0, 0), capEnd: 'round', domeScale: 0.6 }));
    // שיניים - חרוטים קטנים לאורך קו החיבור בין הלסתות
    const toothMat = M(0xf6f4ec, 0.4);
    for (let k = 0; k < 5; k++) {
      [-1, 1].forEach((s) => {
        const zz = sz + len * (0.22 + k * 0.16);
        const t = new THREE.Mesh(new THREE.ConeGeometry(R * 0.045, R * 0.14, 5), toothMat);
        t.position.set(s * R * 0.30, sy - R * 0.16, zz);
        t.rotation.x = Math.PI;   // מצביעה כלפי מטה
        part(t);
      });
    }
    // ניבים ממש ארוכים (cfg.longFangs, לונג) - שני חרוטים גדולים בנוסף
    // לשורת השיניים הקטנה, בקצה קדמי של הפה.
    if (cfg.longFangs) {
      [-1, 1].forEach((s) => {
        const fang = new THREE.Mesh(new THREE.ConeGeometry(R * 0.08, R * 0.62, 6), toothMat);
        fang.position.set(s * R * 0.32, sy - R * 0.30, sz + len * 0.22);
        fang.rotation.x = Math.PI;
        fang.castShadow = true;
        part(fang);
      });
    }
  } else {
    // cfg.noseLength/noseSharp (חדש, קיטי - "אף ארוך וקצת מחודד") -
    // מאריכים רק את קצה האף (נקודת השיא, t=0.76) קדימה, ומצמצמים את
    // הרוחב שם לחוד מחודד יותר. ברירת מחדל 1/1 = בדיוק האף הקיים.
    const noseLen = cfg.noseLength ?? 1;
    const noseSharp = cfg.noseSharp ?? 1;
    part(sweep(skinMat, [
      V(0, HC.y + R * 0.20 * headMult, R * 0.72 * headMult),
      V(0, HC.y + R * 0.00 * headMult, R * 0.80 * headMult),
      V(0, HC.y - R * 0.15 * headMult, R * (0.775 + 0.10 * noseLen) * headMult),
      V(0, HC.y - R * 0.27 * headMult, R * 0.775 * headMult),
    ], [
      pr(0.00, 0.040, 0.040), pr(0.42, 0.082, 0.078),
      pr(0.76, 0.112 * noseSharp, 0.106 * noseSharp), pr(1.00, 0.078, 0.074),
    ], { steps: 18, radial: 22, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.7 }));
  }

  // הפה מוסתר מאחורי החוטם של התנין, ולכן מדלגים עליו שם
  if (!cfg.snout) {
    // cfg.mouthScale (חדש, מוקרוט - "פה קטן") - גודל הפה עצמו נפרד
    // מ-headMult: ראש ענק לא אמור להביא איתו פה גדול יותר באופן אוטומטי.
    const mouthScale = cfg.mouthScale ?? 1;
    const smile = new THREE.Mesh(
      new THREE.TorusGeometry(R * 0.215 * mouthScale, R * 0.034 * mouthScale, 10, 26, Math.PI * 0.78), mouthMat);
    smile.position.set(0, HC.y - R * 0.48 * headMult, R * 0.775 * headMult);
    smile.rotation.z = Math.PI * 1.10;
    part(smile);

    // שיניים חדות בפה הרגיל (cfg.mouthTeeth, נייטווינג/מוקרוט) - שורת
    // חרוטים קטנים מתחת לקשת החיוך, לא לאורך חוטם תנין ישר, אז המיקום
    // כאן קירוב פשוט (מרווח שווה על ציר X) ולא טריגונומטריה של הטבעת -
    // בחירה סגנונית, לא משטח שצריך להיות מדויק. goldIndices מאפשר שיניים
    // בודדות בזהב (מוקרוט: "כמה שיניים בצבע זהב").
    if (cfg.mouthTeeth) {
      const { count = 4, goldIndices = [] } = cfg.mouthTeeth;
      const toothMat = M(0xf6f4ec, 0.4);
      for (let i = 0; i < count; i++) {
        const t0 = (i + 0.5) / count - 0.5;
        const tooth = new THREE.Mesh(
          new THREE.ConeGeometry(R * 0.028 * mouthScale, R * 0.09 * mouthScale, 6), goldIndices.includes(i) ? goldMat : toothMat);
        tooth.position.set(t0 * R * 0.30 * mouthScale, HC.y - R * 0.40 * headMult, R * 0.79 * headMult);
        tooth.rotation.x = Math.PI;
        tooth.castShadow = true;
        part(tooth);
      }
    }
  }

  if (cfg.noseRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R * 0.15, R * 0.038, 10, 20), goldMat);
    // על חוטם ארוך: הטבעת עוברת דרך *גב* החוטם (שם היא נראית מכל זווית).
    // גובה גב החוטם באזור הזה ≈ HC.y - 0.03R, ולכן טבעת שמרכזה שם בולטת
    // מחציתה מעל הקו - קודם היא הייתה מתחת לחוטם ונבלעה בתוכו.
    if (cfg.snout) ring.position.set(0, HC.y - R * 0.02, R * 1.70);
    else ring.position.set(0, HC.y - R * 0.31, R * 0.845);
    ring.castShadow = true;
    part(ring);
  }

  // ---------- משקפי ראייה ----------
  // שתי עדשות (טבעת + זכוכית שקופה), גשר ביניהן, ושתי זרועות שרצות
  // אחורה אל האוזניים. הכל קשיח על עצם הראש, כמו שאר חלקי הפנים.
  if (cfg.glasses) {
    const frameMat = M(cfg.glassColor ?? 0x2b2b33, 0.45);
    const lensMat = new THREE.MeshStandardMaterial({
      color: 0xdcecf5, roughness: 0.12, metalness: 0.1,
      transparent: true, opacity: 0.30,
    });
    const ey = HC.y + R * 0.10;                 // אותו גובה של העיניים
    const ez = R * 0.90;                        // מעט לפני פני הפנים
    [-1, 1].forEach((s) => {
      const ex = s * R * 0.40;
      const rim = new THREE.Mesh(new THREE.TorusGeometry(R * 0.26, R * 0.035, 10, 22), frameMat);
      rim.position.set(ex, ey, ez);
      rim.castShadow = true;
      part(rim);
      const lens = new THREE.Mesh(new THREE.CircleGeometry(R * 0.25, 20), lensMat);
      lens.position.set(ex, ey, ez);
      part(lens);
      // זרוע אל האוזן
      part(sweep(frameMat,
        [V(ex + s * R * 0.24, ey + R * 0.04, ez - R * 0.02),
         V(s * R * 0.74, ey + R * 0.02, -R * 0.10)],
        [pr(0, 0.030, 0.030), pr(1, 0.026, 0.026)],
        { steps: 6, radial: 8, capStart: 'round', capEnd: 'round' }));
    });
    // גשר בין שתי העדשות
    part(sweep(frameMat,
      [V(-R * 0.16, ey + R * 0.03, ez), V(0, ey + R * 0.06, ez + R * 0.01), V(R * 0.16, ey + R * 0.03, ez)],
      [pr(0, 0.028, 0.028), pr(0.5, 0.030, 0.030), pr(1, 0.028, 0.028)],
      { steps: 8, radial: 8, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round' }));
  }

  // עגיל באוזן - טבעת קטנה שתלויה מתחת לכל אוזן. cfg.earRingCount (חדש,
  // קיטי - "המון עגילי זהב באוזן") מוסיף עוד טבעות קטנות יותר בשורה
  // עולה על תנוך האוזן, בנוסף לעגיל הראשון - ברירת מחדל 1 לא משנה כלום.
  if (cfg.earRing) {
    const earRingCount = cfg.earRingCount ?? 1;
    [-1, 1].forEach((s) => {
      for (let i = 0; i < earRingCount; i++) {
        const rad = R * (0.10 - i * 0.022);
        const e = new THREE.Mesh(new THREE.TorusGeometry(Math.max(rad, R * 0.035), R * 0.022, 8, 16), goldMat);
        e.position.set(s * R * 0.74, HC.y - R * 0.34 + i * R * 0.14, -R * 0.06 - i * R * 0.01);
        e.rotation.y = Math.PI / 2;
        e.castShadow = true;
        part(e);
      }
    });
  }

  // פירסינג בלשון - טבעת קטנה שמציצה מהפה (או מקצה החוטם אצל תנין)
  if (cfg.tongueRing) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(R * 0.075, R * 0.022, 8, 16), goldMat);
    // מעבר לקצה החוטם (שנגמר ב-2.10R), כדי שתיראה ולא תיבלע בגיאומטריה
    if (cfg.snout) { t.position.set(0, HC.y - R * 0.34, R * 2.16); t.rotation.y = Math.PI / 2; }
    else { t.position.set(0, HC.y - R * 0.52, R * 0.80); t.rotation.x = Math.PI / 2; }
    t.castShadow = true;
    part(t);
  }

  // ---------- מסכת אגוז (סטנבר) ----------
  // מכסה את כל הפנים - אליפסואיד שטוח שיושב *לפני* פני הפנים. ניסיון
  // ראשון (קצה ב-~0.104R) יצא כמעט בלתי-נראה - נבלע כמעט לגמרי מאחורי
  // האף (שמגיע ל-0.875R!) ותווי הפנים, ורק פינה קטנה בלטה. נמצא ברינדור,
  // לא בחישוב - בדיוק הלקח "לחשב לא לנחש" עומק, רק שהניחוש הראשון פספס.
  // תוקן עם קצה שיוצא הרבה יותר קדימה (~0.13R) ומעטפת גדולה יותר.
  // חורי העיניים והפה לא גיאומטריה אמיתית (לא "רואים דרכם") - רק עיגולים
  // כהים קשיחים לפני המסכה, שנותנים את האשליה בלי לסבך את הגיאומטריה.
  if (cfg.walnutMask) {
    // cfg.maskMetal (חדש, לוין - "מסכת ברזל") - אותה גיאומטריית מסכה
    // בדיוק, רק חומר מתכתי חלק (roughness נמוך, metalness גבוה) במקום
    // מרקם קליפת האגוז - שימוש חוזר במסכה השלמה שכבר נבנתה לסטנבר.
    const maskMat = cfg.maskMetal
      ? new THREE.MeshStandardMaterial({ color: cfg.maskColor ?? 0xc0c0c8, roughness: 0.2, metalness: 0.6 })
      : new THREE.MeshStandardMaterial({
          color: 0xffffff, roughness: 0.85,
          map: walnutShellTex('#' + new THREE.Color(cfg.maskColor ?? 0x4a2e18).getHexString()),
        });
    const mask = new THREE.Mesh(new THREE.SphereGeometry(R * 0.78, 30, 24), maskMat);
    mask.position.set(0, HC.y - R * 0.10, R * 0.62);
    mask.scale.set(0.92, 1.15, 0.62);
    mask.castShadow = true;
    part(mask);

    // חורי העיניים - ברירת מחדל חור כהה, אבל cfg.maskEyeColor (חדש)
    // מאפשר "עיניים" זוהרות אדומות למסכת גיבור, כמו לוין.
    const holeMat = new THREE.MeshBasicMaterial({ color: cfg.maskEyeColor ?? 0x0c0908 });
    [-1, 1].forEach((s) => {
      const hole = new THREE.Mesh(new THREE.CircleGeometry(R * 0.15, 20), holeMat);
      hole.position.set(s * R * 0.40, HC.y + R * 0.10, R * 1.05);
      part(hole);
    });
    const mouthHole = new THREE.Mesh(new THREE.CircleGeometry(R * 0.13, 20), holeMat);
    mouthHole.position.set(0, HC.y - R * 0.46, R * 1.02);
    part(mouthHole);
  }

  // ---------- מגן זכוכית עגול ----------
  // לוין - "על הראש מגן זכוכית עגול שמחובר לחליפה". כיפת זכוכית
  // שקופה-למחצה מעל הראש (לא כדור שלם - חצי עליון בלבד, אחרת הצד
  // האחורי היה נראה כמו בועה סגורה מוזרה מכל זווית), וטבעת מתכת צווארון
  // בבסיס הצוואר שנותנת את הרושם של "מחובר לחליפה" מתחתיו.
  if (cfg.glassDome) {
    const domeMat = new THREE.MeshStandardMaterial({
      color: cfg.domeColor ?? 0xaee6f5, roughness: 0.08, metalness: 0.1,
      transparent: true, opacity: 0.35, side: THREE.DoubleSide,
    });
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(R * 1.05, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.62), domeMat);
    dome.position.set(0, HC.y + R * 0.20, 0);
    dome.rotation.x = -0.12;
    part(dome);

    const collarMat = new THREE.MeshStandardMaterial({
      color: cfg.maskColor ?? 0xc0c0c8, roughness: 0.25, metalness: 0.55,
    });
    const collar = new THREE.Mesh(new THREE.TorusGeometry(R * 0.95, R * 0.12, 12, 24), collarMat);
    collar.position.set(0, HC.y - R * 0.68, 0);
    collar.rotation.x = Math.PI / 2;
    collar.castShadow = true;
    part(collar);
  }

  // ---------- שיער ----------
  // ברפרנס נפח השיער גדול ומקיף — הוא מה שנותן את הצללית, לא ראש גדול.
  // הכיפה מוטה לאחור: קו השיער בחזית עולה מעל המצח, ובעורף הוא יורד נמוך.
  // בלי ההטיה נוצר "קסדה" עם פס כהה חוצה שמסתיר את העיניים.
  // ⚠️ ראש שטוח ורחב (cfg.headSquish) + הכיפה הזו יחד כיסו את כל הפנים,
  // כולל העין היחידה של סלייקי - נראה ברינדור (לא ניתן לחישוב מראש בלי
  // לראות). הכיפה מדלגת שם - נשארים רק קוצי השיער הבודדים למטה, שנותנים
  // מראה של "כתר קוצים" במקום קסדה שלמה, ולא קוברים את הפנים.
  if (!cfg.headSquish && !cfg.bald) {
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(R * 1.02, 34, 26, 0, Math.PI * 2, 0, Math.PI * 0.54), hairMat);
    cap.position.copy(HC);
    cap.position.y += R * 0.06;
    cap.position.z -= R * 0.21;
    cap.rotation.x = -0.44;
    // מסת השיער רחבה מהגולגולת עצמה — ברפרנס היא מה שנותן לראש את הנוכחות.
    cap.scale.set(headScale.x * 1.04, headScale.y * 1.02, headScale.z * 1.04);
    cap.castShadow = true;
    part(cap);
  }

  // דמות קירחת (cfg.bald, קולין) - מדלגת על כל קווצות השיער (לא רק
  // הכיפה למעלה). בלי הדגל הזה, אי-הגדרת hairStyle עדיין הייתה נופלת
  // ל-branch ברירת המחדל (תלתול) למטה, לא משאירה ראש חלק.
  const hx = R * headScale.x * 1.24, hy = R * headScale.y * 1.06, hz = R * headScale.z * 1.14;
  const RINGS = cfg.bald ? [] : [
    { phi: 0.18, count: 7 }, { phi: 0.42, count: 12 }, { phi: 0.66, count: 16 },
    { phi: 0.90, count: 19 }, { phi: 1.14, count: 21 }, { phi: 1.38, count: 21 },
    { phi: 1.60, count: 18 },
  ];
  RINGS.forEach(({ phi, count }) => {
    for (let i = 0; i < count; i++) {
      const theta = (i / count) * Math.PI * 2 + phi * 1.7;
      const lx = Math.sin(phi) * Math.cos(theta) * hx;
      const ly = Math.cos(phi) * hy;
      const lz = Math.sin(phi) * Math.sin(theta) * hz;
      // קו השיער: בחזית הוא נעצר גבוה (מעל הגבות), בצדדים ובעורף הוא יורד
      if (lz > R * 0.15 && ly < R * 0.82 - lz * 0.20) continue;

      const jit = () => (rand() - 0.5) * R * 0.18;
      const px = HC.x + lx * 1.16 + jit();
      const py = HC.y + ly * 1.14 + jit() + R * 0.06;
      const pz = lz * 1.16 + jit() - R * 0.04;

      if (cfg.hairStyle === 'spiky') {
        const d = V(lx, ly, lz).normalize();
        part(sweep(hairMat,
          [V(px, py, pz),
           V(px + d.x * R * 0.34, py + d.y * R * 0.34, pz + d.z * R * 0.34),
           V(px + d.x * R * 0.76, py + d.y * R * 0.76, pz + d.z * R * 0.76)],
          [pr(0, 0.25, 0.25), pr(0.55, 0.14, 0.14), pr(1, 0.02, 0.02)],
          { steps: 8, radial: 12, capEnd: 'round', domeScale: 0.5 }));
      } else if (cfg.hairStyle === 'long') {
        // שיער ארוך גדל רק מהחצי האחורי של הראש (קו שביל באמצע) ונופל
        // בכבידה כלפי מטה. בלי הסינון הזה שיער שגדל בחזית פשוט נופל *מול*
        // הפנים ומכסה אותן לגמרי - זה בדיוק מה שקרה בניסיון הראשון.
        if (lz > -R * 0.02) continue;
        const d = V(lx, ly, lz).normalize();
        const out = R * (0.32 + rand() * 0.12);
        const fall = R * (3.6 + rand() * 0.9);
        const wave = (rand() - 0.5) * R * 0.55;
        const thick = 0.075 + rand() * 0.03;

        part(sweep(hairMat, [
          V(px, py, pz),
          V(px + d.x * out + wave * 0.3, py - fall * 0.45, pz + d.z * out),
          V(px + d.x * out * 0.4 + wave, py - fall, pz + d.z * out * 0.4),
        ], [
          pr(0, thick, thick), pr(0.5, thick * 0.8, thick * 0.8), pr(1, thick * 0.32, thick * 0.32),
        ], { steps: 16, radial: 10, capStart: 'round', capEnd: 'round', domeScale: 0.8 }));
      } else if (cfg.hairStyle === 'short') {
        // שיער שמגיע עד לאוזניים: קצר מכדי לכסות את הפנים בכלל, אז אין
        // צורך בסינון החצי-אחורי כמו בשיער הארוך - גדל מכל נקודת שורש
        // (הסינון הכללי של אזור הפנים כבר חל למעלה, כמו אצל תלתול/קוץ).
        const d = V(lx, ly, lz).normalize();
        const out = R * (0.20 + rand() * 0.10);
        const fall = R * (0.60 + rand() * 0.22);
        const thick = 0.09 + rand() * 0.03;

        part(sweep(hairMat, [
          V(px, py, pz),
          V(px + d.x * out, py - fall * 0.5, pz + d.z * out),
          V(px + d.x * out * 0.6, py - fall, pz + d.z * out * 0.6),
        ], [
          pr(0, thick, thick), pr(0.5, thick * 0.85, thick * 0.85), pr(1, thick * 0.4, thick * 0.4),
        ], { steps: 10, radial: 8, capStart: 'round', capEnd: 'round', domeScale: 0.8 }));
      } else {
        // תלתל = קשת קצרה שמתעגלת סביב הגולגולת, לא כדור.
        // אשכול כדורים אחידים נראה כמו פאה; קשתות בגדלים ובכיוונים משתנים
        // נותנות את מסת התלתלים הרופפת שברפרנס.
        const d = V(lx, ly, lz).normalize();
        let tang = new THREE.Vector3().crossVectors(d, V(0, 1, 0));
        if (tang.lengthSq() < 0.05) tang.set(1, 0, 0);
        tang.normalize();
        const bend = (rand() - 0.5) * 2;
        const len = R * (0.30 + rand() * 0.18);
        const thick = 0.135 + rand() * 0.065;

        part(sweep(hairMat, [
          V(px, py, pz),
          V(px + d.x * len * 0.55 + tang.x * len * 0.5 * bend,
            py + d.y * len * 0.55 + tang.y * len * 0.5 * bend + len * 0.12,
            pz + d.z * len * 0.55 + tang.z * len * 0.5 * bend),
          V(px + d.x * len * 0.55 + tang.x * len * 1.15 * bend,
            py + d.y * len * 0.30 + tang.y * len * 1.15 * bend - len * 0.20,
            pz + d.z * len * 0.55 + tang.z * len * 1.15 * bend),
        ], [
          pr(0, thick * 0.85, thick * 0.85), pr(0.45, thick, thick), pr(1, thick * 0.62, thick * 0.62),
        ], { steps: 10, radial: 14, capStart: 'round', capEnd: 'round', domeScale: 0.9 }));
      }
    }
  });

  // ---------- קשת לשיער ----------
  // שתי "לולאות" סרט (כדורים שטוחים, לא טורוס - פשוט לבנייה ומספיק כדי
  // לקרוא כפיונית) שנפתחות מקשר קטן באמצע, יושבות על קודקוד הראש.
  if (cfg.hairBow) {
    const bowMat = M(cfg.hairBowColor ?? 0xe8659a, 0.55);
    [-1, 1].forEach((s) => {
      const loop = new THREE.Mesh(new THREE.SphereGeometry(0.044, 14, 10), bowMat);
      loop.scale.set(1, 0.55, 0.65);
      loop.position.set(HC.x + s * 0.040, HC.y + R * 1.00, R * 0.10);
      loop.rotation.z = s * 0.55;
      loop.castShadow = true;
      part(loop);
    });
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.020, 10, 8), bowMat);
    knot.position.set(HC.x, HC.y + R * 0.99, R * 0.10);
    knot.castShadow = true;
    part(knot);
  }

  // ---------- כובע סיני חרוטי ----------
  // לונג - "כובע סיני צהוב". חרוט רחב ושטוח (כמו דוֹלִי/כובע קש סיני)
  // עם שוליים גליליים נמוכים בבסיסו, יושב על קודקוד הראש.
  if (cfg.conicalHat) {
    const hatMat = M(cfg.hatColor ?? 0xe8c93a, 0.6);
    const hat = new THREE.Mesh(new THREE.ConeGeometry(R * 1.35, R * 0.85, 24), hatMat);
    hat.position.set(0, HC.y + R * 1.25, R * 0.05);
    hat.castShadow = true;
    part(hat);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.35, R * 1.35, R * 0.06, 24), hatMat);
    brim.position.set(0, HC.y + R * 0.85, R * 0.05);
    brim.castShadow = true;
    part(brim);
  }

  // ---------- כובע פטרייה ----------
  // מוקרוט - "פטרייה על הראש": כיפה רחבה ושטוחה (כמו כובע פטרייה) על
  // "גבעול" גליל קצר, יושבת על קודקוד הראש. מוכפל ב-headMult כמו כל
  // שאר תווי הראש, כדי שיישאר יחסי לראש הענק.
  if (cfg.mushroomCap) {
    const capMat = M(cfg.mushroomCapColor ?? 0xb8304a, 0.6);
    const stemMat = M(cfg.mushroomStemColor ?? 0xf2ead6, 0.7);
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(R * 0.95 * headMult, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), capMat);
    cap.position.set(0, HC.y + R * 1.15 * headMult, 0);
    cap.scale.set(1.35, 0.75, 1.35);
    cap.castShadow = true;
    part(cap);
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(R * 0.28 * headMult, R * 0.34 * headMult, R * 0.35 * headMult, 16), stemMat);
    stem.position.set(0, HC.y + R * 0.95 * headMult, 0);
    stem.castShadow = true;
    part(stem);
    if (cfg.mushroomSpots) {
      const spotMat = M(0xf5efe0, 0.5);
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        const spot = new THREE.Mesh(new THREE.SphereGeometry(R * 0.10 * headMult, 10, 8), spotMat);
        spot.position.set(
          Math.cos(ang) * R * 0.65 * headMult, HC.y + R * 1.25 * headMult, Math.sin(ang) * R * 0.65 * headMult);
        part(spot);
      }
    }
  }

  // ---------- שורשים ירוקים מהגב ----------
  // מוקרוט - "מהגב שלו צומחים שורשים קטנים וירוקים שזזים כשהוא זז".
  // כמה קווצות דקות ומעוקלות מנקודת עוגן אחת על עצם החזה (כמו הכנפיים
  // של נייטווינג), פונות אחורה. התנועה בפועל ("שזזים") לא מומשה - אין
  // כרגע מנגנון אנימציית-משנה (secondary motion) לחלקים כאלה במשחק.
  if (cfg.backRoots) {
    BIND = { bone: 'chest' };
    const rootMat = M(cfg.rootColor ?? 0x3a7a3a, 0.7);
    [
      { ang: -0.30, len: 0.22 }, { ang: 0.10, len: 0.30 },
      { ang: 0.50, len: 0.20 }, { ang: 0.85, len: 0.26 },
    ].forEach(({ ang, len }, i) => {
      const s = i % 2 === 0 ? -1 : 1;
      const base = V(s * 0.05, S.chest.y - 0.05, S.chest.z - 0.06);
      const dir = V(Math.sin(ang) * s * 0.6, -0.3 - ang * 0.1, -0.7).normalize();
      const mid = base.clone().addScaledVector(dir, len * 0.6);
      const tip = base.clone().addScaledVector(dir, len);
      part(sweep(rootMat, [base, mid, tip], [
        { t: 0, rx: 0.018, rz: 0.018 }, { t: 0.6, rx: 0.012, rz: 0.012 }, { t: 1, rx: 0.003, rz: 0.003 },
      ], { steps: 10, radial: 8, refDir: V(0, 1, 0), capStart: 'round', domeScale: 0.6 }));
    });
  }

  return { group: g, parts };
}

// ============================================================================
//  הרכבת לוחם: דמות + שלד + הצמדת עור
// ============================================================================

const STANCE_YAW = 1.05;      // 3/4 - פונה ליריב אבל הפנים נראות למצלמה
const GROUND_Y = RING_TOP + 0.04;

function makeFighter(cfg, startX, facing, maxHp) {
  const { group, parts } = createFighter(cfg);
  const { bones, byName, root } = buildBones();
  group.add(root);
  group.position.set(startX, GROUND_Y, 0);
  group.rotation.y = facing * STANCE_YAW;
  scene.add(group);

  // חובה לפני החישוב: מטריצות העולם של העצמות ושל החלקים חייבות להיות עדכניות,
  // אחרת ההיפוכים של תנוחת הכריכה יוצאים שגויים והדמות מתפוצצת בפריים הראשון.
  scene.updateMatrixWorld(true);
  const skeleton = new THREE.Skeleton(bones);

  parts.forEach(({ m, bind }) => {
    if (bind.bone) {
      byName[bind.bone].attach(m);          // attach שומר על המיקום בעולם
    } else {
      const sm = toSkinned(m, bind.chain);
      group.remove(m);
      group.add(sm);
      sm.updateMatrixWorld(true);
      sm.bind(skeleton, sm.matrixWorld.clone());
    }
  });

  const near = facing > 0 ? 'L' : 'R';   // הצד שקרוב למצלמה — שם המכות נראות הכי טוב
  return {
    group, byName, skeleton,
    x: startX, facing, near,
    mv: 0, phase: 0, bob: 0,
    // side מתחיל בצד הרחוק, כדי שהאגרוף *הראשון* יהיה של היד הקרובה למצלמה
    action: null, actionT: 0, side: facing > 0 ? 'R' : 'L', hitDone: false,
    blocking: false, blockAmt: 0,
    cool: 0, think: 0, mode: 'wait', blockTimer: 0,
    hp: maxHp, maxHp, stoneMesh: null, forceWeaponVisible: false, damageDealt: 0,
    // powerMult/speedMult: מכפיל הכוח/מהירות המולד של הדמות (מה-cfg) כפול
    // בונוס השדרוגים שנקנו - ראה refreshPlayerCombatStats. אויבים נשארים על 1
    // (ברירת המחדל) כי מערכת השדרוגים היא רק לדמויות שהשחקן קנה.
    powerMult: 1, speedMult: 1,
    // קפיצה: jumpY זה הגובה הנוכחי מעל הקרקע, jumpVel המהירות האנכית -
    // פיזיקה פשוטה של כוח כלפי מעלה שדועך עם הזמן (ראה tickJump).
    jumping: false, jumpY: 0, jumpVel: 0,
  };
}

/**
 * נשקים — כל נשק בחנות שבאמת אפשר לצייד (dmg + build) מוגדר ב-WEAPON_CFGS
 * למטה. build() בונה קבוצה עם *האחיזה בראשית הצירים המקומית*, משתרעת
 * לכיוון +Y (כלפי מעלה) - בדיוק כמו שהאבן החדה המקורית נבנתה. addWeaponProp
 * מסובבת ומזיזה את הקבוצה כך ש-+Y יתיישר עם כיוון הזרוע (ממרפק לשורש כף
 * יד בתנוחת המנוחה - לא ניחוש, נגזר מהשלד) ותולה אותה קשיח על עצם שורש
 * כף היד הקרובה למצלמה, מוסתרת כברירת מחדל ומופיעה רק בזמן מכת הנשק
 * (`poseFighter` מדליק/מכבה `visible` לפי `f.action`).
 *
 * כרגע כל הנשקים חולקים את אותה אנימציית מכה (מה שהיה "מכת האבן") ואת
 * אותו טווח - רק הנזק (`f.weaponDmg`, נקרא ב-tickCombat) והמראה משתנים
 * לפי הנשק המצויד. אין עדיין אנימציה ייחודית לכל נשק (רובה שיורה, למשל) -
 * זה מעבר לאפיון הנוכחי.
 */
function weaponShaft(len, rad, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, len, 8),
    new THREE.MeshStandardMaterial({ color, roughness: 0.75 }));
  m.position.y = len / 2;
  m.castShadow = true;
  return m;
}
// חוד חד - הבסיס בראשית הצירים המקומית (לא במרכז הקונוס!) כדי שאפשר יהיה
// לסובב אותו סביב הבסיס (angleZ, לשיני קלשון/מכוש) בלי שהוא "יקפוץ" ממקומו.
function weaponSpike(len, rad, color, angleZ = 0) {
  const geo = new THREE.ConeGeometry(rad, len, 6);
  geo.translate(0, len / 2, 0);
  if (angleZ) geo.rotateZ(angleZ);
  const m = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.6, flatShading: true }));
  m.castShadow = true;
  return m;
}
// להב שטוח - בסיס ברוחב width ב-y=y0, מצטמצם ל-width*taper בקצה y0+len.
function weaponBlade(y0, len, width, color, taper = 0.3, thick = 0.012) {
  const shape = new THREE.Shape();
  shape.moveTo(-width / 2, 0);
  shape.lineTo(width / 2, 0);
  shape.lineTo(width * taper / 2, len);
  shape.lineTo(-width * taper / 2, len);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false });
  geo.translate(0, y0, -thick / 2);
  const m = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.65, flatShading: true }));
  m.castShadow = true;
  return m;
}
// ראש גרזן - טריז שבולט הצידה מהאחיזה (X) ומתעגל בחזרה, כמו להב גרזן אמיתי.
function weaponWedge(y0, len, width, color) {
  const shape = new THREE.Shape();
  shape.moveTo(0, y0);
  shape.lineTo(width, y0 + len * 0.28);
  shape.lineTo(width * 0.92, y0 + len * 0.72);
  shape.lineTo(0, y0 + len);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: len * 0.16, bevelEnabled: false });
  geo.translate(0, 0, -len * 0.08);
  const m = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.6, flatShading: true }));
  m.castShadow = true;
  return m;
}

function addWeaponProp(f, name) {
  const wristKey = 'wrist' + f.near, elbowKey = 'elbow' + f.near;
  const dir = J[wristKey].clone().sub(J[elbowKey]).normalize();
  const wCfg = WEAPON_CFGS[name];
  const group = wCfg.build();
  group.quaternion.setFromUnitVectors(V(0, 1, 0), dir);
  group.position.copy(dir.clone().multiplyScalar(wCfg.gripOffset ?? 0.05));
  group.visible = false;
  f.byName[wristKey].add(group);
  f.stoneMesh = group;
  f.weaponDmg = wCfg.dmg;
}

// (u0/u1 - החלק מתוך המשך שבו המכה בפועל "נוגעת"), נזק וטווח. גם poseFighter
// וגם מערכת הפגיעה קוראים מכאן, כדי שלא יהיו שני מספרים סותרים בשני מקומות.
// hitAt הוא סף, לא טווח: ברגע שהמכה עברה אותו, הפגיעה נבדקת בפריים הראשון
// שבו u עבר אותו. לא "בין X ל-Y", כי בקצב פריימים משתנה (מחשב איטי, לשונית
// ברקע) פריים בודד יכול "לדלג" מעל חלון צר לגמרי ולפספס אותו. hitDone כבר
// מבטיח שהפגיעה תיספר פעם אחת בלבד, אז אין צורך בגבול עליון בשביל זה.
const ATTACKS = {
  punch: { dur: 0.40, peak: 0.34, hitAt: 0.28, dmg: 3, range: 1.35 },
  kick:  { dur: 0.58, peak: 0.42, hitAt: 0.36, dmg: 5, range: 1.35 },
  stone: { dur: 0.50, peak: 0.40, hitAt: 0.34, dmg: 7, range: 1.55 },
};

const smoothstep = (a) => a * a * (3 - 2 * a);

/** עקומת מכה: יציאה מהירה, חזרה מעט איטית יותר. 0 → 1 → 0 */
function strike(u, peak) {
  const a = u < peak ? u / peak : 1 - (u - peak) / (1 - peak);
  return smoothstep(Math.max(0, Math.min(1, a)));
}

function startAction(f, kind) {
  if (f.action) return;
  f.action = kind;
  f.actionT = 0;
  f.hitDone = false;
  // אגרוף מתחלף בין הידיים; בעיטה ומכת האבן תמיד בצד שקרוב למצלמה
  f.side = kind === 'punch' ? (f.side === f.near ? (f.near === 'L' ? 'R' : 'L') : f.near) : f.near;
}

function poseFighter(f, t, dt) {
  const P = {};
  const rot = (n, x, y, z) => {
    const a = P[n] || (P[n] = [0, 0, 0]);
    a[0] += x; a[1] += y; a[2] += z;
  };
  let bob = 0;

  // ---------- נשימה ותנועת שמירה ----------
  // בלי זה הדמות נראית מתה כשלא לוחצים כלום.
  const br = Math.sin(t * 2.0 + f.facing);
  rot('spine', 0.016 * br, 0, 0);
  rot('chest', 0.030 * br, 0, 0);
  rot('shoulderL', 0.045 * br, 0, 0.028 * br);
  rot('shoulderR', 0.045 * br, 0, -0.028 * br);
  rot('elbowL', 0.05 * br, 0, 0);
  rot('elbowR', 0.05 * br, 0, 0);
  rot('head', -0.018 * br, 0, 0.012 * Math.sin(t * 1.3));
  bob += 0.006 * br;

  // ---------- הליכה ----------
  if (f.mv !== 0 && !f.action) {
    const s = Math.sin(f.phase);
    const c = Math.cos(f.phase);
    rot('hipL', -0.40 * s, 0, 0);
    rot('hipR', 0.40 * s, 0, 0);
    rot('kneeL', 0.42 * Math.max(0, s), 0, 0);
    rot('kneeR', 0.42 * Math.max(0, -s), 0, 0);
    rot('ankleL', -0.18 * Math.max(0, s), 0, 0);
    rot('ankleR', -0.18 * Math.max(0, -s), 0, 0);
    // הכתפיים מתנדנדות הפוך לרגליים — זה מה שהופך צעידה לטבעית
    rot('shoulderL', 0.13 * s, 0, 0);
    rot('shoulderR', -0.13 * s, 0, 0);
    rot('spine', 0, -0.06 * s, 0);
    bob -= 0.020 * Math.abs(c);
  }

  // ---------- חסימה: איקס עם הידיים ----------
  // הזוויות נמצאו בניסוי (רונדרו כמה אפשרויות וצולמו ישר מהחזית, לא נוחשו
  // "בעיניים עצומות"): כל כתף מסתובבת חזק גם קדימה-מעלה (x שלילי) וגם לצד
  // הנגדי של הגוף (z), עד שהאמות חוצות זו את זו ונפגשות גבוה ליד הסנטר.
  // סימני ה-z הפוכים בין שמאל לימין, ולכן הן חוצות ולא רק נפגשות באמצע.
  const k = f.blockAmt;
  if (k > 0.001) {
    rot('shoulderL', -1.50 * k, 0, 1.90 * k);
    rot('shoulderR', -1.50 * k, 0, -1.90 * k);
    rot('elbowL', 2.05 * k, 0, 0);
    rot('elbowR', 2.05 * k, 0, 0);
    rot('spine', -0.10 * k, 0, 0);
    rot('neck', 0.15 * k, 0, 0);
    rot('kneeL', 0.15 * k, 0, 0);
    rot('kneeR', 0.15 * k, 0, 0);
    bob -= 0.035 * k;
  }

  // ---------- מכות ----------
  if (f.action === 'punch') {
    const a = strike(f.actionT / ATTACKS.punch.dur, ATTACKS.punch.peak);
    const S = f.side === 'L' ? 1 : -1;      // לאיזה צד הגוף מתפתל
    const sh = 'shoulder' + f.side, el = 'elbow' + f.side;
    const oSh = 'shoulder' + (f.side === 'L' ? 'R' : 'L');

    // הזוויות לא נוחשו: הן נפתרו. במנוחה האמה מצביעה (0.094,0.180,0.107),
    // וסיבוב של +1.0 סביב X מיישר אותה קדימה — לכן שני המספרים כאן תמיד
    // מסתכמים ב-1.0, וזה מה ששומר על אגרוף *ישר* ולא אלכסוני.
    // הזרוע העליונה נשארת בכוונה נמוכה: הרמה מלאה לאופק קורעת את כתפיית
    // הגופייה, כי הבד מוצמד לגוף והזרוע עוברת דרכו.
    rot(sh, -0.75 * a, 0, -0.10 * a * S);
    rot(el, 1.75 * a, 0, 0);                // האמה נפתחת קדימה — זה עיקר המכה
    rot(oSh, 0.16 * a, 0, 0);               // היד השנייה נמשכת אחורה לאיזון
    rot('chest', 0, 0.30 * a * S, 0);
    rot('spine', 0, 0.15 * a * S, 0);
    rot('root', 0, 0.08 * a * S, 0);
    rot('head', 0, 0.09 * a * S, 0);
    rot('knee' + (f.side === 'L' ? 'R' : 'L'), 0.10 * a, 0, 0);
  }

  if (f.action === 'kick') {
    const u = f.actionT / ATTACKS.kick.dur;
    const a = strike(u, ATTACKS.kick.peak);
    const hip = 'hip' + f.side, knee = 'knee' + f.side;
    const oHip = 'hip' + (f.side === 'L' ? 'R' : 'L');
    const oKnee = 'knee' + (f.side === 'L' ? 'R' : 'L');

    // הברך מתכופפת בהרמה ואז נפתחת בשיא — ככה בעיטה נראית כמו שוט ולא כמו מוט
    // -1.45 מרים את הירך עד שכף הרגל מגיעה לגובה האגן (y≈0.60, z≈0.56).
    // פחות מזה והבעיטה נראית כמו צעד גדול, לא כמו בעיטה.
    rot(hip, -1.45 * a, 0, 0);
    rot(knee, 0.95 * strike(u, 0.16) * (1 - a), 0, 0);
    rot('ankle' + f.side, -0.25 * a, 0, 0);
    rot(oHip, 0.14 * a, 0, 0);              // רגל התמיכה נשענת אחורה
    rot(oKnee, 0.22 * a, 0, 0);
    rot('spine', -0.26 * a, 0, 0);          // הגוף נשען אחורה כנגד המשקל
    rot('chest', -0.12 * a, 0, 0);
    rot('shoulderL', -0.20 * a, 0, 0);
    rot('shoulderR', -0.20 * a, 0, 0);
    bob -= 0.030 * a;
  }

  // ---------- מכת האבן החדה ----------
  // מכה גדולה מהאגרוף: הכתף נפתחת רחוק יותר קדימה, מתפתלת יותר חזק, והגוף
  // רוכן קדימה איתה (spine/chest חיוביים - הפוך מהבעיטה, ששם הגוף נשען
  // אחורה). זה מה שהופך את זה מ"אגרוף גדול" למכת ריסוק עם משקל.
  if (f.action === 'stone') {
    const a = strike(f.actionT / ATTACKS.stone.dur, ATTACKS.stone.peak);
    const S = f.side === 'L' ? 1 : -1;
    const sh = 'shoulder' + f.side, el = 'elbow' + f.side;
    const oSh = 'shoulder' + (f.side === 'L' ? 'R' : 'L');

    rot(sh, -1.30 * a, 0, -0.22 * a * S);
    rot(el, 1.55 * a, 0, 0);
    rot(oSh, 0.20 * a, 0, 0.18 * a * S);
    rot('chest', 0.16 * a, 0.34 * a * S, 0);
    rot('spine', 0.10 * a, 0.18 * a * S, 0);
    rot('root', 0, 0.10 * a * S, 0);
    rot('head', 0.08 * a, 0.10 * a * S, 0);
    rot('knee' + (f.side === 'L' ? 'R' : 'L'), 0.14 * a, 0, 0);
    bob -= 0.02 * a;
  }
  if (f.stoneMesh) f.stoneMesh.visible = f.action === 'stone' || f.forceWeaponVisible;

  // ---------- החלה עם החלקה ----------
  // בלי ההחלקה כל מעבר מצב היה קופץ בפריים אחד. עם החלקה חזקה זה עדיין חד,
  // אבל בלי קפיצות.
  const K = 1 - Math.exp(-dt * 24);
  const Z = [0, 0, 0];
  for (const n of BONE_NAMES) {
    const b = f.byName[n];
    const tg = P[n] || Z;
    b.rotation.x += (tg[0] - b.rotation.x) * K;
    b.rotation.y += (tg[1] - b.rotation.y) * K;
    b.rotation.z += (tg[2] - b.rotation.z) * K;
  }
  f.bob += (bob - f.bob) * K;
  f.byName.root.position.y = J.root.y + f.bob + f.jumpY;
}

// ============================================================================
//  שליטה ותנועה בזירה
// ============================================================================

const KEYS = {};
const WATCHED = ['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyS', 'KeyD', 'KeyW', 'Space'];
// jumpRequested נדלק פעם אחת בלבד בלחיצה (לא כל עוד המקש לחוץ) - אחרת קפיצה
// הייתה יוצאת מיד שוב כשנוגעים בקרקע ומחזיקים את המקש.
let jumpRequested = false;
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !KEYS[e.code]) jumpRequested = true;
  KEYS[e.code] = true;
  if (WATCHED.includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });

const WALK_SPEED = 1.95;
const BLOCK_SPEED = 0.75;
const MIN_GAP = 0.95;                 // כמה קרוב מותר להתקרב — בלי לעבור דרך היריב
const EDGE = RING_HALF - 0.75;

// ---------- קפיצה ----------
// פיזיקה פשוטה: מהירות כלפי מעלה שדועכת עם הזמן (כובד המשיכה), בדיוק כמו
// קפיצה אמיתית - קופצים, מאטים, ונופלים בחזרה. jumpY/jumpVel נמצאים על
// הלוחם עצמו (ראה makeFighter) כדי שגם השחקן וגם האויב יוכלו לקפוץ בעתיד,
// למרות שכרגע רק Space של השחקן קורא ל-startJump.
const JUMP_VELOCITY = 3.4;
const GRAVITY = 9.2;

function startJump(f) {
  if (f.jumping) return;
  f.jumping = true;
  f.jumpVel = JUMP_VELOCITY;
}

function tickJump(f, dt) {
  if (!f.jumping) return;
  f.jumpVel -= GRAVITY * dt;
  f.jumpY += f.jumpVel * dt;
  if (f.jumpY <= 0) { f.jumpY = 0; f.jumpVel = 0; f.jumping = false; }
}

function moveFighter(f, other, dt) {
  // בונוס המהירות מהמשקה: 4 נקודות מהאפיון = 10% מהירות הליכה כל אחת,
  // כדי שההשפעה תורגש בלי להפוך את הדמות לבלתי נשלטת. speedMult הוא
  // הבונוס ה"מולד" של הדמות (מהירות הבסיס שלה + רמת שדרוג המהירות שנקנתה) -
  // ראה refreshPlayerCombatStats. אויבים נשארים על speedMult=1 (ברירת מחדל).
  const boost = (f.speedMult || 1) * (1 + (f.speedBonus || 0) * 0.10);
  const speed = (f.blocking ? BLOCK_SPEED : WALK_SPEED) * boost;
  let nx = f.x + f.mv * speed * dt;
  nx = Math.max(-EDGE, Math.min(EDGE, nx));
  // חוסם מעבר דרך היריב: כל אחד נשאר בצד שלו
  nx = f.facing > 0 ? Math.min(nx, other.x - MIN_GAP) : Math.max(nx, other.x + MIN_GAP);

  if (Math.abs(nx - f.x) < 1e-5) f.mv = 0;   // נלחץ בקיר → לא לצעוד במקום
  f.x = nx;
  f.group.position.x = nx;
  // הפאזה מתקדמת לפי כיוון ההליכה, כך שצעידה אחורה נראית אחורה
  if (f.mv !== 0) f.phase += dt * 8.5 * (f.mv * f.facing > 0 ? 1 : -1);
}

function updatePlayer(f, dt) {
  f.blocking = !!KEYS.KeyD && !f.action;
  if (!f.action && !f.blocking) {
    if (KEYS.KeyA) startAction(f, 'punch');
    else if (KEYS.KeyS) startAction(f, 'kick');
    else if (KEYS.KeyW) startAction(f, 'stone');
  }
  f.mv = f.action ? 0 : ((KEYS.ArrowRight ? 1 : 0) - (KEYS.ArrowLeft ? 1 : 0));
  if (jumpRequested) { jumpRequested = false; startJump(f); }
}

// ---------- בו: המחשב משחק ----------
// רמת קושי התחלתית: קלה בכוונה. ההפוגות ארוכות והוא לא רודף בלי הפסקה.
function updateEnemy(f, p, dt) {
  const dist = Math.abs(p.x - f.x);
  f.cool -= dt;
  f.think -= dt;
  f.blockTimer -= dt;

  if (f.action) { f.mv = 0; f.blocking = false; return; }

  // מגיב למכה של השחקן: לפעמים מרים ידיים
  if (p.action && dist < 2.0 && f.blockTimer < -0.2 && Math.random() < 0.05) f.blockTimer = 0.55;
  f.blocking = f.blockTimer > 0;
  if (f.blocking) { f.mv = 0; return; }

  if (dist < 1.55 && f.cool <= 0) {
    const r = Math.random();
    startAction(f, r < 0.48 ? 'punch' : r < 0.80 ? 'kick' : 'stone');
    f.cool = 1.0 + Math.random() * 1.2;
    f.mv = 0;
    return;
  }

  if (f.think <= 0) {
    f.think = 0.5 + Math.random() * 0.9;
    const r = Math.random();
    f.mode = dist > 2.3 ? 'approach'
           : dist < 1.25 ? 'retreat'
           : r < 0.45 ? 'approach' : r < 0.75 ? 'retreat' : 'wait';
  }
  const toward = Math.sign(p.x - f.x);
  f.mv = f.mode === 'approach' ? toward : f.mode === 'retreat' ? -toward : 0;
}

function tickAction(f, dt) {
  if (!f.action) return;
  f.actionT += dt;
  if (f.actionT >= ATTACKS[f.action].dur) { f.action = null; f.actionT = 0; }
}

// ============================================================================
//  חיים, נזק וסיום קרב
// ============================================================================

const hpFillEl = { player: document.getElementById('hpFillPlayer'), enemy: document.getElementById('hpFillEnemy') };
const hpNumEl  = { player: document.getElementById('hpNumPlayer'), enemy: document.getElementById('hpNumEnemy') };
const hitFlashEl = document.getElementById('hitFlash');
const shieldFlashEl = document.getElementById('shieldFlash');
const shieldToastEl = document.getElementById('shieldToast');
const gameOverEl = document.getElementById('gameOverOverlay');
const gameOverTitleEl = document.getElementById('gameOverTitle');
const gameOverGradeEl = document.getElementById('gameOverGrade');
const statPlayerLineEl = document.getElementById('statPlayerLine');
const statEnemyLineEl = document.getElementById('statEnemyLine');
const playAgainBtn = document.getElementById('playAgainBtn');

function updateHealthUI(f, who) {
  const pct = Math.max(0, f.hp / f.maxHp) * 100;
  hpFillEl[who].style.width = pct + '%';
  hpNumEl[who].textContent = f.hp + ' / ' + f.maxHp;
}

function flashHit() {
  hitFlashEl.classList.remove('show');
  void hitFlashEl.offsetWidth;          // מכריח את הדפדפן "לשכוח" את האנימציה הקודמת כדי שתתחיל שוב
  hitFlashEl.classList.add('show');
}

let gameOver = false;

/**
 * בודקת אם למכה הנוכחית של attacker יש "מגע" בפריים הזה: בתוך חלון הפגיעה
 * של האנימציה, בטווח מהיריב, ועוד לא הופעלה באותה מכה (hitDone). חסימה
 * מבטלת את הנזק לגמרי - זו הבחירה הפשוטה והברורה ביותר לילד: "אם חוסמים,
 * לא נפגעים".
 */
function tickCombat(attacker, defender, who, otherWho) {
  if (!attacker.action || attacker.hitDone) return;
  const cfg = ATTACKS[attacker.action];
  const u = attacker.actionT / cfg.dur;
  if (u < cfg.hitAt) return;
  if (Math.abs(attacker.x - defender.x) > cfg.range) return;

  attacker.hitDone = true;
  if (defender.blocking) return;

  // מכת נשק (W) לוקחת את הנזק מהנשק המצויד בפועל (`f.weaponDmg`, נקבע
  // ב-addWeaponProp) במקום מהמספר הקבוע ב-ATTACKS - כדי שנשק חזק יותר
  // שנקנה בחנות באמת יעשה יותר נזק, ולא מושפע מרמת הכוח של הדמות (שדרוגים
  // משפיעים רק על אגרוף ובעיטה). אגרוף ובעיטה כן מוכפלים ב-powerMult -
  // שילוב של כוח הבסיס של הדמות (cfg.power, ראה game-spec.md סעיף 3)
  // ורמת השדרוג שנקנתה (refreshPlayerCombatStats). בונוס הכוח מהמשקה
  // מתווסף בסוף כמספר קבוע (האפיון: "+3 כוח"), לא מוכפל.
  const isWeaponHit = attacker.action === 'stone' && attacker.weaponDmg != null;
  const base = isWeaponHit ? attacker.weaponDmg : cfg.dmg * (attacker.powerMult || 1);
  // powerMult יכול לצאת עם שברים (בונוס 5% לרמת שדרוג) - מעגלים למספר שלם
  // כדי שפס החיים תמיד יציג מספר עגול, לא עשרוני.
  const dmg = Math.round(base + (attacker.powerBonus || 0));

  // מגן מהלוט: חוסם לגמרי, ואם יש לו יכולת מיוחדת - היא מופעלת כאן
  // אוטומטית, כי "נשק פגע במגן" זה בדיוק הרגע הזה (האפיון, סעיף 9).
  // שים לב להיפוך: היכולת פוגעת ב*תוקף*, ולכן פס החיים שמתעדכן הוא של
  // התוקף (`who`), ואם הוא נופל מזה - המנצח הוא בעל המגן (`otherWho`).
  if (defender.guardTimer > 0) {
    if (triggerShieldAbility(defender, attacker, dmg, who)) endGame(otherWho);
    return;
  }
  defender.hp = Math.max(0, defender.hp - dmg);
  attacker.damageDealt += dmg;
  updateHealthUI(defender, otherWho);
  flashHit();
  if (defender.hp <= 0) endGame(who);
}

// כסף מתקבל רק על ניצחון, לפי כמות הנזק שהשחקן גרם - בדיוק כמו שכתוב
// באפיון ("סכום הכסף תלוי... בכמות הנזק שהשחקן גרם"). מספר פשוט להבנה:
// 1₪ לכל נקודת נזק, אבל לא יותר מ-MAX_MONEY_PER_GAME בקרב אחד - בלי התקרה
// קרב יחיד יכול לתת המון כסף (עד 75, כל החיים של בו), וזה מרוקן מתוכן
// את הרעיון של "לנצח כמה פעמים כדי לחסוך".
const MAX_MONEY_PER_GAME = 52;   // פחות מ-53, לפי בקשת המשתמש
let money = 0;
const moneyBadgeEl = document.getElementById('moneyBadge');
function updateMoneyUI() { moneyBadgeEl.textContent = '💰 ' + money + '₪'; }

// ---------- אויבים לפי רמות ----------
// מנצחים אויב → עולים רמה והאויב הבא מחליף אותו. מפסידים → נשארים באותה
// רמה ואפשר לנסות שוב. אותו דפוס בדיוק כמו switchPlayerCharacter: `enemy`
// הוא let, מפרקים את המודל הישן ובונים חדש מהקונפיג של הרמה.
const hpNameEnemyEl = document.getElementById('hpNameEnemy');

function switchEnemy(levelIdx) {
  enemyLevel = Math.max(0, Math.min(ENEMY_LEVELS.length - 1, levelIdx));
  const lvl = ENEMY_LEVELS[enemyLevel];

  const oldX = enemy.x, oldFacing = enemy.facing, wasVisible = enemy.group.visible;
  scene.remove(enemy.group);
  enemy.group.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });

  enemy = makeFighter(lvl.cfg, oldX, oldFacing, lvl.hp);
  addStoneProp(enemy);
  enemy.group.visible = wasVisible;
  hpNameEnemyEl.textContent = lvl.name;
  updateHealthUI(enemy, 'enemy');
  updateBattleLabel();
}

function updateBattleLabel() {
  const lvl = ENEMY_LEVELS[enemyLevel];
  labelEl.textContent = '🥊 ' + selectedCharacterName + ' מול ' + lvl.name +
    ' - רמה ' + (enemyLevel + 1) + '/' + ENEMY_LEVELS.length;
}

// מערכת ציונים (game-spec.md סעיף 12: C/B/A/S/SS/SSS, מחושב לפי נזק
// שנגרם, נזק שהתקבל, כמה חיים נשארו, וניצחון/הפסד - "ביצועים מיוחדים"
// לא מומש, אין כרגע מנגנון למדוד את זה בנפרד). האפיון נותן את המרכיבים
// אבל לא נוסחה מדויקת - זו נוסחה שעוצבה כאן. אחוזים מתוך ה-hp המקסימלי
// (לא מספרי נזק גולמיים), כדי שקרב מול אויב עם הרבה יותר hp (כמו לוסטר,
// 440) לא ייתן ציון מנופח אוטומטית לעומת קרב מול אויב חלש.
function computeGrade(win) {
  const dmgDealtPct = Math.min(100, (player.damageDealt / enemy.maxHp) * 100);
  const dmgReceivedPct = Math.min(100, (enemy.damageDealt / player.maxHp) * 100);
  const hpRemainPct = Math.max(0, player.hp / player.maxHp) * 100;
  const points = dmgDealtPct - dmgReceivedPct * 0.5 + hpRemainPct * 0.5 + (win ? 60 : -20);
  if (points >= 180) return 'SSS';
  if (points >= 140) return 'SS';
  if (points >= 100) return 'S';
  if (points >= 60) return 'A';
  if (points >= 20) return 'B';
  return 'C';
}

// חיי ההתחלה = maxHp תמיד (resetGame ממלא חיים בתחילת כל קרב), וחיי
// הסיום = f.hp *ברגע endGame*, לפני ש-resetGame מאפס אותם לקרב הבא.
// ⚠️ ניסיון ראשון השתמש בחץ ("100 ⟵ 62") - עלול להתבלבל בטקסט עברי
// (RTL) עם ספרות (LTR) בתוכו. תוקן לניסוח מילולי רגיל, כמו שהמשתמש
// עצמו ניסח את הבקשה ("כמה חיים... התחיל... כמה... גמר").
function updateGameOverStats(win) {
  gameOverGradeEl.textContent = '⭐ ציון: ' + computeGrade(win);
  statPlayerLineEl.textContent =
    '🥊 ' + selectedCharacterName + ': התחיל עם ' + player.maxHp +
    ' חיים, סיים עם ' + Math.max(0, player.hp);
  statEnemyLineEl.textContent =
    '🥋 ' + ENEMY_LEVELS[enemyLevel].name + ': התחיל עם ' + enemy.maxHp +
    ' חיים, סיים עם ' + Math.max(0, enemy.hp);
}

function endGame(winnerWho) {
  gameOver = true;
  gameOverEl.classList.add('show');
  const win = winnerWho === 'player';
  updateGameOverStats(win);
  if (win) {
    money += Math.min(player.damageDealt, MAX_MONEY_PER_GAME);
    updateMoneyUI();
    const isLast = enemyLevel >= ENEMY_LEVELS.length - 1;
    gameOverTitleEl.textContent = isLast
      ? '👑 ניצחת את כולם!'
      : '🏆 ניצחון! הבא: ' + ENEMY_LEVELS[enemyLevel + 1].name;
    // עולים רמה רק אם יש עוד אויב. ההחלפה עצמה קורית ב-resetGame, כדי
    // שהאויב שהובס יישאר על המסך מאחורי מסך הניצחון עד הקרב הבא.
    if (!isLast) pendingEnemyLevel = enemyLevel + 1;
  } else {
    gameOverTitleEl.textContent = '❌ הפסד';
  }
}

// רמה שממתינה להחלפה בקרב הבא (null = אין שינוי)
let pendingEnemyLevel = null;

function resetGame() {
  if (pendingEnemyLevel !== null) {
    switchEnemy(pendingEnemyLevel);
    pendingEnemyLevel = null;
  }
  [[player, 'player', -1.7, 1], [enemy, 'enemy', 1.7, -1]].forEach(([f, who, x0]) => {
    f.hp = f.maxHp;
    f.x = x0;
    f.group.position.x = x0;
    f.action = null; f.actionT = 0; f.hitDone = false;
    f.blocking = false; f.blockAmt = 0;
    f.mv = 0; f.cool = 0; f.think = 0; f.mode = 'wait'; f.blockTimer = 0;
    f.damageDealt = 0;
    f.jumping = false; f.jumpY = 0; f.jumpVel = 0;
    // ההשפעות מהלוט הן לקרב אחד בלבד
    f.powerBonus = 0; f.speedBonus = 0; f.guardTimer = 0;
    f.activeShield = null;
    applyInvisibility(f);          // מחזיר שקיפות למצב הרגיל
    updateHealthUI(f, who);
  });
  // כל פריטי הלוט חוזרים - הם ירדו מהלוט של הקרב הקודם, לא מהמלאי הקבוע
  lootUsed.clear();
  renderLootBar();
  updateBuffRow();
  gameOverEl.classList.remove('show');
  gameOver = false;
}

function focusLobbyCamera() {
  const p = player.group.position;
  camera.position.set(p.x + 0.75, p.y + 1.30, 2.55);

  uiScreen = name;

  hpRowEl.style.display = inBattle ? '' : 'none';
  controlsEl.style.display = inBattle ? '' : 'none';
  labelEl.style.display = inBattle ? '' : 'none';
  // הלוט מוצג רק בקרב, ונבנה מחדש בכניסה אליו כדי לכלול פריטים שנקנו
  // בחנות מאז הקרב הקודם
  lootStackEl.style.display = inBattle ? '' : 'none';
  if (inBattle) { renderLootBar(); updateBuffRow(); }

  // בלובי: מתקרבים לדמות הנבחרת, מסתירים את בו, ומשאירים את האבן החדה
  // ביד - "רואים את הדמות ואת הנשק שאיתם משחקים", בלי לבנות שום דבר חדש.
  if (name === 'lobby') {
    enemy.group.visible = false;
    player.forceWeaponVisible = true;
    focusLobbyCamera();
  } else {
    enemy.group.visible = true;
    player.forceWeaponVisible = false;
    if (name === 'battle') {
      camera.position.copy(BATTLE_CAM.pos);
      camera.lookAt(BATTLE_CAM.look);
    }
  }
}

const CHARACTER_CFGS = {

  'פלייטי': PLAYTY_CFG, 'ליזי': LIZZY_CFG, 'ברטו': BERTO_CFG, 'סטנבר': STANBER_CFG,
  'סלייקי': SLAIKY_CFG, 'קיטי': KITTY_CFG, 'לוין': LEWIN_CFG,
};
const characterThumbs = {};
const THUMB_SIZE = 360;

function captureCharacterThumb(cfg) {
  const { group } = createFighter(cfg);
  group.position.set(0, GROUND_Y, 0);
  group.rotation.y = STANCE_YAW;
  scene.add(group);
  scene.updateMatrixWorld(true);

  const prevSize = new THREE.Vector2();
  renderer.getSize(prevSize);
  const prevAspect = camera.aspect;
  const prevPos = camera.position.clone();

  renderer.setSize(THUMB_SIZE, THUMB_SIZE, false);   // false = לא נוגע בגודל התצוגה של הקנבס
  camera.aspect = 1;
  camera.updateProjectionMatrix();
  camera.position.set(0.35, GROUND_Y + 1.33, 1.75);
  camera.lookAt(0.05, GROUND_Y + 1.02, 0);

  renderer.render(scene, camera);
  const dataUrl = renderer.domElement.toDataURL('image/png');

  renderer.setSize(prevSize.x, prevSize.y, false);
  camera.aspect = prevAspect;
  camera.updateProjectionMatrix();
  camera.position.copy(prevPos);
  scene.remove(group);
  return dataUrl;
}

function getCharacterThumb(name) {
  if (!CHARACTER_CFGS[name]) return null;
  if (!characterThumbs[name]) characterThumbs[name] = captureCharacterThumb(CHARACTER_CFGS[name]);
  return characterThumbs[name];
}
