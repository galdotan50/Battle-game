// ששת המגנים הזולים הם "הגנה" בלבד ולכן אין להם רשומה כאן.
const SHIELD_ABILITY = {
  'כדור מגן ענק מחשמל': { kind: 'bolt',    bolt: 15 },
  'מגן פלדה עם דבק':    { kind: 'glue',    pull: 0.55 },
  'מגן טיטניום משכפל':  { kind: 'reflect', mult: 2 },
  // "מחזיר, משכפל ומגיע עם אבן חדה" - ההחזרה והשכפול זהים למשכפל.
  // ה"אבן חדה" כבר שייכת לשחקן מתחילת המשחק, ולכן אין מה להוסיף שם.
  // ה"בלתי נראה" מיושם כשקיפות של הדמות כל עוד המגן פעיל.
  'מגן טיטניום בלתי נראה': { kind: 'reflect', mult: 2, invisible: true },
};

// משקה: +3 כוח ו-+4 מהירות לפי האפיון. "משקה אנרגיה" מתואר כ"מיוחד וחזק
// במיוחד", ולכן מקבל בונוס כפול.
const drinkBonus = (name) => (name === 'משקה אנרגיה'
  ? { power: 6, speed: 8 }
  : { power: 3, speed: 4 });

function lootItemsFor(key) {
  return SHOP_DATA[key].rows
    .map((r) => r[0])
    .filter((name) => inventory.has(key + ':' + name));
}

function useLootItem(key, name) {
  const id = key + ':' + name;
  if (lootUsed.has(id) || gameOver || uiScreen !== 'battle') return;
  lootUsed.add(id);

  if (key === 'food') {
    const heal = firstNum(SHOP_DATA.food.rows.find((r) => r[0] === name)[1]);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    updateHealthUI(player, 'player');
  } else if (key === 'drinks') {
    const bonus = drinkBonus(name);
    player.powerBonus = (player.powerBonus || 0) + bonus.power;
    player.speedBonus = (player.speedBonus || 0) + bonus.speed;
  } else if (key === 'shields') {
    // מצטבר, כדי ששני מגנים ברצף לא "יבטלו" זה את זה
    player.guardTimer = (player.guardTimer || 0) + (SHIELD_SECONDS[name] ?? 3);
    player.activeShield = name;          // קובע איזו יכולת מיוחדת תופעל
    applyInvisibility(player);
  }
  renderLootBar();
  updateBuffRow();
}

function renderLootBar() {
  lootBarEl.innerHTML = '';
  const groups = [
    ['food', '🍎', (n) => '+' + firstNum(SHOP_DATA.food.rows.find((r) => r[0] === n)[1]) + ' חיים'],
    ['drinks', '🥤', (n) => { const bo = drinkBonus(n); return '+' + bo.power + ' כוח'; }],
    // מגן עם יכולת מיוחדת מסומן באייקון שלה, כדי שיהיה ברור שהוא לא
    // "עוד מגן" אלא עושה משהו נוסף כשחוסמים איתו
    ['shields', '🛡️', (n) => {
      const ab = SHIELD_ABILITY[n];
      const icon = ab ? ({ bolt: '⚡', glue: '🧲', reflect: '🔁' })[ab.kind] + ' ' : '';
      return icon + (SHIELD_SECONDS[n] ?? 3) + ' שנ׳';
    }],
  ];
  groups.forEach(([key, icon, effectText]) => {
    lootItemsFor(key).forEach((name) => {
      const used = lootUsed.has(key + ':' + name);
      const btn = document.createElement('button');
      btn.className = 'lootItem';
      btn.disabled = used;
      btn.innerHTML = `<span class="lootIcon">${icon}</span>` +
        `<span class="lootName">${name}</span>` +
        `<span class="lootEffect">${used ? 'נוצל' : effectText(name)}</span>`;
      btn.addEventListener('click', () => useLootItem(key, name));
      lootBarEl.appendChild(btn);
    });
  });
}

// "מגן טיטניום בלתי נראה": הדמות נעשית שקופה למחצה כל עוד המגן פעיל.
// עובר על כל החומרים של הדמות פעם אחת ומדליק/מכבה שקיפות.
function applyInvisibility(f) {
  const want = !!(f.guardTimer > 0 && SHIELD_ABILITY[f.activeShield]?.invisible);
  if (f.isInvisible === want) return;
  f.isInvisible = want;
  f.group.traverse((o) => {
    if (!o.material) return;
    if (o.material.userData.baseOpacity === undefined) {
      o.material.userData.baseOpacity = o.material.opacity;
      o.material.userData.wasTransparent = o.material.transparent;
    }
    o.material.transparent = want || o.material.userData.wasTransparent === true;
    o.material.opacity = want ? o.material.userData.baseOpacity * 0.35
                              : o.material.userData.baseOpacity;
    o.material.needsUpdate = true;
  });
}

function showShieldToast(text) {
  shieldToastEl.textContent = text;
  shieldToastEl.classList.remove('show');
  void shieldToastEl.offsetWidth;
  shieldToastEl.classList.add('show');
  shieldFlashEl.classList.remove('show');
  void shieldFlashEl.offsetWidth;
  shieldFlashEl.classList.add('show');
}

/**
 * מופעלת אוטומטית ברגע שמכה נחסמה על ידי מגן פעיל (ראה tickCombat).
 * `blocked` הוא הנזק שהמכה *הייתה* עושה - המגן המשכפל מחזיר אותו כפול.
 * מחזירה true אם התוקף הובס מהיכולת עצמה.
 */
function triggerShieldAbility(defender, attacker, blocked, attackerWho) {
  const ab = SHIELD_ABILITY[defender.activeShield];
  if (!ab) return false;
  let back = 0, msg = '';

  if (ab.kind === 'bolt') {
    back = ab.bolt;
    msg = '⚡ ברק! -' + back;
  } else if (ab.kind === 'glue') {
    // הנשק נדבק והאויב נמשך אל המגן, ואז הנשק גורם לו נזק
    const dir = defender.x > attacker.x ? 1 : -1;
    attacker.x += dir * ab.pull;
    attacker.group.position.x = attacker.x;
    back = blocked;
    msg = '🧲 נדבק ונמשך! -' + back;
  } else if (ab.kind === 'reflect') {
    back = blocked * ab.mult;
    msg = '🔁 הוחזר כפול! -' + back;
  }

  if (back > 0) {
    attacker.hp = Math.max(0, attacker.hp - back);
    defender.damageDealt += back;         // נחשב לשחקן לצורך הכסף בסוף הקרב
    updateHealthUI(attacker, attackerWho);
  }
  showShieldToast(msg);
  return attacker.hp <= 0;
}

function updateBuffRow() {
  const bits = [];
  if (player.powerBonus) bits.push('💪 +' + player.powerBonus + ' כוח');
  if (player.speedBonus) bits.push('⚡ +' + player.speedBonus + ' מהירות');
  if (player.guardTimer > 0) bits.push('🛡️ מגן ' + player.guardTimer.toFixed(1) + ' שנ׳');
  buffRowEl.textContent = bits.join('   ·   ');
}

// ---------- בחירת דמות ונשק בלובי ----------
// כל דמות/נשק שהשחקן כבר קנה (ויש לו קונפיג/בנייה אמיתית) אפשר לבחור.
// לפני זה קנייה לא עשתה כלום מעבר לתמונה בחנות - עכשיו זה משפיע בפועל.
// WEAPON_CFGS (מוגדר למעלה, ליד addWeaponProp) מגדיר את כל 10 הנשקים
// שבאמת אפשר לצייד - כולם עכשיו בנויים בתלת-מימד ומשפיעים על הנזק בקרב.
const WEAPON_ICON = {
  'אבן חדה': '🪨', 'גרזן': '🪓', 'פיקקס': '⛏️', 'חניט': '🥢', 'כידון': '🎯',
  'כילשון': '🔱', 'סכין מחודד': '🔪', 'חרב': '⚔️', 'קטאנה': '🗡️', 'רובה': '🔫',
};

function removeWeaponProp(f) {
  if (!f.stoneMesh) return;
  f.stoneMesh.parent?.remove(f.stoneMesh);
  // עכשיו f.stoneMesh יכולה להיות קבוצה עם כמה חלקים (לא רק מש בודד כמו
  // שהאבן החדה הייתה) - traverse מנקה גם את עצמה וגם את כל הילדים.
  f.stoneMesh.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  f.stoneMesh = null;
}

let selectedCharacterName = 'סווארק';
let selectedWeaponName = 'אבן חדה';

// ============================================================================
//  שדרוגים — לכל דמות שקנית יש רמת כוח ורמת מהירות משלה, נפרדות זו מזו.
//  הכוח/מהירות הבסיסיים (cfg.power/cfg.speed) מגיעים מהטבלה ב-game-spec.md
//  סעיף 3 (0-10, סווארק=5/5 הוא קו הבסיס) - עד עכשיו המספרים האלה היו רק
//  טקסט בחנות, בלי שום השפעה על הקרב. עכשיו יש: כוח = בעיטה ואגרוף חזקים
//  יותר ("חוץ מהנשקים" - נזק נשק לא מושפע), מהירות = תזוזה מהירה יותר.
//  שתי הרמות (כוח, מהירות) נפרדות לגמרי לכל דמות, כל אחת 1 עד
//  MAX_UPGRADE_LEVEL, וכל אחת עולה כסף בנפרד וקונים אותה בנפרד בחנות.
// ============================================================================
const MAX_UPGRADE_LEVEL = 11;
const characterLevels = {};   // name -> { power: 1..11, speed: 1..11 }

function getLevels(name) {
  if (!characterLevels[name]) characterLevels[name] = { power: 1, speed: 1 };
  return characterLevels[name];
}

// עולה יותר ככל שמשדרגים יותר: 10₪ לרמה 1→2, 20₪ לרמה 2→3, ... 100₪ לרמה 10→11
const upgradeCost = (level) => level * 10;

// רמה 1 = בלי שום בונוס שדרוג (רק כוח/מהירות הבסיס של הדמות עצמה). כל
// רמה מעל 1 מוסיפה עוד 5% - ברמה 11 (המקסימום) זה +50% מעל הבסיס.
const LEVEL_BONUS_PER_STEP = 0.05;

// מחשבת מחדש את powerMult/speedMult של player הנוכחי מתוך cfg.power/speed
// והרמות שנקנו - נקראת אחרי בחירת דמות ואחרי כל שדרוג שנקנה.
function refreshPlayerCombatStats() {
  const cfg = CHARACTER_CFGS[selectedCharacterName];
  const lv = getLevels(selectedCharacterName);
  const basePower = (cfg?.power ?? 5) / 5;   // יחסית לסווארק (5/10) = 1
  const baseSpeed = (cfg?.speed ?? 5) / 5;
  player.powerMult = basePower * (1 + LEVEL_BONUS_PER_STEP * (lv.power - 1));
  player.speedMult = baseSpeed * (1 + LEVEL_BONUS_PER_STEP * (lv.speed - 1));
}

// stat: 'power' או 'speed'. מחזירה false אם אין מספיק כסף (הכפתור ירעיד).
function upgradeCharacter(name, stat) {
  const lv = getLevels(name);
  const level = lv[stat];
  if (level >= MAX_UPGRADE_LEVEL) return false;
  const cost = upgradeCost(level);
  if (money < cost) return false;
  money -= cost;
  lv[stat] = level + 1;
  updateMoneyUI();
  if (name === selectedCharacterName) refreshPlayerCombatStats();
  return true;
}

const loadoutLabelEl = document.getElementById('loadoutLabel');
const weaponLabelEl = document.getElementById('weaponLabel');
const hpNamePlayerEl = document.getElementById('hpNamePlayer');
const charPrevBtn = document.getElementById('charPrevBtn');
const charNextBtn = document.getElementById('charNextBtn');
const weaponPrevBtn = document.getElementById('weaponPrevBtn');
const weaponNextBtn = document.getElementById('weaponNextBtn');
const weaponKeyLegendEl = document.getElementById('weaponKeyLegend');

const ownedCharacterNames = () =>
  Object.keys(CHARACTER_CFGS).filter((n) => inventory.has('characters:' + n));
const ownedWeaponNames = () =>
  Object.keys(WEAPON_CFGS).filter((n) => inventory.has('weapons:' + n));

function updateLoadoutUI() {
  loadoutLabelEl.textContent = '🥊 ' + selectedCharacterName;
  weaponLabelEl.textContent = (WEAPON_ICON[selectedWeaponName] ?? '🪨') + ' ' + selectedWeaponName;
  weaponKeyLegendEl.textContent = selectedWeaponName;
  hpNamePlayerEl.textContent = selectedCharacterName;
  const noCharChoice = ownedCharacterNames().length <= 1;
  charPrevBtn.disabled = noCharChoice;
  charNextBtn.disabled = noCharChoice;
  const noWeaponChoice = ownedWeaponNames().length <= 1;
  weaponPrevBtn.disabled = noWeaponChoice;
  weaponNextBtn.disabled = noWeaponChoice;
  updateBattleLabel();   // הכותרת בקרב מציגה גם את שם הדמות וגם את האויב/הרמה
}

/**
 * מפרקת את המודל הקיים של השחקן ובונה אחד חדש מהקונפיג של הדמות שנבחרה,
 * באותו מיקום וכיוון בדיוק. player הוא let, לא const, בשביל בדיוק זה -
 * כל שאר הקוד (תנועה, קרב, אנימציה) קורא אותו מחדש בכל פריים וממשיך
 * לעבוד נכון בלי לדעת שהמודל הוחלף.
 */
function switchPlayerCharacter(name) {
  if (name === selectedCharacterName || !CHARACTER_CFGS[name]) return;
  selectedCharacterName = name;

  const oldX = player.x, oldFacing = player.facing;
  scene.remove(player.group);
  player.group.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });

  player = makeFighter(CHARACTER_CFGS[name], oldX, oldFacing, 100);
  addWeaponProp(player, selectedWeaponName);
  refreshPlayerCombatStats();
  if (uiScreen === 'lobby') {
    player.forceWeaponVisible = true;
    focusLobbyCamera();
  }
  updateHealthUI(player, 'player');
  updateLoadoutUI();
}

function cycleCharacter(dir) {
  const names = ownedCharacterNames();
  if (names.length <= 1) return;
  const i = names.indexOf(selectedCharacterName);
  switchPlayerCharacter(names[(i + dir + names.length) % names.length]);
}

// מחליפה רק את הנשק על הדמות הקיימת - בלי לפרק ולבנות מחדש את כל הדמות.
function switchPlayerWeapon(name) {
  if (name === selectedWeaponName || !WEAPON_CFGS[name]) return;
  selectedWeaponName = name;
  removeWeaponProp(player);
  addWeaponProp(player, name);
  if (uiScreen === 'lobby') player.forceWeaponVisible = true;
  updateLoadoutUI();
}

function cycleWeapon(dir) {
  const names = ownedWeaponNames();
  if (names.length <= 1) return;
  const i = names.indexOf(selectedWeaponName);
  switchPlayerWeapon(names[(i + dir + names.length) % names.length]);
}

function flashCantAfford(btn) {
  btn.classList.remove('shake');
  void btn.offsetWidth;         // מכריח את הדפדפן "לשכוח" את האנימציה הקודמת כדי שתתחיל שוב
  btn.classList.add('shake');
}

function buyItem(btn) {
  const { key, name } = btn.dataset;
  const price = +btn.dataset.price;
  const id = key + ':' + name;
  if (inventory.has(id)) return;
  if (money < price) { flashCantAfford(btn); return; }
  money -= price;
  inventory.add(id);
  updateMoneyUI();
  renderShopCategory(key);
  // דמות/נשק שני שנקנה מפעיל את חצי המעבר המתאימים בלובי
  if (key === 'characters' || key === 'weapons') updateLoadoutUI();
  // אוכל/משקה/מגן שנקנה מצטרף מיד ללוט (גם אם קונים באמצע רצף קרבות)
  if (key === 'food' || key === 'drinks' || key === 'shields') renderLootBar();
}

// ---------- שדרוגים ----------
// קטגוריה מיוחדת: במקום שורה קבועה של פריטים מ-SHOP_DATA (כמו כל שאר
// הקטגוריות), כאן מציגים כרטיס לכל דמות *שכבר קנית* (ownedCharacterNames),
// עם שתי רמות נפרדות (כוח/מהירות) וכפתור שדרוג לכל אחת. לכן יש לה
// פונקציית רינדור וקליק נפרדות, במקום buyItem/rows הרגילים.
function renderUpgradesCategory() {
  const names = ownedCharacterNames();
  if (names.length === 0) {
    shopGridEl.innerHTML = '<div style="opacity:0.75; font-size:1.1rem; grid-column: 1 / -1; text-align: center;">קודם קונים דמות בקטגוריית "דמויות", ואז אפשר לשדרג אותה כאן!</div>';
    return;
  }
  const statRow = (name, label, icon, stat) => {
    const lv = getLevels(name);
    const level = lv[stat];
    const maxed = level >= MAX_UPGRADE_LEVEL;
    const btn = maxed
      ? `<button class="buyBtn owned" disabled>🏆 מקסימום</button>`
      : `<button class="buyBtn upgradeBtn" data-name="${name}" data-stat="${stat}">${icon} שדרג ב-${upgradeCost(level)}₪</button>`;
    return `<div class="itemStat">${icon} ${label} — רמה ${level}/${MAX_UPGRADE_LEVEL}</div>${btn}`;
  };
  names.forEach((name) => {
    const thumb = getCharacterThumb(name);
    const media = thumb ? `<img class="itemThumb" src="${thumb}">` : '';
    const card = document.createElement('div');
    card.className = 'itemCard';
    card.innerHTML = media + `<div class="itemName">${name}</div>` +
      statRow(name, 'כוח', '💪', 'power') + statRow(name, 'מהירות', '⚡', 'speed');
    shopGridEl.appendChild(card);
  });
  shopGridEl.querySelectorAll('.upgradeBtn').forEach((btn) => {
    btn.addEventListener('click', () => onUpgradeClick(btn));
  });
}

function onUpgradeClick(btn) {
  const { name, stat } = btn.dataset;
  if (!upgradeCharacter(name, stat)) { flashCantAfford(btn); return; }
  renderShopCategory('upgrades');   // מרעננת מיד - הרמה והמחיר הבא מתעדכנים
}

function renderShopCategory(key) {
  [...shopTabsEl.children].forEach((btn) => btn.classList.toggle('active', btn.dataset.key === key));
  shopGridEl.innerHTML = '';
  if (key === 'upgrades') { renderUpgradesCategory(); return; }

  const { rows } = SHOP_DATA[key];
  if (rows.length === 0) {
    shopGridEl.innerHTML = '<div style="opacity:0.75; font-size:1.1rem; grid-column: 1 / -1; text-align: center;">🚧 עוד לא הוחלט מה יהיה כאן - בקרוב!</div>';
    return;
  }
  rows.forEach(([name, ...stats]) => {
    const card = document.createElement('div');
    card.className = 'itemCard';
    const priceStr = stats[stats.length - 1];
    const mid = stats.slice(0, -1);
    const price = priceOf(priceStr);
    const id = key + ':' + name;
    const owned = inventory.has(id);

    let media = '';
    if (key === 'characters') {
      const thumb = getCharacterThumb(name);
      media = thumb
        ? `<img class="itemThumb" src="${thumb}">`
        : `<div class="itemThumb itemThumbPlaceholder">🚧<br>בקרוב</div>`;
    }
    const buyHtml = owned
      ? `<button class="buyBtn owned" disabled>✅ שלך</button>`
      : `<button class="buyBtn" data-key="${key}" data-name="${name}" data-price="${price}">💰 קנה ב-${priceStr}</button>`;

    card.innerHTML = media + `<div class="itemName">${name}</div>` +
      mid.map((s) => `<div class="itemStat">${s}</div>`).join('') +
      buyHtml;
    shopGridEl.appendChild(card);
  });

  shopGridEl.querySelectorAll('.buyBtn:not(.owned)').forEach((btn) => {
    btn.addEventListener('click', () => buyItem(btn));
  });
}

Object.entries(SHOP_DATA).forEach(([key, { label }]) => {
  const btn = document.createElement('button');
  btn.className = 'shopTab';
  btn.dataset.key = key;
  btn.textContent = label;
  btn.addEventListener('click', () => renderShopCategory(key));
  shopTabsEl.appendChild(btn);
});

weaponPrevBtn.addEventListener('click', () => cycleWeapon(-1));
weaponNextBtn.addEventListener('click', () => cycleWeapon(1));

updateMoneyUI();
updateLoadoutUI();

// ---------- לולאת רינדור ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  // סדר חשוב: getDelta חייב לרוץ ראשון. getElapsedTime של three.js קורא ל-getDelta
  // בעצמו ומאפס את הזמן, ואז ה-dt שאחריו יוצא 0 והמשחק קופא לגמרי.
  const dt = Math.min(clock.getDelta(), 0.05);   // תקרה: מונע קפיצה אחרי לשונית ברקע
  const t = clock.elapsedTime;

  if (gameOver || uiScreen !== 'battle') {
    player.mv = 0; enemy.mv = 0;
    player.blocking = false; enemy.blocking = false;
  } else {
    updatePlayer(player, dt);
    updateEnemy(enemy, player, dt);
    tickCombat(player, enemy, 'player', 'enemy');
    tickCombat(enemy, player, 'enemy', 'player');

    // ספירה לאחור של המגן מהלוט. מתעדכן על המסך רק כשהערך המוצג משתנה,
    // כדי לא לכתוב ל-DOM בכל פריים.
    if (player.guardTimer > 0) {
      const before = player.guardTimer.toFixed(1);
      player.guardTimer = Math.max(0, player.guardTimer - dt);
      if (player.guardTimer.toFixed(1) !== before) updateBuffRow();
      if (player.guardTimer === 0) applyInvisibility(player);   // חוזר להיראות
    }
  }

  [player, enemy].forEach((f) => {
    tickAction(f, dt);
    tickJump(f, dt);
    f.blockAmt += ((f.blocking ? 1 : 0) - f.blockAmt) * (1 - Math.exp(-dt * 16));
  });

  moveFighter(player, enemy, dt);
  moveFighter(enemy, player, dt);

  poseFighter(player, t, dt);
  poseFighter(enemy, t, dt);

  // תנועת קהל עדינה - נותנת חיים לאולם
  crowdPositions.forEach((p, i) => {
    const bob = Math.sin(t * 2.2 + p.phase) * 0.06;
    dummy.position.set(p.x, p.y + 0.36 + bob, p.z);
    dummy.updateMatrix();
    crowdBodies.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, p.y + 0.76 + bob, p.z);
    dummy.updateMatrix();
    crowdHeads.setMatrixAt(i, dummy.matrix);
  });
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

// ידית לבדיקה: מאפשרת לרנדר תנוחה מסוימת ולצלם אותה בזמן פיתוח.
// אין לה שום השפעה על המשחק עצמו.
window.game = {
  startAction, KEYS, camera, scene, resetGame, endGame, showScreen, createFighter,
  renderShopCategory, getCharacterThumb, SVAROK_CFG, JENNY_CFG, BRAKE_CFG, LORD_CFG, PLAYTY_CFG, LIZZY_CFG, BERTO_CFG, STANBER_CFG, SLAIKY_CFG, KITTY_CFG, LEWIN_CFG, inventory,
  switchPlayerCharacter, cycleCharacter, switchPlayerWeapon, cycleWeapon,
  CHARACTER_CFGS, WEAPON_CFGS, ENEMY_LEVELS, switchEnemy,
  useLootItem, renderLootBar, lootUsed, SHIELD_SECONDS, SHIELD_ABILITY,
  upgradeCharacter, getLevels, characterLevels, upgradeCost, MAX_UPGRADE_LEVEL,
  refreshPlayerCombatStats, startJump,
  get enemy() { return enemy; },              // enemy הוא let ומתחלף בין רמות
  get enemyLevel() { return enemyLevel; },
  get player() { return player; },   // player הוא let ומתחלף בהחלפת דמות - חייב getter כדי לא להישאר עם רפרנס ישן
  get gameOver() { return gameOver; }, get uiScreen() { return uiScreen; }, get money() { return money; },
  set money(v) { money = v; updateMoneyUI(); },
};
</script>
