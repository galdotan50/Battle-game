<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - סווארק מול בו</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="label">🥊 שלב גרפיקה: זירת אגרוף - סווארק מול בו (עדיין בלי תנועה)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121a29);
scene.fog = new THREE.Fog(0x121a29, 26, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
// המצלמה יושבת בחלל הפתוח שבין הזירה ליציעים, ומביטה מעל החבל העליון
camera.position.set(0, 3.9, 8.0);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
scene.add(new THREE.HemisphereLight(0xaec6e8, 0x2f2a24, 0.8));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff3dd, 2.2);
keyLight.position.set(-6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0012;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.9);
fillLight.position.set(7, 8, -6);
scene.add(fillLight);

// זרקורי זירה - נותנים תחושת אולם אגרוף
const spotA = new THREE.SpotLight(0xfff6e5, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotA.position.set(-3.5, 10, 3.5);
spotA.target.position.set(-1.7, 0.7, 0);
scene.add(spotA, spotA.target);

const spotB = new THREE.SpotLight(0xeaf2ff, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotB.position.set(3.5, 10, -3.5);
spotB.target.position.set(1.7, 0.7, 0);
scene.add(spotB, spotB.target);

// ---------- מידות הזירה ----------
const RING_HALF = 4.2;        // חצי רוחב הבמה
const RING_TOP = 0.7;         // גובה פני הבמה
const POST_HEIGHT = 1.75;     // גובה עמודי הפינה מעל הבמה
const ROPE_HEIGHTS = [0.5, 0.95, 1.4]; // 3 חבלים בכל צלע

// ---------- רצפת האולם ----------
const hallFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x39404e, roughness: 1 })
);
hallFloor.rotation.x = -Math.PI / 2;
hallFloor.receiveShadow = true;
scene.add(hallFloor);

// ---------- במת הזירה ----------
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.8, RING_TOP, RING_HALF * 2 + 0.8),
  new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.85 })
);
platform.position.y = RING_TOP / 2;
platform.castShadow = true;
platform.receiveShadow = true;
scene.add(platform);

// יריעת הקנבס (משטח הלחימה)
const canvasMat = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.85, 0.06, RING_HALF * 2 + 0.85),
  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, roughness: 0.95 })
);
canvasMat.position.y = RING_TOP + 0.01;
canvasMat.receiveShadow = true;
scene.add(canvasMat);

// עמודי פינה + כריות ריפוד
const cornerColors = [0xd32f2f, 0x1565c0, 0xd32f2f, 0x1565c0];
const corners = [
  [-RING_HALF, -RING_HALF],
  [ RING_HALF, -RING_HALF],
  [ RING_HALF,  RING_HALF],
  [-RING_HALF,  RING_HALF],
];

corners.forEach(([cx, cz], i) => {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, POST_HEIGHT, 14),
    new THREE.MeshStandardMaterial({ color: 0xc2c9d4, roughness: 0.35, metalness: 0.75 })
  );
  post.position.set(cx, RING_TOP + POST_HEIGHT / 2, cz);
  post.castShadow = true;
  scene.add(post);

  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.17, 1.15, 14),
    new THREE.MeshStandardMaterial({ color: cornerColors[i], roughness: 0.8 })
  );
  pad.position.set(cx, RING_TOP + 0.95, cz);
  pad.castShadow = true;
  scene.add(pad);
});

// חבלים - 3 בכל אחת מ-4 הצלעות
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
const ropeLen = RING_HALF * 2;

ROPE_HEIGHTS.forEach((h) => {
  const y = RING_TOP + h;

  [-RING_HALF, RING_HALF].forEach((z) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.z = Math.PI / 2;
    rope.position.set(0, y, z);
    rope.castShadow = true;
    scene.add(rope);
  });

  [-RING_HALF, RING_HALF].forEach((x) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.x = Math.PI / 2;
    rope.position.set(x, y, 0);
    rope.castShadow = true;
    scene.add(rope);
  });
});

// ---------- יציעים וקהל ----------
// חשוב: כל יציע נבנה כ"מסגרת" חלולה מ-4 קטעים, ולא כקובייה מלאה -
// אחרת הקובייה הגדולה בולעת את הזירה ואת המצלמה.
const TIERS = 5;
const TIER_WIDTH = 2.0;
const FIRST_TIER_INNER = 9.0;   // מרוחק מספיק כדי להשאיר חלל פתוח למצלמה
const crowdPositions = [];

for (let t = 0; t < TIERS; t++) {
  const innerHalf = FIRST_TIER_INNER + t * TIER_WIDTH;
  const outerHalf = innerHalf + TIER_WIDTH;
  const height = 0.55 + t * 0.7;
  const mid = innerHalf + TIER_WIDTH / 2;

  const tierMat = new THREE.MeshStandardMaterial({
    color: t % 2 ? 0x3d4553 : 0x343b48,
    roughness: 0.95
  });

  // שני קטעים לאורך ציר X (מלוא הרוחב)
  [-mid, mid].forEach((z) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(outerHalf * 2, height, TIER_WIDTH), tierMat);
    seg.position.set(0, height / 2, z);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // שני קטעים לאורך ציר Z (בלי הפינות, שכבר נוצרו)
  [-mid, mid].forEach((x) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(TIER_WIDTH, height, innerHalf * 2), tierMat);
    seg.position.set(x, height / 2, 0);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // פיזור צופים על גג היציע - שתי שורות בכל צלע
  [0.6, 1.4].forEach((rowOffset) => {
    const out = innerHalf + rowOffset;
    const step = 0.8;
    const span = innerHalf + TIER_WIDTH * 0.5;
    for (let d = -span; d <= span; d += step) {
      const along = d + (Math.random() - 0.5) * 0.3;
      const outJ = out + (Math.random() - 0.5) * 0.25;
      [[along, -outJ], [along, outJ], [-outJ, along], [outJ, along]].forEach(([x, z]) => {
        crowdPositions.push({ x, y: height, z, phase: Math.random() * Math.PI * 2 });
      });
    }
  });
}

const crowdCount = crowdPositions.length;

const crowdBodyGeo = new THREE.CapsuleGeometry(0.17, 0.34, 4, 8);
const crowdHeadGeo = new THREE.SphereGeometry(0.145, 10, 10);
const crowdMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });

const crowdBodies = new THREE.InstancedMesh(crowdBodyGeo, crowdMat, crowdCount);
const crowdHeads = new THREE.InstancedMesh(crowdHeadGeo, crowdMat, crowdCount);
crowdBodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
crowdHeads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const shirtPalette = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xe67e22, 0xecf0f1, 0x1abc9c];
const skinPalette = [0xf0c39a, 0xd9a273, 0xb07a4e, 0x8a5a35, 0x66401f];

const dummy = new THREE.Object3D();
const colorTmp = new THREE.Color();

crowdPositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y + 0.36, p.z);
  dummy.updateMatrix();
  crowdBodies.setMatrixAt(i, dummy.matrix);

  dummy.position.set(p.x, p.y + 0.76, p.z);
  dummy.updateMatrix();
  crowdHeads.setMatrixAt(i, dummy.matrix);

  crowdBodies.setColorAt(i, colorTmp.setHex(shirtPalette[Math.floor(Math.random() * shirtPalette.length)]));
  crowdHeads.setColorAt(i, colorTmp.setHex(skinPalette[Math.floor(Math.random() * skinPalette.length)]));
});

scene.add(crowdBodies, crowdHeads);

// ---------- בניית דמות אנושית מחוברת ----------
// כל "עצם" נמתחת בין שתי נקודות שלד, ובכל מפרק יש כדור שמסתיר את התפר.
// כך לא נוצרים פערים ולא חפיפות כפולות.

const UP = new THREE.Vector3(0, 1, 0);

function bone(mat, rTop, rBottom, from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, len, 14), mat);
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function joint(mat, r, pos) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 12), mat);
  mesh.position.copy(pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// חומר זהב משותף לתכשיטים (עגילים / טבעות)
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd9b23c, roughness: 0.2, metalness: 0.95 });

/**
 * בונה דמות לוחם לפי הגדרות מראה.
 * cfg:
 *   skin, hair            - צבעים
 *   hairStyle             - 'curly' (תלתלים) | 'spiky' (קוצני)
 *   ears                  - 'round' | 'pointed' (אוזניים חדות)
 *   top                   - צבע גופייה, או null לגוף חשוף
 *   pants                 - צבע מכנסיים ארוכים, או null
 *   boxers                - צבע תחתונים, או null
 *   shoes                 - צבע נעליים, או null לרגליים יחפות
 *   noseRing, fingerRing  - תכשיטי זהב
 */
function createFighter(cfg) {
  const g = new THREE.Group();

  const skinMat  = new THREE.MeshStandardMaterial({ color: cfg.skin, roughness: 0.62, metalness: 0.02 });
  const hairMat  = new THREE.MeshStandardMaterial({ color: cfg.hair, roughness: 0.8 });
  const topMat    = cfg.top    ? new THREE.MeshStandardMaterial({ color: cfg.top,    roughness: 0.88 }) : null;
  const pantsMat  = cfg.pants  ? new THREE.MeshStandardMaterial({ color: cfg.pants,  roughness: 0.88 }) : null;
  const boxerMat  = cfg.boxers ? new THREE.MeshStandardMaterial({ color: cfg.boxers, roughness: 0.8 })  : null;
  const shoeMat   = cfg.shoes  ? new THREE.MeshStandardMaterial({ color: cfg.shoes,  roughness: 0.55 }) : skinMat;
  const beltMat   = new THREE.MeshStandardMaterial({ color: 0x4a3527, roughness: 0.7 });
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf7f7f7, roughness: 0.35 });
  const eyeDarkMat  = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.3 });
  const mouthMat    = new THREE.MeshStandardMaterial({ color: 0x8a3b3b, roughness: 0.6 });

  // חומר הרגליים: מכנסיים ארוכים אם יש, אחרת עור חשוף
  const legMat = pantsMat || skinMat;
  // חומר האגן: מכנסיים > תחתונים > עור
  const hipMat = pantsMat || boxerMat || skinMat;

  // --- נקודות שלד (הדמות פונה לכיוון +Z) ---
  const ankleL = V(-0.135, 0.12, 0), ankleR = V(0.135, 0.12, 0);
  const kneeL  = V(-0.145, 0.52, 0.01), kneeR = V(0.145, 0.52, 0.01);
  const hipL   = V(-0.125, 0.92, 0),  hipR  = V(0.125, 0.92, 0);
  const pelvis = V(0, 0.94, 0);
  const chest  = V(0, 1.36, 0);
  const shoulderL = V(-0.235, 1.32, 0), shoulderR = V(0.235, 1.32, 0);
  const elbowL = V(-0.30, 1.02, 0.02),  elbowR = V(0.30, 1.02, 0.02);
  const wristL = V(-0.315, 0.74, 0.05), wristR = V(0.315, 0.74, 0.05);
  const neckBase = V(0, 1.40, 0), neckTop = V(0, 1.55, 0);
  const headCenter = V(0, 1.70, 0);

  // --- רגליים ---
  g.add(bone(legMat, 0.10, 0.115, kneeL, ankleL));
  g.add(bone(legMat, 0.10, 0.115, kneeR, ankleR));
  g.add(bone(legMat, 0.14, 0.105, hipL, kneeL));
  g.add(bone(legMat, 0.14, 0.105, hipR, kneeR));
  g.add(joint(legMat, 0.105, kneeL));
  g.add(joint(legMat, 0.105, kneeR));
  g.add(joint(legMat, 0.14, hipL));
  g.add(joint(legMat, 0.14, hipR));

  // כפות רגליים - צמודות לקרסול
  [ankleL, ankleR].forEach((a) => {
    g.add(joint(skinMat, 0.095, a));
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.11, 0.32), shoeMat);
    foot.position.set(a.x, 0.055, 0.07);
    foot.castShadow = true;
    foot.receiveShadow = true;
    g.add(foot);
  });

  // --- אגן ---
  g.add(bone(hipMat, 0.195, 0.185, V(0, 1.0, 0), V(0, 0.85, 0)));

  // תחתונים (בוקסר) - שכבה מעט רחבה יותר על האגן וראש הירכיים
  if (boxerMat && !pantsMat) {
    g.add(bone(boxerMat, 0.205, 0.20, V(0, 1.0, 0), V(0, 0.86, 0)));
    [hipL, hipR].forEach((h) => {
      g.add(bone(boxerMat, 0.152, 0.13, V(h.x, 0.94, 0), V(h.x * 1.06, 0.68, 0.004)));
    });
  }

  // חגורה - רק כשיש מכנסיים ארוכים
  if (pantsMat) {
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.07, 20), beltMat);
    belt.position.set(0, 0.985, 0);
    belt.castShadow = true;
    g.add(belt);
  }

  // --- פלג גוף עליון (תמיד עור; הבגד מונח מעליו) ---
  g.add(bone(skinMat, 0.225, 0.185, chest, pelvis));
  g.add(joint(skinMat, 0.225, chest));
  g.add(joint(skinMat, 0.17, shoulderL));
  g.add(joint(skinMat, 0.17, shoulderR));

  // גופייה - שכבה מעל פלג הגוף, עם שתי כתפיות שעוברות מעל הכתפיים
  if (topMat) {
    g.add(bone(topMat, 0.234, 0.198, V(0, 1.28, 0), V(0, 0.93, 0)));
    [-1, 1].forEach((s) => {
      const frontPt    = V(s * 0.115, 1.27, 0.185);
      const shoulderPt = V(s * 0.20, 1.42, 0.0);
      const backPt     = V(s * 0.135, 1.27, -0.17);
      g.add(bone(topMat, 0.03, 0.03, frontPt, shoulderPt));
      g.add(bone(topMat, 0.03, 0.03, shoulderPt, backPt));
      g.add(joint(topMat, 0.032, shoulderPt));
    });
  }

  // --- זרועות ---
  [[shoulderL, elbowL, wristL], [shoulderR, elbowR, wristR]].forEach(([sh, el, wr]) => {
    g.add(bone(skinMat, 0.085, 0.07, sh, el));
    g.add(joint(skinMat, 0.072, el));
    g.add(bone(skinMat, 0.068, 0.058, el, wr));
    g.add(joint(skinMat, 0.075, wr));
  });

  // --- צוואר ---
  g.add(bone(skinMat, 0.078, 0.09, neckTop, neckBase));
  g.add(joint(skinMat, 0.082, neckTop));

  // --- ראש ---
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.155, 20, 20), skinMat);
  head.position.copy(headCenter);
  head.scale.set(0.94, 1.12, 1.0);
  head.castShadow = true;
  head.receiveShadow = true;
  g.add(head);

  // אוזניים - עגולות רגילות או חדות ומחודדות כלפי מעלה
  [-1, 1].forEach((s) => {
    let ear;
    if (cfg.ears === 'pointed') {
      ear = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.20, 10), skinMat);
      ear.position.set(s * 0.152, headCenter.y + 0.055, -0.012);
      ear.rotation.z = s * -0.45;
      ear.rotation.x = -0.25;
      ear.scale.set(0.55, 1, 0.9);
    } else {
      ear = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), skinMat);
      ear.position.set(s * 0.147, headCenter.y + 0.005, -0.005);
      ear.scale.set(0.55, 1, 0.75);
    }
    ear.castShadow = true;
    g.add(ear);
  });

  // --- פנים ---
  const faceZ = 0.128;

  [-1, 1].forEach((s) => {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 12), eyeWhiteMat);
    white.position.set(s * 0.058, headCenter.y + 0.035, faceZ);
    white.scale.set(1, 0.8, 0.6);
    g.add(white);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 10), eyeDarkMat);
    pupil.position.set(s * 0.058, headCenter.y + 0.035, faceZ + 0.02);
    g.add(pupil);

    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.072, 0.016, 0.03), hairMat);
    brow.position.set(s * 0.058, headCenter.y + 0.086, faceZ + 0.005);
    brow.rotation.z = s * -0.12;
    g.add(brow);
  });

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.075, 10), skinMat);
  nose.position.set(0, headCenter.y - 0.01, faceZ + 0.025);
  nose.rotation.x = Math.PI / 2;
  nose.castShadow = true;
  g.add(nose);

  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.022, 0.03), mouthMat);
  mouth.position.set(0, headCenter.y - 0.078, faceZ + 0.005);
  g.add(mouth);

  // --- עגיל באף (טבעת ספטום התלויה מתחת לאף) ---
  if (cfg.noseRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.007, 8, 18), goldMat);
    ring.position.set(0, headCenter.y - 0.062, faceZ + 0.03);
    ring.castShadow = true;
    g.add(ring);
  }

  // --- טבעת באצבע (יד ימין) ---
  if (cfg.fingerRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.011, 8, 18), goldMat);
    ring.position.set(wristR.x, wristR.y - 0.055, wristR.z);
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = true;
    g.add(ring);
  }

  // --- שיער ---
  // כיפת בסיס שצמודה לגולגולת
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.162, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.5),
    hairMat
  );
  hairCap.position.copy(headCenter);
  hairCap.position.y += 0.01;
  hairCap.scale.set(0.96, 1.2, 1.02);
  hairCap.castShadow = true;
  g.add(hairCap);

  // צורות שיער - מונחות על פני הגולגולת לפי טבעות זווית,
  // ומדלגות על אזור המצח כדי שהפנים יישארו חשופות
  const HAIR_RINGS = [
    { phi: 0.30, count: 6 },
    { phi: 0.66, count: 10 },
    { phi: 1.00, count: 13 },
    { phi: 1.32, count: 15 },
  ];
  const rx = 0.152, ry = 0.178, rz = 0.163;

  HAIR_RINGS.forEach(({ phi, count }) => {
    for (let i = 0; i < count; i++) {
      const theta = (i / count) * Math.PI * 2 + phi * 1.7;
      const lx = Math.sin(phi) * Math.cos(theta) * rx;
      const ly = Math.cos(phi) * ry;
      const lz = Math.sin(phi) * Math.sin(theta) * rz;

      // דילוג על המצח והפנים (קו שיער בגובה הגבות)
      if (lz > 0.05 && ly < 0.085) continue;

      const jitter = () => (Math.random() - 0.5) * 0.022;
      const px = headCenter.x + lx + jitter();
      const py = headCenter.y + ly + jitter();
      const pz = lz + jitter();

      let tuft;
      if (cfg.hairStyle === 'spiky') {
        tuft = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.13, 7), hairMat);
        // הקוץ מצביע החוצה מהראש
        const dir = new THREE.Vector3(lx, ly, lz).normalize();
        tuft.position.set(px + dir.x * 0.04, py + dir.y * 0.04, pz + dir.z * 0.04);
        tuft.quaternion.setFromUnitVectors(UP, dir);
      } else {
        // תלתלים - כדורים קטנים וצפופים
        const r = 0.036 + Math.random() * 0.011;
        tuft = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), hairMat);
        tuft.position.set(px, py, pz);
      }
      tuft.castShadow = true;
      g.add(tuft);
    }
  });

  return g;
}

// ---------- הצבת הלוחמים על הבמה ----------

// סווארק - גופייה לבנה, ג'ינס, תלתלים חומים
const player = createFighter({
  skin: 0xe3ab78,
  hair: 0x5a3a1c,
  hairStyle: 'curly',
  ears: 'round',
  top: 0xf2f2ef,      // גופייה לבנה
  pants: 0x35578f,    // ג'ינס
  shoes: 0x2b2320,
});
player.position.set(-1.7, RING_TOP + 0.04, 0);
player.rotation.y = 1.05;   // 3/4 - פונה ליריב אבל הפנים נראות למצלמה
scene.add(player);

// בו - איש כחול, אוזניים חדות, שיער ירוק, עגיל באף וטבעת באצבע, רק בוקסר שחור
const enemy = createFighter({
  skin: 0x4a93d4,
  hair: 0x2fbf44,
  hairStyle: 'spiky',
  ears: 'pointed',
  top: null,          // בלי חולצה
  pants: null,        // בלי מכנסיים
  boxers: 0x16181c,   // בוקסר שחור
  shoes: null,        // יחף
  noseRing: true,
  fingerRing: true,
});
enemy.position.set(1.7, RING_TOP + 0.04, 0);
enemy.rotation.y = -1.05;
scene.add(enemy);

// ---------- לולאת רינדור ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // תנועת קהל עדינה - נותנת חיים לאולם
  crowdPositions.forEach((p, i) => {
    const bob = Math.sin(t * 2.2 + p.phase) * 0.06;
    dummy.position.set(p.x, p.y + 0.36 + bob, p.z);
    dummy.updateMatrix();
    crowdBodies.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, p.y + 0.76 + bob, p.z);
    dummy.updateMatrix();
    crowdHeads.setMatrixAt(i, dummy.matrix);
  });
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();
</script>
