<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - סווארק מול בו</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  #controls {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 0.95rem;
    text-align: center;
    z-index: 10;
    line-height: 1.7;
  }
  #controls b {
    display: inline-block;
    background: #ffffff;
    color: #111;
    border-radius: 5px;
    padding: 1px 7px;
    margin: 0 3px;
    font-family: monospace;
  }
  /* ---------- הלוט: הציוד שאפשר להשתמש בו תוך כדי הקרב ---------- */
  /* עמודה אחת שמחזיקה גם את הפריטים וגם את שורת ההשפעות, כדי ששניהם
     לא ייפלו זה על זה כששורת המקשים למטה נשברת לשתי שורות. */
  #lootStack {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    z-index: 11;
    pointer-events: none;   /* רק הכפתורים עצמם לוכדים לחיצות */
  }
  #lootBar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 94vw;
    direction: ltr;      /* אחרת סדר הפריטים מתהפך בדף RTL */
    pointer-events: auto;
  }
  .lootItem {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 62px;
    padding: 6px 9px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(12,18,32,0.80);
    color: #fff;
    font-size: 0.70rem;
    font-family: inherit;
    cursor: pointer;
    line-height: 1.25;
  }
  .lootItem .lootIcon { font-size: 1.25rem; }
  .lootItem .lootName { max-width: 82px; text-align: center; }
  .lootItem .lootEffect { color: #8fe3a4; font-weight: 700; }
  .lootItem:hover:not(:disabled) { background: rgba(40,60,100,0.92); }
  .lootItem:disabled { opacity: 0.35; cursor: default; }
  /* שורת ההשפעות הפעילות (משקה/מגן) - מתחת ללוט */
  #buffRow {
    display: flex;
    gap: 10px;
    direction: ltr;
    color: #ffe08a;
    font-size: 0.92rem;
    font-weight: 700;
  }
  #buffRow:not(:empty) {
    background: rgba(0,0,0,0.55);
    border-radius: 9px;
    padding: 3px 12px;
  }
  canvas { display: block; }

  #hpRow {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    direction: ltr;   /* העמוד כולו RTL, אבל סווארק תמיד עומד משמאל בזירה -
                         חייבים סדר פיזי קבוע כדי שהפס שלו לא יתחלף עם של בו */
    justify-content: space-between;
    padding: 0 18px;
    z-index: 10;
    pointer-events: none;
  }
  .hpBar { display: flex; flex-direction: column; gap: 3px; width: 230px; }
  .hpEnemy { align-items: flex-end; }
  .hpName {
    color: #fff;
    font-size: 0.9rem;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }
  .hpTrack {
    width: 100%;
    height: 18px;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 9px;
    overflow: hidden;
  }
  .hpEnemy .hpTrack { display: flex; justify-content: flex-end; }
  .hpFill { height: 100%; width: 100%; transition: width 0.25s ease-out; }
  .hpPlayer .hpFill { background: linear-gradient(90deg, #3ddc74, #24a852); }
  .hpEnemy .hpFill { background: linear-gradient(90deg, #ff6b5b, #e63946); }
  .hpNum { color: #fff; font-size: 0.78rem; opacity: 0.9; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }

  #hitFlash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255,25,25,0.5) 100%);
    opacity: 0;
  }
  @keyframes hitFlashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
  #hitFlash.show { animation: hitFlashAnim 0.35s ease-out; }

  /* הבזק כשיכולת מיוחדת של מגן מופעלת - צהוב, כדי שיהיה ברור שזה משהו
     אחר מהבזק הפגיעה האדום */
  #shieldFlash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,215,60,0.55) 100%);
    opacity: 0;
  }
  #shieldFlash.show { animation: hitFlashAnim 0.45s ease-out; }

  /* הודעה שמסבירה איזו יכולת הופעלה ומה היא עשתה */
  #shieldToast {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 21;
    pointer-events: none;
    background: rgba(10,14,26,0.86);
    border: 2px solid #ffd23c;
    color: #ffd23c;
    font-size: 1.25rem;
    font-weight: 800;
    padding: 9px 22px;
    border-radius: 13px;
    white-space: nowrap;
    opacity: 0;
  }
  @keyframes shieldToastAnim {
    0%   { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.85); }
    18%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.06); }
    30%  { transform: translateX(-50%) translateY(0) scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(1); }
  }
  #shieldToast.show { animation: shieldToastAnim 1.5s ease-out; }

  #gameOverOverlay {
    position: fixed;
    inset: 0;
    background: rgba(5,8,14,0.74);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #gameOverOverlay.show { opacity: 1; pointer-events: auto; }
  #gameOverTitle {
    font-size: 3rem;
    color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.7);
    font-weight: 800;
  }
  #gameOverStats {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 16px 30px;
    color: #fff;
    font-size: 1.15rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #gameOverGrade { font-size: 1.7rem; font-weight: 800; color: #ffcf4d; }
  #playAgainBtn {
    font-size: 1.2rem;
    padding: 12px 34px;
    border-radius: 14px;
    border: none;
    background: #ffcf4d;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #playAgainBtn:hover { background: #ffd968; }
  #btnRow { display: flex; gap: 14px; }
  #lobbyBtn, #backLobbyBtn {
    font-size: 1.2rem;
    padding: 12px 34px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  #lobbyBtn:hover, #backLobbyBtn:hover { background: rgba(255,255,255,0.18); }

  /* ---------- לובי וחנות: מסכים מלאים מעל הזירה ---------- */
  #lobbyOverlay, #shopOverlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 40;
    color: #fff;
    overflow-y: auto;
    padding: 40px 20px;
    box-sizing: border-box;
  }
  #shopOverlay { background: linear-gradient(160deg, #16213a, #0c1220); }
  /* בלובי הרקע שקוף חלקית - כדי שסווארק (מרונדר מאחורי המסך) יראה מבעד לתפריט */
  #lobbyOverlay {
    background: linear-gradient(200deg, rgba(22,33,58,0.55), rgba(12,18,32,0.72));
    justify-content: flex-end;
    padding-bottom: 60px;
  }
  #lobbyOverlay.show, #shopOverlay.show { display: flex; }
  #loadoutRow, #weaponRow { display: flex; align-items: center; gap: 12px; }
  #loadoutRow { margin-bottom: 10px; }
  #weaponRow { margin-bottom: 22px; }
  #loadoutLabel, #weaponLabel {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 8px 22px;
    font-size: 1.05rem;
  }
  .cycleBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .cycleBtn:hover { background: rgba(255,255,255,0.22); }
  .cycleBtn:disabled { opacity: 0.35; cursor: default; }
  .cycleBtn:disabled:hover { background: rgba(255,255,255,0.1); }
  .screenTitle { font-size: 2.4rem; font-weight: 800; margin-bottom: 34px; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
  #lobbyOverlay .bigBtn {
    font-size: 1.3rem;
    padding: 20px 50px;
    margin: 10px;
    border-radius: 16px;
    border: none;
    background: #ffcf4d;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #lobbyOverlay .bigBtn:hover { background: #ffd968; }
  #lobbyOverlay .bigBtn.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.4); }
  #lobbyOverlay .bigBtn.secondary:hover { background: rgba(255,255,255,0.2); }

  #shopNote {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 0.95rem;
    margin-bottom: 22px;
    max-width: 640px;
    text-align: center;
  }
  #shopTabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .shopTab {
    font-size: 1.05rem;
    padding: 10px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  .shopTab:hover { background: rgba(255,255,255,0.16); }
  .shopTab.active { background: #ffcf4d; color: #1a1a1a; border-color: #ffcf4d; }
  #shopGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 980px;
  }
  .itemCard {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .itemThumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
    background: rgba(0,0,0,0.28);
    display: block;
  }
  .itemThumbPlaceholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    opacity: 0.55;
    gap: 4px;
  }
  .itemName { font-size: 1.05rem; font-weight: bold; margin-bottom: 8px; }
  .itemStat { font-size: 0.85rem; opacity: 0.85; margin: 2px 0; }
  .itemPrice { margin-top: 8px; font-size: 0.95rem; font-weight: bold; color: #ffcf4d; }
  .buyBtn {
    margin-top: 10px;
    width: 100%;
    padding: 9px 0;
    border-radius: 10px;
    border: none;
    background: #ffcf4d;
    color: #1a1a1a;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .buyBtn:hover { background: #ffd968; }
  .buyBtn.owned {
    background: rgba(90,210,140,0.22);
    color: #7be0a0;
    border: 1px solid rgba(123,224,160,0.5);
    cursor: default;
  }
  @keyframes cantAffordShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .buyBtn.shake { animation: cantAffordShake 0.3s ease; background: #e05a5a; color: #fff; }
  #backLobbyBtn { margin-top: 30px; }

  /* מוצג תמיד, בכל מסך (זירה/לובי/חנות) - לכן z-index גבוה מכל המסכים */
  #moneyBadge {
    position: fixed;
    bottom: 14px;
    left: 14px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,207,77,0.6);
    border-radius: 12px;
    padding: 8px 18px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #ffcf4d;
    z-index: 50;
  }
</style>
</head>
<body>
<div id="label">🥊 סווארק מול בו - שלב חיים ונזק</div>
<div id="controls">
  <b>←</b> <b>→</b> לזוז &nbsp;·&nbsp; <b>A</b> אגרוף &nbsp;·&nbsp; <b>S</b> בעיטה &nbsp;·&nbsp; <b>W</b> <span id="weaponKeyLegend">אבן חדה</span> &nbsp;·&nbsp; <b>D</b> חסימה &nbsp;·&nbsp; <b>רווח</b> קפיצה
</div>

<div id="lootStack">
  <div id="lootBar"></div>
  <div id="buffRow"></div>
</div>

<div id="hpRow">
  <div class="hpBar hpPlayer">
    <div class="hpName" id="hpNamePlayer">סווארק</div>
    <div class="hpTrack"><div class="hpFill" id="hpFillPlayer"></div></div>
    <div class="hpNum" id="hpNumPlayer">100 / 100</div>
  </div>
  <div class="hpBar hpEnemy">
    <div class="hpName" id="hpNameEnemy">בו</div>
    <div class="hpTrack"><div class="hpFill" id="hpFillEnemy"></div></div>
    <div class="hpNum" id="hpNumEnemy">75 / 75</div>
  </div>
</div>

<div id="hitFlash"></div>
<div id="shieldFlash"></div>
<div id="shieldToast"></div>

<div id="moneyBadge">💰 0₪</div>

<div id="gameOverOverlay">
  <div id="gameOverTitle"></div>
  <div id="gameOverStats">
    <div id="gameOverGrade"></div>
    <div id="statPlayerLine"></div>
    <div id="statEnemyLine"></div>
  </div>
  <div id="btnRow">
    <button id="playAgainBtn">🔄 לשחק שוב</button>
    <button id="lobbyBtn">🏠 לובי</button>
  </div>
</div>

<div id="lobbyOverlay">
  <div id="loadoutRow">
    <button id="charPrevBtn" class="cycleBtn">◀</button>
    <div id="loadoutLabel">🥊 סווארק</div>
    <button id="charNextBtn" class="cycleBtn">▶</button>
  </div>
  <div id="weaponRow">
    <button id="weaponPrevBtn" class="cycleBtn">◀</button>
    <div id="weaponLabel">🪨 אבן חדה</div>
    <button id="weaponNextBtn" class="cycleBtn">▶</button>
  </div>
  <button class="bigBtn" id="startFightBtn">⚔️ התחל קרב</button>
  <button class="bigBtn secondary" id="openShopBtn">🛒 חנות</button>
</div>

<div id="shopOverlay">
  <div class="screenTitle">🛒 חנות</div>
  <div id="shopNote">👀 אפשר לראות מה יש בחנות, אבל עדיין אי אפשר לקנות - זה יגיע כשיהיה כסף במשחק!</div>
  <div id="shopTabs"></div>
  <div id="shopGrid"></div>
  <button id="backLobbyBtn">⬅ חזרה ללובי</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121a29);
scene.fog = new THREE.Fog(0x121a29, 26, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
// המצלמה יושבת בחלל הפתוח שבין הזירה ליציעים, ומביטה מעל החבל העליון
camera.position.set(0, 3.9, 8.0);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
scene.add(new THREE.HemisphereLight(0xaec6e8, 0x2f2a24, 0.8));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff3dd, 2.2);
keyLight.position.set(-6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0012;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.9);
fillLight.position.set(7, 8, -6);
scene.add(fillLight);

// זרקורי זירה - נותנים תחושת אולם אגרוף
const spotA = new THREE.SpotLight(0xfff6e5, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotA.position.set(-3.5, 10, 3.5);
spotA.target.position.set(-1.7, 0.7, 0);
scene.add(spotA, spotA.target);

const spotB = new THREE.SpotLight(0xeaf2ff, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotB.position.set(3.5, 10, -3.5);
spotB.target.position.set(1.7, 0.7, 0);
scene.add(spotB, spotB.target);

// ---------- מידות הזירה ----------
const RING_HALF = 4.2;        // חצי רוחב הבמה
const RING_TOP = 0.7;         // גובה פני הבמה
const POST_HEIGHT = 1.75;     // גובה עמודי הפינה מעל הבמה
const ROPE_HEIGHTS = [0.5, 0.95, 1.4]; // 3 חבלים בכל צלע

// ---------- רצפת האולם ----------
const hallFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x39404e, roughness: 1 })
);
hallFloor.rotation.x = -Math.PI / 2;
hallFloor.receiveShadow = true;
scene.add(hallFloor);

// ---------- במת הזירה ----------
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.8, RING_TOP, RING_HALF * 2 + 0.8),
  new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.85 })
);
platform.position.y = RING_TOP / 2;
platform.castShadow = true;
platform.receiveShadow = true;
scene.add(platform);

// יריעת הקנבס (משטח הלחימה)
const canvasMat = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.85, 0.06, RING_HALF * 2 + 0.85),
  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, roughness: 0.95 })
);
canvasMat.position.y = RING_TOP + 0.01;
canvasMat.receiveShadow = true;
scene.add(canvasMat);

// עמודי פינה + כריות ריפוד
const cornerColors = [0xd32f2f, 0x1565c0, 0xd32f2f, 0x1565c0];
const corners = [
  [-RING_HALF, -RING_HALF],
  [ RING_HALF, -RING_HALF],
  [ RING_HALF,  RING_HALF],
  [-RING_HALF,  RING_HALF],
];

corners.forEach(([cx, cz], i) => {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, POST_HEIGHT, 14),
    new THREE.MeshStandardMaterial({ color: 0xc2c9d4, roughness: 0.35, metalness: 0.75 })
  );
  post.position.set(cx, RING_TOP + POST_HEIGHT / 2, cz);
  post.castShadow = true;
  scene.add(post);

  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.17, 1.15, 14),
    new THREE.MeshStandardMaterial({ color: cornerColors[i], roughness: 0.8 })
  );
  pad.position.set(cx, RING_TOP + 0.95, cz);
  pad.castShadow = true;
  scene.add(pad);
});

// חבלים - 3 בכל אחת מ-4 הצלעות

// ---------- יציעים וקהל ----------
// חשוב: כל יציע נבנה כ"מסגרת" חלולה מ-4 קטעים, ולא כקובייה מלאה -
// אחרת הקובייה הגדולה בולעת את הזירה ואת המצלמה.
const TIERS = 5;
const TIER_WIDTH = 2.0;
const FIRST_TIER_INNER = 9.0;   // מרוחק מספיק כדי להשאיר חלל פתוח למצלמה
const crowdPositions = [];

for (let t = 0; t < TIERS; t++) {
  const innerHalf = FIRST_TIER_INNER + t * TIER_WIDTH;
  const outerHalf = innerHalf + TIER_WIDTH;
  const height = 0.55 + t * 0.7;
  const mid = innerHalf + TIER_WIDTH / 2;

  const tierMat = new THREE.MeshStandardMaterial({
    color: t % 2 ? 0x3d4553 : 0x343b48,
    roughness: 0.95
  });

  // שני קטעים לאורך ציר X (מלוא הרוחב)
  [-mid, mid].forEach((z) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(outerHalf * 2, height, TIER_WIDTH), tierMat);
    seg.position.set(0, height / 2, z);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // שני קטעים לאורך ציר Z (בלי הפינות, שכבר נוצרו)
  [-mid, mid].forEach((x) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(TIER_WIDTH, height, innerHalf * 2), tierMat);
    seg.position.set(x, height / 2, 0);
    seg.receiveShadow = true;

  // פיזור צופים על גג היציע - שתי שורות בכל צלע
  [0.6, 1.4].forEach((rowOffset) => {
    const out = innerHalf + rowOffset;
    const step = 0.8;
    const span = innerHalf + TIER_WIDTH * 0.5;
    for (let d = -span; d <= span; d += step) {
      const along = d + (Math.random() - 0.5) * 0.3;
      const outJ = out + (Math.random() - 0.5) * 0.25;
      [[along, -outJ], [along, outJ], [-outJ, along], [outJ, along]].forEach(([x, z]) => {
        crowdPositions.push({ x, y: height, z, phase: Math.random() * Math.PI * 2 });
      });
    }
  });
}

const crowdCount = crowdPositions.length;

const crowdBodyGeo = new THREE.CapsuleGeometry(0.17, 0.34, 4, 8);

// ============================================================================
//  בניית דמות v2 — משטח רציף במקום הרכבת גופים נפרדים
//
//  שלושה עקרונות:
//  1. איבר = מש אחד שנמתח לאורך מסלול, כשעובי החתך משתנה לאורכו.
//     אין תפר → אין מה להסתיר → אין כדורי מפרקים ואין בליטות.
//  2. חתך אליפטי (רוחב ≠ עומק) → גוף, לא נקניק.
//  3. בגד = פרופיל הגוף עצמו + מרווח קבוע, על אותו מסלול בדיוק.
//     לכן הבד תמיד צמוד ואף פעם לא נחתך על ידי הגוף.
//
//  הפרופורציות נמדדו מתמונת הרפרנס: נער רזה בן ~6.2 ראשים, לא בובה של 5.
// ============================================================================

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- אינטרפולציה של פרופיל העובי ----------
function profileAt(keys, t) {
  if (t <= keys[0].t) return { rx: keys[0].rx, rz: keys[0].rz };
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const a = keys[i - 1], b = keys[i];
      let s = (t - a.t) / (b.t - a.t);
      s = s * s * (3 - 2 * s);              // smoothstep → מעבר רך בלי שברים
      return { rx: a.rx + (b.rx - a.rx) * s, rz: a.rz + (b.rz - a.rz) * s };
    }
  }
  const l = keys[keys.length - 1];
  return { rx: l.rx, rz: l.rz };
}

// ---------- מסגרת יציבה לאורך העקום ----------
// לא Frenet (שמתהפך בפיתול): מיישרים את ציר הרוחב לכיוון קבוע, כדי שהאיבר
// לא יתפתל סביב עצמו.
function frameAt(T, ref) {
  let N = ref.clone().addScaledVector(T, -ref.dot(T));
  if (N.lengthSq() < 1e-6) {
    const alt = Math.abs(T.y) > 0.9 ? V(0, 0, 1) : V(0, 1, 0);
    N = alt.clone().addScaledVector(T, -alt.dot(T));
  }
  N.normalize();
  return { N, B: new THREE.Vector3().crossVectors(T, N).normalize() };
}

const makeCurve = (points, tension = 0.5) =>
  new THREE.CatmullRomCurve3(points, false, 'centripetal', tension);

/**
 * מותח משטח רציף לאורך עקום.
 *  profile  - מערך {t,rx,rz} (t מנורמל בתוך uRange) או פונקציה (u) => {rx,rz}
 *  uRange   - איזה קטע מהעקום למתוח. מאפשר לבגד לרוץ על *אותו* מסלול כמו הגוף.
 *  capEnd   - 'flat' (קצה קבור בתוך גוף אחר) | 'round' (כיפה מעוגלת)
 */
function sweepCurve(mat, curve, profile, opts = {}) {
  const {
    radial = 32, steps = 28, refDir = V(1, 0, 0),
    capStart = 'flat', capEnd = 'flat', domeSteps = 7, domeScale = 1.0,
    uRange = [0, 1],
  } = opts;
  const [u0, u1] = uRange;
  const prof = typeof profile === 'function'
    ? profile
    : (u) => profileAt(profile, (u - u0) / (u1 - u0 || 1));

  const rings = [];
  const pushDome = (u, sign) => {
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const p = curve.getPointAt(u);
    const { rx, rz } = prof(u);
    const len = ((rx + rz) / 2) * domeScale;
    const ks = sign < 0
      ? Array.from({ length: domeSteps }, (_, i) => domeSteps - i)
      : Array.from({ length: domeSteps }, (_, i) => i + 1);
    for (const k of ks) {
      const a = (k / domeSteps) * (Math.PI / 2);
      rings.push({
        p: p.clone().addScaledVector(T, sign * Math.sin(a) * len),
        N, B, rx: rx * Math.cos(a), rz: rz * Math.cos(a),
      });
    }
  };

  if (capStart === 'round') pushDome(u0, -1);
  for (let i = 0; i <= steps; i++) {
    const u = u0 + (u1 - u0) * (i / steps);
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const { rx, rz } = prof(u);
    rings.push({ p: curve.getPointAt(u), N, B, rx, rz });
  }
  if (capEnd === 'round') pushDome(u1, 1);

  // ---------- טבעות → מש ----------
  const cols = radial + 1;               // הקודקוד האחרון משכפל את הראשון
  const pos = [], uv = [];
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    for (let j = 0; j < cols; j++) {
      const th = (j / radial) * Math.PI * 2;
      const c = Math.cos(th), s = Math.sin(th);
      pos.push(
        r.p.x + r.N.x * r.rx * c + r.B.x * r.rz * s,
        r.p.y + r.N.y * r.rx * c + r.B.y * r.rz * s,
        r.p.z + r.N.z * r.rx * c + r.B.z * r.rz * s,
      );
      uv.push(j / radial, i / (rings.length - 1));
    }
  }

  // סדר הקודקודים חייב להיות נגד כיוון השעון כשמסתכלים מבחוץ,
  // אחרת המשטח יוצא הפוך והדפדפן מציג לנו את *פנים* האיבר.
  const idx = [];
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * cols + j, b = a + cols;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }

  const addFan = (ringIndex, flip) => {
    const r = rings[ringIndex];
    const c = pos.length / 3;
    pos.push(r.p.x, r.p.y, r.p.z);
    uv.push(0.5, ringIndex / (rings.length - 1));
    for (let j = 0; j < radial; j++) {
      const a = ringIndex * cols + j;
      if (flip) idx.push(c, a + 1, a); else idx.push(c, a, a + 1);
    }
  };
  if (capStart === 'flat') addFan(0, true);
  if (capEnd === 'flat') addFan(rings.length - 1, false);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  // ריתוך התפר: הקודקוד הראשון והאחרון בכל טבעת חולקים מיקום אך קיבלו
  // נורמלים שונים. בלי מיצוע נראה קו תפר לאורך כל האיבר.
  const nrm = geo.attributes.normal;
  for (let i = 0; i < rings.length; i++) {
    const a = i * cols, b = a + radial;
    const nx = (nrm.getX(a) + nrm.getX(b)) / 2;
    const ny = (nrm.getY(a) + nrm.getY(b)) / 2;
    const nz = (nrm.getZ(a) + nrm.getZ(b)) / 2;
    const l = Math.hypot(nx, ny, nz) || 1;
    nrm.setXYZ(a, nx / l, ny / l, nz / l);
    nrm.setXYZ(b, nx / l, ny / l, nz / l);
  }
  nrm.needsUpdate = true;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const sweep = (mat, points, profile, opts = {}) =>
  sweepCurve(mat, makeCurve(points, opts.tension), profile, opts);

/**
 * בגד: רץ על *אותו* מסלול של הגוף, עם פרופיל הגוף + מרווח קבוע.
 * לכן הבד לעולם אינו נחתך על ידי הגוף ואינו "דלי" שהונח מלמעלה.
 *  pad   - מרווח מהעור
 *  bulge - תוספת מקומית (למשל שול מקופל), לפי t של הבגד עצמו
 */
/**
 * מותח משטח שהקצה העליון שלו נמצא בגובה *משתנה לפי הזווית*.
 * זה מה שמאפשר מחשוף אמיתי: הקצה עולה על הכתפיים ויורד בחזית ובגב.
 * צינור נמתח רגיל תמיד נגמר בטבעת שטוחה, ולכן הוא נראה כמו גופייה סטרפלס.
 */
function sweepShapedEdge(mat, curve, profileFn, opts = {}) {
  const { radial = 40, steps = 26, refDir = V(1, 0, 0), u0 = 0, edgeU } = opts;
  // u0 יכול להיות מספר (קצה ישר) *או פונקציה של θ* - קצה משונן, למשל שוליים
  // קרועים של חולצה. אותו דבר בדיוק כמו edgeU, רק בקצה השני של המשטח.
  const startU = typeof u0 === 'function' ? u0 : () => u0;
  const cols = radial + 1;
  const pos = [], uv = [];

  for (let i = 0; i <= steps; i++) {
    for (let j = 0; j < cols; j++) {
      const th = (j / radial) * Math.PI * 2;
      const uStart = startU(th);
      const u = uStart + (edgeU(th) - uStart) * (i / steps);
      const p = curve.getPointAt(u);
      const T = curve.getTangentAt(u).normalize();
      const { N, B } = frameAt(T, refDir);
      const { rx, rz } = profileFn(u);
      const c = Math.cos(th), s = Math.sin(th);
      pos.push(
        p.x + N.x * rx * c + B.x * rz * s,
        p.y + N.y * rx * c + B.y * rz * s,
        p.z + N.z * rx * c + B.z * rz * s,
      );
      uv.push(j / radial, i / steps);
    }
  }

  const idx = [];
  for (let i = 0; i < steps; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * cols + j, b = a + cols;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const nrm = geo.attributes.normal;
  for (let i = 0; i <= steps; i++) {
    const a = i * cols, b = a + radial;
    const nx = (nrm.getX(a) + nrm.getX(b)) / 2;
    const ny = (nrm.getY(a) + nrm.getY(b)) / 2;
    const nz = (nrm.getZ(a) + nrm.getZ(b)) / 2;
    const l = Math.hypot(nx, ny, nz) || 1;
    nrm.setXYZ(a, nx / l, ny / l, nz / l);
    nrm.setXYZ(b, nx / l, ny / l, nz / l);
  }
  nrm.needsUpdate = true;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ---------- מרקמי בד פרוצדורליים ----------
// נוצרים בקנבס בזמן ריצה, בלי קבצים חיצוניים — שומר על "קובץ אחד שנפתח בדפדפן".
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}

const ribbedKnit = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  for (let x = 0; x < n; x += 6) {
    ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(x, 0, 2, n);
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(x + 3, 0, 1, n);
  }
}, 14, 1);

const denimTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  for (let k = -n; k < n * 2; k += 4) {            // אריגת טוויל אלכסונית
    ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + n, n); ctx.stroke();
  }
  for (let i = 0; i < 1600; i++) {
    ctx.fillStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.05})`;
    ctx.fillRect(Math.random() * n, Math.random() * n, 1, 1);
  }
}, 5, 5);

const bandageTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  ctx.lineWidth = 2;
  for (let k = -n; k < n * 2; k += 12) {
    ctx.strokeStyle = 'rgba(0,0,0,0.11)';
    ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + n * 0.55, n); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(k + 4, 0); ctx.lineTo(k + 4 + n * 0.55, n); ctx.stroke();
  }
}, 3, 2);

const leatherTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  for (let i = 0; i < 2600; i++) {
    const g = Math.random() < 0.5 ? 0 : 255;
    ctx.fillStyle = `rgba(${g},${g},${g},${0.02 + Math.random() * 0.06})`;
    ctx.fillRect(Math.random() * n, Math.random() * n, 2, 2);
  }
}, 3, 3);

// קליפת אגוז (מסכת סטנבר) - מרקם חוזר (לא ממופה למקום מסוים, כי המסכה
// היא גוף עצמאי קטן ולא חלק ממערכת ה-UV המוסכמת של הגוף) עם קמטים
// כהים מעוקלים בכל הכיוונים, כמו הקמטים האמיתיים על קליפת אגוז.
const walnutShellTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  ctx.strokeStyle = 'rgba(40,24,12,0.5)';
  ctx.lineCap = 'round';
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * n, y = Math.random() * n;
    const len = n * (0.10 + Math.random() * 0.16);
    const ang = Math.random() * Math.PI * 2;
    ctx.lineWidth = n * (0.012 + Math.random() * 0.01);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
      x + Math.cos(ang) * len * 0.5 + (Math.random() - 0.5) * n * 0.10,
      y + Math.sin(ang) * len * 0.5 + (Math.random() - 0.5) * n * 0.10,
      x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
}, 2, 2);

// פסים צבעוניים אופקיים (כמו על ז'קט ורסיטי) - חוזרים לאורך האיבר, לא סביבו,
// ולכן repeat.set(1, ry): בלי חזרה סביב ההיקף (אין תפר בצבע), הרבה חזרות
// לאורך (טבעות צבע רצופות מהכתפיים ולמטה).
// stripeTex ו-textBandTex (למטה) הן היחידות מבין טקסטורות הקנבס שנועדו
// לשמש עם material.color לבן ניטרלי - כלומר הצבע שרואים הוא בדיוק הצבע
// שצויר בקנבס, בלי הכפלה עם גוון נוסף. בלי colorSpace מפורש three.js
// מפרש את הקנבס כ"לא-צבע" (linear), מה שמבהיר כל צבע כהה משמעותית -
// בדיוק הבאג שגרם לחולצה שחורה (0x1a1a1a) לצאת אפורה בהירה. שאר טקסטורות
// הקנבס בקובץ (ribbedKnit/denimTex/...) לא נגעו בהן, כי הן תמיד מוכפלות
// בגוון של material.color, שכבר כויל לפי איך שהן נראות היום.
const stripeTex = (baseHex, colors) => {
  const t = canvasTex(128, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    const bandH = n / (colors.length + 1.4);
    colors.forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.fillRect(0, bandH * (i * 1.4 + 0.7), n, bandH * 0.62);
    });
  }, 1, 4);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// פסי חתול על הראש (ברטו) - כמה קווים כהים מעוקלים על גבי צבע הבסיס,
// פזורים על פני כל הקנבס בלי לחשב מראש איפה בדיוק "החזית" על ה-UV
// הסטנדרטי של SphereGeometry (בניגוד לגוף, שנבנה עם UV מוסכם ומחושב -
// כאן זו בחירה סגנונית, אז בודקים ברינדור ולא פותרים משוואה). אותו
// עקרון colorSpace כמו stripeTex - הצבע האמיתי חי בתוך הקנבס.
const catStripeTex = (baseHex) => {
  const t = canvasTex(256, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    // ⚠️ ניסיון ראשון (רק 0.60 שקיפות) כמעט לא נראה תחת התאורה החזקה של
    // הזירה - אותו לקח כמו על צבעים - כאן על הניגוד מול הבסיס, לא רק על
    // הבהירות המוחלטת. הועלה לכמעט אטום וכהה משמעותית מהבסיס.
    ctx.strokeStyle = 'rgba(12,11,13,0.92)';
    ctx.lineCap = 'round';
    for (let i = 0; i < 34; i++) {
      const x = Math.random() * n, y = Math.random() * n;
      const len = n * (0.09 + Math.random() * 0.11);
      const ang = Math.random() * Math.PI * 2;
      ctx.lineWidth = n * (0.022 + Math.random() * 0.014);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(
        x + Math.cos(ang) * len * 0.5 + (Math.random() - 0.5) * n * 0.04,
        y + Math.sin(ang) * len * 0.5 + (Math.random() - 0.5) * n * 0.04,
        x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
  }, 1, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// עור מנומר (סלייקי) - כתמים גדולים וחוזרים של צבע שני על גבי צבע בסיס,
// לא ציור במקום מסוים (כמו catStripeTex) אלא מרקם חוזר, כי המרקם הזה
// מיושם על *כל* הגוף (skinMat עצמו) ולא רק על הראש - ראש, גו, ורגליים
// כולם משתמשים באותה טקסטורה חוזרת, בלי צורך במיקום מדויק.
const mottledSkinTex = (baseHex, spotHex) => {
  const t = canvasTex(128, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    ctx.fillStyle = spotHex;
    for (let i = 0; i < 22; i++) {
      ctx.beginPath();
      ctx.ellipse(
        Math.random() * n, Math.random() * n,
        n * (0.10 + Math.random() * 0.12), n * (0.07 + Math.random() * 0.09),
        Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
  }, 3, 3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// עור עם נקודות זוהרות (מוקרוט - "גוף אדום-סגול עם נקודות זוהרות") -
// אותו רעיון מבני כמו mottledSkinTex, רק נקודות עגולות קטנות במקום
// כתמים גדולים. לא זוהר אמיתי (החומר עדיין MeshStandardMaterial רגיל,
// לא emissive) - רק נקודות בהירות שקוראות כ"זוהרות" בניגוד לבסיס הכהה.
const glowDotsTex = (baseHex, dotHex) => {
  const t = canvasTex(128, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    ctx.fillStyle = dotHex;
    for (let i = 0; i < 40; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * n, Math.random() * n, n * (0.015 + Math.random() * 0.02), 0, Math.PI * 2);
      ctx.fill();
    }
  }, 4, 4);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// כתובת שעוטפת טבעת דקה פעם אחת בדיוק (בלי חזרה - repeat.set(1,1)), כמו
// כיתוב על גומי בוקסר. קנבס רחב ונמוך (לא ריבוע כמו canvasTex) כי הטבעת
// עצמה דקה מאוד וצריך שהטקסט לא ייצא מתוח אנכית.
function textBandTex(baseHex, text, textColor) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseHex; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = textColor;
  ctx.font = 'bold 60px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2 + 4);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// עיגול קשיח וקטן על בגד (סמל קבוצה) — לא חוזר על עצמו (בניגוד לשאר
// טקסטורות הקנבס), ולכן בלי RepeatWrapping. משמש עם MeshBasicMaterial
// כדי שהצבעים ייראו בדיוק כמו שצוירו בלי תלות בתאורת הסצנה.
function badgeTex(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  draw(c.getContext('2d'), 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// סמל כדורגל מפושט בצבעי ריאל מדריד (לבן/סגול/זהב) - לא עותק מדויק של
// הסמל האמיתי, רק עיגול בצבעי הקבוצה עם ראשי תיבות.
const realMadridCrestTex = () => badgeTex((ctx, n) => {
  const cx = n / 2, cy = n / 2, r = n * 0.46;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#4b1a63';
  ctx.fillRect(0, cy - r * 0.34, n, r * 0.68);
  ctx.restore();
  ctx.lineWidth = n * 0.05;
  ctx.strokeStyle = '#d9b23c';
  ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#d9b23c';
  ctx.font = `bold ${Math.round(n * 0.34)}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('RM', cx, cy + n * 0.01);
});

// סמל כדורסל מפושט בצבעי לייקרס (סגול/זהב) - אותו עיקרון: עיגול בצבעי
// הקבוצה עם ראשי תיבות, לא עותק של הסמל האמיתי.
const lakersLogoTex = () => badgeTex((ctx, n) => {
  const cx = n / 2, cy = n / 2, r = n * 0.46;
  ctx.fillStyle = '#552583';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = n * 0.05;
  ctx.strokeStyle = '#fdb927';
  ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fdb927';
  ctx.font = `bold ${Math.round(n * 0.36)}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('LA', cx, cy + n * 0.01);
});

// עיגול-רקע עם אות אחת גדולה עליו - "האות הגדולה" על חולצת התעופה של
// פלייטי. bg/letterColor הם צבעים מלאים (לא ברירת מחדל של קבוצה אמיתית).
const bigLetterBadgeTex = (bg, letterColor, letter) => badgeTex((ctx, n) => {
  const cx = n / 2, cy = n / 2, r = n * 0.48;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = letterColor;
  ctx.font = `bold ${Math.round(n * 0.62)}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(letter, cx, cy + n * 0.02);
});

// עיגול-רקע עם ברק - נייטווינג ("סמל סגול בצורת ברק על החזה"). אותו
// עיקרון כמו bigLetterBadgeTex, רק polygon של ברק במקום אות.
const lightningBadgeTex = (bg, boltColor) => badgeTex((ctx, n) => {
  const cx = n / 2, cy = n / 2, r = n * 0.48;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = boltColor;
  ctx.beginPath();
  ctx.moveTo(cx + n * 0.06, cy - n * 0.34);
  ctx.lineTo(cx - n * 0.16, cy + n * 0.04);
  ctx.lineTo(cx - n * 0.01, cy + n * 0.04);
  ctx.lineTo(cx - n * 0.09, cy + n * 0.34);
  ctx.lineTo(cx + n * 0.19, cy - n * 0.06);
  ctx.lineTo(cx + n * 0.03, cy - n * 0.06);
  ctx.closePath();
  ctx.fill();
});

// קעקוע - בניגוד לתגי הקבוצות (badgeTex, עיגול אטום) קעקוע צריך רקע
// *שקוף* כדי שהעור ייראה מסביב לציור, לא עיגול צבעוני. tattooTex משאירה
// את הקנבס שקוף (לא ממלאת רקע), והחומר שמשתמש בטקסטורה חייב transparent:true.
function tattooTex(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  draw(c.getContext('2d'), 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const INK = 'rgba(35,24,18,0.82)';
const letterTattooTex = (letter) => tattooTex((ctx, n) => {
  ctx.fillStyle = INK;
  ctx.font = `bold ${Math.round(n * 0.6)}px Georgia, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(letter, n / 2, n / 2 + n * 0.02);
});
// קעקוע מטוס + עננים, וענן אחד בצורת T (עשוי מכמה "תפוחים" עגולים כמו
// שאר העננים, מסודרים בצורת T) - לא ציור מדויק, רק סימון קטן ומזוהה.
const planeCloudsTattooTex = () => tattooTex((ctx, n) => {
  ctx.fillStyle = INK;
  ctx.save();
  ctx.translate(n * 0.5, n * 0.32);
  ctx.beginPath();
  ctx.ellipse(0, 0, n * 0.22, n * 0.045, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-n * 0.02, 0); ctx.lineTo(-n * 0.10, n * 0.13); ctx.lineTo(n * 0.02, n * 0.02); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(n * 0.18, 0); ctx.lineTo(n * 0.24, -n * 0.07); ctx.lineTo(n * 0.24, n * 0.01); ctx.closePath();
  ctx.fill();
  ctx.restore();
  const puff = (cx, cy, r) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  [[n * 0.20, n * 0.62, n * 0.07], [n * 0.28, n * 0.58, n * 0.09], [n * 0.36, n * 0.63, n * 0.065]]
    .forEach(([x, y, r]) => puff(x, y, r));
  const tx = n * 0.68, ty = n * 0.62, r = n * 0.055;
  [-1.4, 0, 1.4].forEach((k) => puff(tx + k * r, ty, r));
  [1, 2].forEach((k) => puff(tx, ty + k * r * 1.2, r * 0.9));
});

// ---------- דקאלים על הגוף (שקופים, קשיחים על עצם) ----------
// אותה שיטה בדיוק כמו הקעקועים של פלייטי: עיגול עם טקסטורה שקופה, קשיח
// על עצם (לא chain - ראה הלקח הטכני ב-CLAUDE.md). כאן זה משמש לסימני גוף:
// קוביות בטן, וצלקת.

// קוביות בטן - שני קווים אנכיים וכמה אופקיים, כמו שרטוט של "סיקס פק".
const absDecalTex = () => tattooTex((ctx, n) => {
  ctx.strokeStyle = 'rgba(30,20,14,0.5)';
  ctx.lineCap = 'round';
  ctx.lineWidth = n * 0.035;
  // הקו האנכי האמצעי (linea alba)
  ctx.beginPath(); ctx.moveTo(n * 0.5, n * 0.12); ctx.lineTo(n * 0.5, n * 0.82); ctx.stroke();
  // שלוש מדרגות אופקיות - שלושה זוגות קוביות
  ctx.lineWidth = n * 0.030;
  [0.30, 0.50, 0.68].forEach((y) => {
    ctx.beginPath();
    ctx.moveTo(n * 0.24, n * y);
    ctx.quadraticCurveTo(n * 0.5, n * (y + 0.045), n * 0.76, n * y);
    ctx.stroke();
  });
  // קווי הצד (הקו האלכסוני שמסגר את הבטן)
  ctx.lineWidth = n * 0.026;
  [[-1, 0.24], [1, 0.76]].forEach(([s, x]) => {
    ctx.beginPath();
    ctx.moveTo(n * x, n * 0.16);
    ctx.quadraticCurveTo(n * (x + s * 0.05), n * 0.5, n * (x - s * 0.02), n * 0.84);
    ctx.stroke();
  });
});

// צלקת ממקדחה: חור עגול כהה במרכז, וכמה קרעים שיוצאים ממנו החוצה.
const drillScarTex = () => tattooTex((ctx, n) => {
  const cx = n * 0.5, cy = n * 0.5;
  ctx.fillStyle = 'rgba(120,28,26,0.85)';
  ctx.beginPath(); ctx.arc(cx, cy, n * 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(60,12,12,0.9)';
  ctx.beginPath(); ctx.arc(cx, cy, n * 0.075, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,28,26,0.8)';
  ctx.lineCap = 'round';
  for (let k = 0; k < 7; k++) {
    const a = (k / 7) * Math.PI * 2 + 0.3;
    const len = n * (0.20 + (k % 3) * 0.06);
    ctx.lineWidth = n * (0.030 - (k % 2) * 0.008);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * n * 0.13, cy + Math.sin(a) * n * 0.13);
    ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.stroke();
  }
});

// מגן עם האות S - סמל בסגנון גיבור-על על התחתונים (סימון מסוגנן, לא
// העתק של סמל אמיתי - אותו עיקרון כמו סמלי הקבוצות של לורד).
const heroShieldTex = () => tattooTex((ctx, n) => {
  const cx = n * 0.5;
  ctx.beginPath();
  ctx.moveTo(cx, n * 0.14);
  ctx.lineTo(n * 0.86, n * 0.36);
  ctx.lineTo(cx, n * 0.88);
  ctx.lineTo(n * 0.14, n * 0.36);
  ctx.closePath();
  ctx.fillStyle = '#f2c14e'; ctx.fill();
  ctx.lineWidth = n * 0.05; ctx.strokeStyle = '#b8322a'; ctx.stroke();
  ctx.fillStyle = '#b8322a';
  ctx.font = `bold ${Math.round(n * 0.44)}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', cx, n * 0.47);
});

// חולצה עם ציור של קוביות - קוביות איזומטריות פזורות על הבד.
// כמו stripeTex/textBandTex, הצבע חי *בתוך* הטקסטורה, ולכן חובה colorSpace.
const cubeShirtTex = (baseHex) => {
  const t = canvasTex(128, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    // קוביה איזומטרית: שלוש פאות בגוונים שונים + קו מתאר כהה. בלי קו המתאר
    // ובגודל קטן הן נקראו כ"נקודות לבנות" ולא כקוביות - לכן גדולות ומודגשות.
    const cube = (cx, cy, s) => {
      const faces = [
        [[cx, cy - s], [cx + s, cy - s * 0.5], [cx, cy], [cx - s, cy - s * 0.5], '#ffffff'],
        [[cx - s, cy - s * 0.5], [cx, cy], [cx, cy + s], [cx - s, cy + s * 0.5], '#9fb6c4'],
        [[cx + s, cy - s * 0.5], [cx, cy], [cx, cy + s], [cx + s, cy + s * 0.5], '#d5e2ea'],
      ];
      faces.forEach((f) => {
        ctx.beginPath();
        ctx.moveTo(f[0][0], f[0][1]);
        for (let k = 1; k < 4; k++) ctx.lineTo(f[k][0], f[k][1]);
        ctx.closePath();
        ctx.fillStyle = f[4]; ctx.fill();
        ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(20,30,40,0.55)'; ctx.stroke();
      });
    };
    cube(34, 40, 26);
    cube(94, 88, 26);
  }, 2, 2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// חולצה בצבע גוף עם קוביות בטן מצוירות עליה - "שרירים מזויפים".
// בניגוד לשאר מרקמי הבד, הציור הזה חייב לשבת רק על *חזית* הגוף ולא לחזור
// סביבו, ולכן repeat(1,1) והציור ממוקם בחלק מסוים של הקנבס:
//   הציר האופקי בקנבס = הזווית סביב הגוף (ב-sweepShapedEdge), כשהחזית היא
//   θ=3π/2 כלומר u=0.75.
//   הציר האנכי: v=0 הוא שולי החולצה למטה ו-v=1 הכתפיים. three הופכת את
//   הטקסטורה אנכית (flipY), ולכן ראש הקנבס = הכתפיים ותחתיתו = השוליים.
const FRONT_U = 0.75;
const absShirtTex = (baseHex) => {
  const t = canvasTex(256, (ctx, n) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, n, n);
    const cx = n * FRONT_U;
    // דיו כהה ואטום למדי - בגרסה ראשונה הוא היה חיוור מדי והציור כמעט
    // נעלם על הבד הבהיר, במיוחד ליד דקאל הבטן החשופה שהוא כהה וחד.
    ctx.strokeStyle = 'rgba(86,50,28,0.82)';
    ctx.lineCap = 'round';

    // שני שרירי חזה למעלה
    ctx.lineWidth = n * 0.016;
    [-1, 1].forEach((s) => {
      ctx.beginPath();
      ctx.moveTo(cx + s * n * 0.006, n * 0.29);
      ctx.quadraticCurveTo(cx + s * n * 0.105, n * 0.305, cx + s * n * 0.118, n * 0.40);
      ctx.stroke();
    });
    ctx.beginPath();                       // הקו שמפריד בין שני שרירי החזה
    ctx.moveTo(cx, n * 0.29); ctx.lineTo(cx, n * 0.43);
    ctx.stroke();

    // קו אמצע הבטן
    ctx.lineWidth = n * 0.018;
    ctx.beginPath();
    ctx.moveTo(cx, n * 0.47); ctx.lineTo(cx, n * 0.88);
    ctx.stroke();

    // שלוש מדרגות אופקיות = שלושה זוגות קוביות
    ctx.lineWidth = n * 0.016;
    [0.57, 0.68, 0.79].forEach((y) => {
      ctx.beginPath();
      ctx.moveTo(cx - n * 0.098, n * y);
      ctx.quadraticCurveTo(cx, n * (y + 0.022), cx + n * 0.098, n * y);
      ctx.stroke();
    });

    // קווי המסגרת בצדי הבטן
    ctx.lineWidth = n * 0.014;
    [-1, 1].forEach((s) => {
      ctx.beginPath();
      ctx.moveTo(cx + s * n * 0.105, n * 0.47);
      ctx.quadraticCurveTo(cx + s * n * 0.120, n * 0.68, cx + s * n * 0.072, n * 0.90);
      ctx.stroke();
    });
  }, 1, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

function garment(mat, curve, bodyProfile, opts = {}) {
  const { u0 = 0, u1 = 1, pad = 0.008, bulge = null, ...rest } = opts;
  const profileFn = (u) => {
    const b = profileAt(bodyProfile, u);
    const e = bulge ? profileAt(bulge, (u - u0) / (u1 - u0 || 1)) : { rx: 0, rz: 0 };
    return { rx: b.rx + pad + e.rx, rz: b.rz + pad + e.rz };
  };
  return sweepCurve(mat, curve, profileFn, { ...rest, uRange: [u0, u1] });
}

/**
 * מסלול שרץ *על פני* בגד, בזווית קבועה סביבו.
 * משמש לתפרים, לשרוכים וללשונית — כל דבר שצריך לשבת על המשטח ולא לרחף לידו.
 *  theta - 0 = כיוון N, π/2 = כיוון B. במסלול רגל: π/2 הוא החזית.
 */
function seamPath(curve, profile, pad, theta, u0, u1, n = 10, refDir = V(1, 0, 0)) {
  const pts = [];
  const c = Math.cos(theta), s = Math.sin(theta);
  for (let i = 0; i < n; i++) {
    const u = u0 + (u1 - u0) * (i / (n - 1));
    const p = curve.getPointAt(u);
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const { rx, rz } = profileAt(profile, u);
    pts.push(p.clone()
      .addScaledVector(N, (rx + pad) * c)
      .addScaledVector(B, (rz + pad) * s));
  }
  return pts;
}

// ============================================================================
//  פרופורציות — הכל ביחידות רדיוס-גולגולת R, נמדד מתמונת הרפרנס.
//  שינוי R לבדו משנה את גודל הדמות כולה בלי לשבור אף יחס.
// ============================================================================

// יחסי הראש נמדדו מהרפרנס: הראש *צר וגבוה*, לא כדור.
// רוחב/גובה ≈ 0.64, ועומק גדול מרוחב — כמו ראש אנושי אמיתי.
// זו הייתה הסיבה העיקרית שהדמות נראתה כמו בובה.

// ---------- שלד: עמידת קרב לפי הרפרנס ----------
// הגבהים נמדדו כאחוז מגובה הדמות בתמונה. השינוי המשמעותי מהגרסה הקודמת:

// למפשעה — בדיוק כמו ברפרנס, ובלי זה פלג הגוף נראה קצר וילדותי.

  ankleL: V(-0.252, 0.135, -0.03), ankleR: V(0.236, 0.135, 0.122),

  pelvis: V(0, 0.655, 0),

  chest:  V(0, 1.245, 0.012),

  elbowL: V(-0.232, 1.082, 0.095),  elbowR: V(0.242, 1.072, 0.015),
  wristL: V(-0.138, 1.262, 0.202),  wristR: V(0.158, 1.358, 0.118),

function rng(seed) {                  // זרע קבוע → רינדורים ניתנים להשוואה
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

// ============================================================================
//  שלד עצמות + הצמדת עור (Skinning)
//
//  עד עכשיו הדמות הייתה פסל: משטח קפוא. כאן נשתלות בתוכה עצמות, וכל קודקוד
//  על פני העור מקבל שיוך לעצם הקרובה אליו. כשעצם מסתובבת — העור נמתח איתה.
//
//  שני סוגי שיוך:
//   • קשיח   — כל החלק נצמד לעצם אחת (ראש, שיער, פנים, אגרוף, כף רגל).
//              אלה חלקים שלא אמורים להתעוות בפנים, רק לזוז יחד עם האיבר.
//   • רך     — כל קודקוד משויך בנפרד לפי המקום שלו לאורך שרשרת העצמות,
//              ובאזור המפרק הוא מתחלק בין שתי עצמות → כיפוף חלק בלי שבר.
//
//  עמידת הקרב הקיימת היא *תנוחת הכריכה* (bind pose). כל סיבוב עצם באנימציה
//  הוא סטייה מהעמידה הזו, ולכן ברירת המחדל (אפס סיבוב) היא בדיוק המראה הישן.
// ============================================================================

// כיוון קדימה של כף רגל — נחוץ גם לבניית המגף וגם לקצה שרשרת הרגל
const FOOT_YAW = { L: -0.20, R: 0.17 };
const toeOf = (ankle, yaw) => V(
  ankle.x + Math.sin(yaw) * 0.160, 0.056, ankle.z + Math.cos(yaw) * 0.160);

// ---------- מפרקים: מיקום מנוחה של כל עצם ----------
const J = {
  root:  SKEL.pelvis.clone(),
  spine: SKEL.waist.clone(),
  chest: SKEL.chest.clone(),
  neck:  V(0, 1.365, 0.002),
  head:  V(0, 1.490, -0.004),
  shoulderL: SKEL.shoulderL.clone(), shoulderR: SKEL.shoulderR.clone(),
  elbowL: SKEL.elbowL.clone(),       elbowR: SKEL.elbowR.clone(),
  wristL: SKEL.wristL.clone(),       wristR: SKEL.wristR.clone(),
  hipL:   SKEL.hipL.clone(),         hipR:   SKEL.hipR.clone(),
  kneeL:  SKEL.kneeL.clone(),        kneeR:  SKEL.kneeR.clone(),
  ankleL: SKEL.ankleL.clone(),       ankleR: SKEL.ankleR.clone(),
};
// קצוות (לא עצמות — רק סוף שרשרת, כדי שלקטע האחרון יהיה אורך)
const TIP = {
  headTop: V(0, 1.640, -0.004),
  torsoTop: V(0, 1.400, 0.004),
  handL: V(-0.118, 1.300, 0.268), handR: V(0.182, 1.396, 0.184),
  toeL: toeOf(SKEL.ankleL, FOOT_YAW.L), toeR: toeOf(SKEL.ankleR, FOOT_YAW.R),
};

// ---------- עץ העצמות ----------
// הסדר חשוב: הורה תמיד לפני ילדיו.
const BONE_TREE = [
  ['root', null],
  ['spine', 'root'], ['chest', 'spine'], ['neck', 'chest'], ['head', 'neck'],
  ['shoulderL', 'chest'], ['elbowL', 'shoulderL'], ['wristL', 'elbowL'],
  ['shoulderR', 'chest'], ['elbowR', 'shoulderR'], ['wristR', 'elbowR'],
  ['hipL', 'root'], ['kneeL', 'hipL'], ['ankleL', 'kneeL'],
  ['hipR', 'root'], ['kneeR', 'hipR'], ['ankleR', 'kneeR'],
];
const BONE_NAMES = BONE_TREE.map(([n]) => n);
const BONE_INDEX = Object.fromEntries(BONE_NAMES.map((n, i) => [n, i]));

function buildBones() {
  const byName = {};
  const bones = BONE_TREE.map(([name, parent]) => {
    const b = new THREE.Bone();
    b.name = name;
    // מיקום מקומי = ההפרש מההורה. סיבוב מנוחה = אפס בכל העצמות, ולכן
    // הצירים המקומיים של כל עצם זהים לצירי הדמות — קל מאוד לאנימציה.
    const p = J[name];
    b.position.copy(parent ? p.clone().sub(J[parent]) : p);
    byName[name] = b;
    if (parent) byName[parent].add(b);
    return b;
  });
  return { bones, byName, root: bones[0] };
}

// ---------- שרשרת: קטע = [שם העצם ששולטת בו, נקודת התחלה, נקודת סוף] ----------
const CH = {
  torso: [['root', J.root, J.spine], ['spine', J.spine, J.chest], ['chest', J.chest, TIP.torsoTop]],
  neck:  [['chest', J.chest, J.neck], ['neck', J.neck, J.head], ['head', J.head, TIP.headTop]],
  armL:  [['chest', J.chest, J.shoulderL], ['shoulderL', J.shoulderL, J.elbowL],
          ['elbowL', J.elbowL, J.wristL], ['wristL', J.wristL, TIP.handL]],
  armR:  [['chest', J.chest, J.shoulderR], ['shoulderR', J.shoulderR, J.elbowR],
          ['elbowR', J.elbowR, J.wristR], ['wristR', J.wristR, TIP.handR]],
  legL:  [['root', J.root, J.hipL], ['hipL', J.hipL, J.kneeL],
          ['kneeL', J.kneeL, J.ankleL], ['ankleL', J.ankleL, TIP.toeL]],
  legR:  [['root', J.root, J.hipR], ['hipR', J.hipR, J.kneeR],
          ['kneeR', J.kneeR, J.ankleR], ['ankleR', J.ankleR, TIP.toeR]],
};

/**
 * בונה פונקציית שיוך לשרשרת: מקבלת נקודה, מחזירה עד 2 עצמות ומשקלים.
 *
 * השיטה: מוצאים את הקטע הקרוב ביותר, מחשבים כמה רחוק הקודקוד "התקדם" לאורך
 * השרשרת, ובחלון קטן סביב כל מפרק מחלקים את המשקל בין שתי העצמות השכנות.
 * זה מה שהופך את הכיפוף לחלק במקום לשבר חד.
 *  wnd - חצי-רוחב אזור הערבוב סביב המפרק (ביחידות של הדמות)
 */
function chainBinder(chain, wnd = 0.052) {
  let cum = 0;
  const segs = chain.map(([bone, a, b]) => {
    const d = b.clone().sub(a);
    const len = Math.max(d.length(), 1e-6);
    const s = { bone: BONE_INDEX[bone], a, d, len, dir: d.clone().divideScalar(len), s0: cum };
    cum += len;
    s.s1 = cum;
    return s;
  });

  const tmp = new THREE.Vector3();
  return (p) => {
    let best = 0, bestD = Infinity, bestT = 0;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      let t = tmp.copy(p).sub(s.a).dot(s.dir) / s.len;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dd = tmp.copy(s.a).addScaledVector(s.d, t).distanceToSquared(p);
      if (dd < bestD) { bestD = dd; best = i; bestT = t; }
    }
    const s = segs[best];
    const arc = s.s0 + bestT * s.len;
    const smooth = (a) => a * a * (3 - 2 * a);

    // קרוב למפרק ההתחלה → מתערבב עם העצם שלפני; קרוב לסוף → עם זו שאחרי
    if (best > 0 && arc - s.s0 < wnd) {
      const k = smooth(0.5 + 0.5 * ((arc - s.s0) / wnd));
      return [s.bone, segs[best - 1].bone, k, 1 - k];
    }
    if (best < segs.length - 1 && s.s1 - arc < wnd) {
      const k = smooth(0.5 + 0.5 * ((s.s1 - arc) / wnd));
      return [s.bone, segs[best + 1].bone, k, 1 - k];
    }
    return [s.bone, 0, 1, 0];
  };
}

// חלון הערבוב סביב המפרק. בכתף הוא רחב יותר: שם המעבר הוא מגוף עבה מאוד
// לזרוע דקה, ובחלון צר נוצר קמט חד בדלתא בכל הרמת יד.
const CHAIN_WND = { armL: 0.085, armR: 0.085 };

const BINDER_CACHE = new Map();
function binderFor(key) {
  if (!BINDER_CACHE.has(key)) BINDER_CACHE.set(key, chainBinder(CH[key], CHAIN_WND[key] ?? 0.052));
  return BINDER_CACHE.get(key);
}

/** ממיר מש רגיל למש עם עור מוצמד לעצמות. */
function toSkinned(mesh, chainKey) {
  const geo = mesh.geometry;
  const pos = geo.attributes.position;
  const n = pos.count;
  const idx = new Uint16Array(n * 4);
  const wgt = new Float32Array(n * 4);
  const bind = binderFor(chainKey);
  const p = new THREE.Vector3();

  for (let i = 0; i < n; i++) {
    p.fromBufferAttribute(pos, i);
    const [b0, b1, w0, w1] = bind(p);
    idx[i * 4] = b0; idx[i * 4 + 1] = b1;
    wgt[i * 4] = w0; wgt[i * 4 + 1] = w1;
  }
  geo.setAttribute('skinIndex', new THREE.BufferAttribute(idx, 4));
  geo.setAttribute('skinWeight', new THREE.BufferAttribute(wgt, 4));

  const sm = new THREE.SkinnedMesh(geo, mesh.material);
  sm.castShadow = true;
  sm.receiveShadow = true;
  sm.frustumCulled = false;      // התיבה התוחמת לא מתעדכנת בעיוות → אחרת נעלם
  return sm;
}

// ============================================================================

function createFighter(cfg) {
  const g = new THREE.Group();
  const rand = rng(cfg.seed ?? 12345);
  const S = SKEL;

  // כל חלק נרשם יחד עם השיוך שלו לעצמות. BIND הוא "השיוך הנוכחי" ומשתנה
  // בראש כל אזור בגוף, כדי שלא צריך לחזור עליו בכל שורה.
  //   { chain: 'legL' } → עור רך שמתעוות
  //   { bone: 'head' }  → חלק קשיח שנוסע עם עצם אחת
  const parts = [];
  let BIND = null;
  const part = (m) => { parts.push({ m, bind: BIND }); g.add(m); return m; };
  const M = (color, roughness, metalness = 0) =>
    new THREE.MeshStandardMaterial({ color, roughness, metalness });

  // עור מנומר (cfg.mottledSkin, סלייקי) מחליף את skinMat *הכללי* עצמו -
  // בניגוד ל-headMat למטה (שמיוחד רק לראש), כאן כל הגוף חשוף (בלי בגדים)
  // וצריך את אותו מרקם בכל מקום, אז הכי פשוט להחליף את skinMat עצמו.
  // עור מקועקע (cfg.tattooedSkin, קולין - "כל הגוף שלו קעקועים כולל
  // הראש") - אותו רעיון בדיוק כמו העור המנומר למעלה, רק במקום כתמים
  // (mottledSkinTex) עושה שימוש חוזר ב-catStripeTex (קווים כהים
  // מעוקלים) שכבר נבנה בשביל פסי החתול של ברטו - קווי דיו על עור קוראים
  // דומה מאוד לקווי פס, אז אותה טקסטורה עובדת לשני השימושים בלי שינוי.
  const skinMat = cfg.mottledSkin ? new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.62,
    map: mottledSkinTex(
      '#' + new THREE.Color(cfg.skin).getHexString(),
      '#' + new THREE.Color(cfg.mottledColor2 ?? 0xcc2222).getHexString()),
  }) : cfg.tattooedSkin ? new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.62,
    map: catStripeTex('#' + new THREE.Color(cfg.skin).getHexString()),
  }) : cfg.glowDotsSkin ? new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.55,
    map: glowDotsTex(
      '#' + new THREE.Color(cfg.skin).getHexString(),
      '#' + new THREE.Color(cfg.glowDotsColor ?? 0xffe28a).getHexString()),
  }) : cfg.crystalSkin ? new THREE.MeshStandardMaterial({
    // עור גביש (לוסטר) - לא טקסטורה, חומר מבריק וחלק (roughness נמוך,
    // metalness בינוני) שנותן מראה של קריסטל מלוטש בלי צורך בשקיפות
    // אמיתית (שקיפות אמיתית מסתבכת עם סדר רינדור וצללים במנוע הפשוט הזה).
    color: cfg.skin, roughness: 0.15, metalness: 0.35,
  }) : M(cfg.skin, 0.62);
  // פסי חתול (cfg.catStripes) חיים רק על הראש (כולל הלסת) - הגוף נשאר
  // בגוון אחיד. אותו עיקרון בדיוק כמו jacketMat: הצבע חי בתוך המרקם
  // עצמו, ולכן צבע החומר לבן ניטרלי.
  const headMat = cfg.catStripes ? new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.62,
    map: catStripeTex('#' + new THREE.Color(cfg.skin).getHexString()),
  }) : skinMat;
  const hairMat  = M(cfg.hair, 0.88);
  // cfg.topTex מחליף את מרקם הסריג הרגיל בטקסטורה משלו (למשל הקוביות של
  // זיק). טקסטורה כזו נושאת את הצבע בעצמה, ולכן צבע החומר נשאר לבן ניטרלי -
  // בדיוק כמו stripeTex/textBandTex (ראה הלקח על colorSpace ב-CLAUDE.md).
  const topMat = cfg.top ? new THREE.MeshStandardMaterial({
    color: cfg.topTex ? 0xffffff : cfg.top,
    roughness: 0.92,
    map: cfg.topTex
      ? cfg.topTex('#' + new THREE.Color(cfg.top).getHexString())
      : ribbedKnit('#ffffff'),
    side: THREE.DoubleSide,          // לקצה המחשוף יש צד פנימי שנראה
  }) : null;
  // הצבע על החומר עצמו (לא רק על המרקם) ישכפל את הגוון על פני הפסים ויעמעם
  // אותם - ולכן כאן, בניגוד לבגדים האחרים, הבסיס האפור נצבע *בתוך* המרקם
  // עצמו, וצבע החומר נשאר לבן ניטרלי.
  const jacketMat = cfg.jacket ? new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.85,
    map: stripeTex('#' + new THREE.Color(cfg.jacket).getHexString(),
      cfg.jacketStripes ?? ['#e4573d', '#f2b632', '#3fa7a0', '#e85fa0']),
    side: THREE.DoubleSide,
  }) : null;
  // cfg.pantsLeather (חדש, לסטנבר - "מכנסיים מעור שור") מחליף את מרקם
  // האריגה של הג'ינס במרקם עור מחוספס. שניהם משתמשים ב-'#ffffff' כבסיס
  // ומכפילים בצבע החומר עצמו (cfg.pants), אז ההחלפה בטוחה.
  const pantsMat = cfg.pants ? new THREE.MeshStandardMaterial({
    color: cfg.pants, roughness: cfg.pantsLeather ? 0.55 : 0.94,
    map: cfg.pantsLeather ? leatherTex('#ffffff') : denimTex('#ffffff'),
  }) : null;
  const boxerMat = cfg.boxers ? M(cfg.boxers, 0.85) : null;
  const bootMat = cfg.boots ? new THREE.MeshStandardMaterial({
    color: cfg.boots, roughness: 0.55, map: leatherTex('#ffffff'),
  }) : null;
  const soleMat  = M(0x2f241c, 0.95);
  const laceMat  = M(0xd9c9a8, 0.85);
  const cuffMat = cfg.pants ? new THREE.MeshStandardMaterial({
    color: 0x89a2cb, roughness: 0.94, map: denimTex('#ffffff'),
  }) : null;
  const threadMat = M(0xd8b276, 0.85);
  const beltMat  = new THREE.MeshStandardMaterial({ color: 0x4a3323, roughness: 0.5, map: leatherTex('#ffffff') });
  const buckleMat = M(0xb9a06a, 0.28, 0.85);
  const wrapMat = new THREE.MeshStandardMaterial({
    color: 0xf2efe7, roughness: 0.96, map: bandageTex('#ffffff'),
  });
  const eyeWhiteMat = M(0xfcfcfc, 0.22);
  // עיניים זוהרות (cfg.glowEyes, למשל נייטווינג/לוסטר) - MeshBasicMaterial
  // לא מושפע מתאורה, ולכן נשאר בהיר וקבוע גם בפינות חשוכות של הזירה,
  // בניגוד ל-M() הרגיל (MeshStandardMaterial) שכהה בצל. גם האישון זוהר
  // באותו גוון (לא שחור) - עין "זוהרת" אמיתית היא כתם אור אחיד, לא גלגל
  // עין רגיל עם אישון כהה.
  const irisMat  = cfg.glowEyes
    ? new THREE.MeshBasicMaterial({ color: cfg.eyeColor ?? 0x5a3a20 })
    : M(cfg.eyeColor ?? 0x5a3a20, 0.28);
  const pupilMat = cfg.glowEyes ? irisMat : M(0x120e0a, 0.2);
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mouthMat = M(cfg.lipColor ?? 0x8a4a44, 0.6);
  const lashMat = M(0x1a1310, 0.7);
  const goldMat  = M(0xd9b23c, 0.2, 0.95);

  // הרגל הבסיסית (מתחת לכל בגד) בצבע המכנס, כי במכנסיים ארוכים (ברירת
  // המחדל) הם מכסים את כל הרגל ואין טעם לבנות עור מתחתיהם שלעולם לא ייראה.
  // אבל במכנסי ספורט קצרים (cfg.shorts) המכנס עצמו הוא רק overlay קצר על
  // חלק מהרגל (ראה למטה) - והבסיס *כן* צריך להיות עור, אחרת השוק "לובשת
  // מכנסיים" גם מתחת לקו המכנס הקצר.
  const legMat = (pantsMat && !cfg.shorts) ? pantsMat : skinMat;

  // ---------- פלג גוף עליון ----------
  // מסלול רציף מהאגן עד קו הכתפיים, עם כיפה רדודה שיוצרת את שיפוע הטרפז.
  // אין כדור חזה ואין כדור אגן.
  const torsoCurve = makeCurve([S.pelvis, S.waist, S.chest, S.torsoTop]);
  BIND = { chain: 'torso' };
  part(sweepCurve(skinMat, torsoCurve, TORSO_PROFILE, {
    refDir: V(1, 0, 0), steps: 38, capEnd: 'round', domeScale: 0.55,
  }));

  // ---------- רגליים ----------
  // המסלול מתחיל *בתוך* האגן → החיבור קבור ואינו נראה מבחוץ.
  const legCurves = [];
  const LEG_KEYS = ['legL', 'legR'];
  [[S.hipL, S.kneeL, S.ankleL], [S.hipR, S.kneeR, S.ankleR]].forEach(([hip, knee, ankle], li) => {
    const hipIn = V(hip.x * 0.40, hip.y + 0.055, hip.z);
    const c = makeCurve([hipIn, hip, knee, ankle]);
    legCurves.push(c);
    BIND = { chain: LEG_KEYS[li] };
    part(sweepCurve(legMat, c, LEG_PROFILE, { refDir: V(1, 0, 0), steps: 34 }));
  });

  // ---------- תחתונים ----------
  if (boxerMat && !pantsMat) {
    BIND = { chain: 'torso' };
    part(garment(boxerMat, torsoCurve, TORSO_PROFILE, { u0: 0, u1: 0.38, pad: 0.011, steps: 18 }));
    legCurves.forEach((c, li) => {
      BIND = { chain: LEG_KEYS[li] };
      part(garment(boxerMat, c, LEG_PROFILE, { u0: 0.02, u1: 0.26, pad: 0.010, steps: 12 }));
    });
  }

  // ---------- מכנסיים ----------
  // רצים על אותו מסלול של הרגל עם מרווח קבוע → הבד צמוד.
  // השול המקופל הוא תוספת מקומית לאותו משטח, לא טבעת מרחפת.
  if (pantsMat) {
    BIND = { chain: 'torso' };
    part(garment(pantsMat, torsoCurve, TORSO_PROFILE, { u0: 0, u1: 0.40, pad: 0.012, steps: 20 }));

    // מכנסי כדורסל קצרים (cfg.shorts) - אורך רגל מתכוונן (cfg.pantsLength),
    // בלי שול מקופל, בלי תפר ג'ינס ובלי חגורה/אבזם - שום דבר מזה לא קיים
    // במכנסי ספורט. פרטי הג'ינס (CUFF_BULGE, תפר, חגורה) נשארים ברירת מחדל.
    const pantsLegU1 = cfg.pantsLength ?? 0.755;
    const pantsPad = cfg.pantsPad ?? 0.011;   // "צמוד"/leggings = pad קטן יותר
    const CUFF_BULGE = [
      { t: 0.00, rx: 0, rz: 0 }, { t: 0.80, rx: 0, rz: 0 },
      { t: 0.90, rx: 0.011, rz: 0.011 }, { t: 1.00, rx: 0.009, rz: 0.009 },
    ];
    legCurves.forEach((c, li) => {
      BIND = { chain: LEG_KEYS[li] };
      part(garment(pantsMat, c, LEG_PROFILE, {
        u0: 0.02, u1: pantsLegU1, pad: pantsPad, bulge: cfg.shorts ? null : CUFF_BULGE, steps: 30,
      }));

      if (!cfg.shorts) {
        // שול ג'ינס מקופל (יש ברפרנס) — שכבה קצרה מעל אותו מסלול
        part(garment(cuffMat, c, LEG_PROFILE, { u0: 0.665, u1: 0.775, pad: 0.021, steps: 12 }));

        // תפר חיצוני — חוט בגוון חול, יושב על פני הבד ולא לידו
        const outer = c === legCurves[0] ? Math.PI : 0;
        part(sweep(threadMat, seamPath(c, LEG_PROFILE, 0.012, outer, 0.10, 0.70, 10),
          [pr(0, 0.028, 0.028), pr(1, 0.028, 0.028)],
          { steps: 22, radial: 8, capStart: 'round', capEnd: 'round' }));
      }

      // פס צבע שני על הצד החיצוני (מכנס דו-גוני) - אותה שיטה כמו התפר
      // למעלה, רק רחב יותר ובצבע נבדל, כדי לתת מראה של "תכלת ולבן".
      if (cfg.pantsStripeColor) {
        const outer = c === legCurves[0] ? Math.PI : 0;
        part(sweep(M(cfg.pantsStripeColor, 0.7), seamPath(c, LEG_PROFILE, 0.015, outer, 0.04, 0.72, 14),
          [pr(0, 0.055, 0.055), pr(1, 0.040, 0.040)],
          { steps: 26, radial: 10, capStart: 'round', capEnd: 'round' }));
      }
    });

    // חגורה: תמיד עם מכנס ארוך (ג'ינס), ובנוסף עם מכנס קצר אם cfg.belt
    // ביקש זאת במפורש (ברטו - "מכנסיים קצרצרים" *עם* חגורה לפי האפיון).
    if (!cfg.shorts || cfg.belt) {
      BIND = { chain: 'torso' };
      part(garment(beltMat, torsoCurve, TORSO_PROFILE, { u0: 0.335, u1: 0.390, pad: 0.015, steps: 8 }));
      const bp = torsoCurve.getPointAt(0.362);
      const bprof = profileAt(TORSO_PROFILE, 0.362);
      const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.046, 0.02), buckleMat);
      buckle.position.set(bp.x, bp.y, bp.z + bprof.rz + 0.014);
      buckle.castShadow = true;
      BIND = { bone: 'root' };
      part(buckle);
    }

    // ---------- כיסים ----------
    // מלבן תפר על חזית המכנסיים, ליד הירך - לא כיס תלת-ממדי אמיתי (עוד
    // שכבת בד), רק ארבע צלעות שמסמנות אותו, באותה שיטה של התפר בג'ינס.
    // (לא seamPath עצמה - היא מחלקת ב-n-1 ונשברת עבור נקודה בודדת.)
    const torsoPointAt = (u, theta) => {
      const p = torsoCurve.getPointAt(u);
      const T = torsoCurve.getTangentAt(u).normalize();
      const { N, B } = frameAt(T, V(1, 0, 0));
      const { rx, rz } = profileAt(TORSO_PROFILE, u);
      const c = Math.cos(theta), s = Math.sin(theta);
      return p.clone().addScaledVector(N, (rx + 0.013) * c).addScaledVector(B, (rz + 0.013) * s);
    };
    if (cfg.pockets) {
      [-1, 1].forEach((sgn) => {
        // θ=3π/2 הוא החזית (כמו בהערה על הגופייה למעלה) - כיסים אמיתיים
        // יושבים קצת לצדדים מהאמצע, לא בדיוק במרכז ולא ממש בצד.
        const theta = 1.5 * Math.PI + sgn * 0.55;
        const across = V(-Math.sin(theta), 0, Math.cos(theta));
        const width = 0.075;
        const top = torsoPointAt(0.325, theta);
        const bot = torsoPointAt(0.205, theta);
        const corners = [
          top.clone().addScaledVector(across, -width / 2), top.clone().addScaledVector(across, width / 2),
          bot.clone().addScaledVector(across, width / 2), bot.clone().addScaledVector(across, -width / 2),
        ];
        for (let i = 0; i < 4; i++) {
          part(sweep(threadMat, [corners[i], corners[(i + 1) % 4]],
            [pr(0, 0.022, 0.022), pr(1, 0.022, 0.022)],
            { steps: 2, radial: 8, capStart: 'round', capEnd: 'round' }));
        }
      });
    }

    // סמל קבוצה על המכנס (למשל לוגו לייקרס) — עיגול שטוח קשיח על עצם הירך,
    // כמו האבזם למעלה. לא נבנה על פני הבד עצמו כי זה דורש UV מדויק על משטח
    // מעוקל; עיגול שמצמיד לחזית הירך נראה נכון ופשוט הרבה יותר לבנות.
    if (cfg.pantsLogoTex) {
      BIND = { bone: 'hipR' };
      const logo = new THREE.Mesh(new THREE.CircleGeometry(0.032, 24),
        new THREE.MeshBasicMaterial({ map: cfg.pantsLogoTex() }));
      logo.position.set(S.hipR.x + 0.012, S.hipR.y - 0.045, S.hipR.z + 0.095);
      part(logo);
    }
  }

  // ---------- זנב חתול ----------
  // קשיח על עצם האגן (root) - כמו האבזם למעלה - ולא chain, כי הוא לא
  // אמור להתעוות עם הליכה, רק לנוע יחד עם הגוף כולו. צבע הפרווה, אם לא
  // נקבע במפורש (cfg.catFurColor), הולך אחרי צבע השיער - כדי שיתאים.
  // ⚠️ עובי: pr() מכפיל תמיד ב-R (רדיוס הגולגולת, 0.117) - עובי בסיס
  // ברמת "קצה אוזן" (0.04) יצא חוט דק כמעט בלתי-נראה, לא זנב. תוקן
  // לעובי ברמת קרסול/פרק כף יד (0.30 בבסיס), נמצא ברינדור.
  if (cfg.catTail) {
    BIND = { bone: 'root' };
    // cfg.tailLength (חדש, סלייקי - "זנב ארוך") מאריך את הזנב פרופורציונלית
    // - האופסטים מ-pelvis.y (לא pelvis.y עצמו) מוכפלים, כך שהבסיס נשאר
    // צמוד לגוף והקצה מתרחק. cfg.tailStripeColor (חדש) מחליף את הפרווה
    // האחידה במרקם פסים (stripeTex הקיים, שכבר נותן טבעות צבע חוזרות
    // לאורך צינור - בדיוק "פסים" על זנב).
    const tailLen = cfg.tailLength ?? 1;
    const tailMat = cfg.tailStripeColor
      ? new THREE.MeshStandardMaterial({
          color: 0xffffff, roughness: 0.75,
          map: stripeTex('#' + new THREE.Color(cfg.catFurColor ?? cfg.hair).getHexString(),
            ['#' + new THREE.Color(cfg.tailStripeColor).getHexString()]),
        })
      : M(cfg.catFurColor ?? cfg.hair, 0.75);
    part(sweep(tailMat, [
      V(0, S.pelvis.y - 0.01, -0.085),
      V(0, S.pelvis.y + 0.16 * tailLen, -0.26 * tailLen),
      V(0.05, S.pelvis.y + 0.32 * tailLen, -0.30 * tailLen),
    ], [
      pr(0, 0.300, 0.300), pr(0.55, 0.200, 0.200), pr(1, 0.040, 0.040),
    ], { steps: 16, radial: 14, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.6 }));
  }

  // ---------- הצצת בוקסר מעל המכנסיים ----------
  // רק כשגם מכנסיים וגם בוקסר מוגדרים ובוטl הדגל המפורש cfg.boxerPeek -
  // שכבה דקה שמתחילה בדיוק איפה שהמכנסיים נגמרים, עם pad קצת יותר גדול
  // כדי שהיא תיראה בולטת מעל קו החגורה ולא שטוחה על אותו קו.
  if (boxerMat && pantsMat && cfg.boxerPeek) {
    const peekMat = cfg.boxerText
      ? new THREE.MeshStandardMaterial({
          color: 0xffffff, roughness: 0.85,
          map: textBandTex('#' + new THREE.Color(cfg.boxers).getHexString(), cfg.boxerText, '#ffffff'),
          side: THREE.DoubleSide,
        })
      : boxerMat;
    BIND = { chain: 'torso' };
    part(garment(peekMat, torsoCurve, TORSO_PROFILE, { u0: 0.398, u1: 0.448, pad: 0.017, steps: 12 }));
  }

  // ---------- סימנים על הגוף (קוביות בטן, צלקת, סמל על התחתונים) ----------
  // דקאל שקוף על חזית הגוף, קשיח על עצם - אותה שיטה בדיוק כמו הקעקועים
  // של פלייטי (עיגול קטן ודחוס לא עובד עם chain/skinning - ראה CLAUDE.md).
  // θ=3π/2 היא החזית, ולכן הנורמל בחזית הוא -B של מסגרת פלג הגוף.
  // lift = כמה לרחף מעל פני הגוף. על עור חשוף מספיק 0.005, אבל דקאל שיושב
  // *על בגד* חייב לעבור את עובי הבגד (ה-pad שלו), אחרת הוא נבלע בתוכו.
  const bodyDecal = (texFn, u, size, boneName, lift = 0.005) => {
    const p = torsoCurve.getPointAt(u);
    const T = torsoCurve.getTangentAt(u).normalize();
    const { B } = frameAt(T, V(1, 0, 0));
    const { rz } = profileAt(TORSO_PROFILE, u);
    const nrm = B.clone().negate();          // חזית
    const d = new THREE.Mesh(new THREE.CircleGeometry(size, 22),
      new THREE.MeshBasicMaterial({ map: texFn(), transparent: true, side: THREE.DoubleSide }));
    d.position.copy(p.clone().addScaledVector(nrm, rz + lift));
    d.quaternion.setFromUnitVectors(V(0, 0, 1), nrm);
    const saved = BIND;
    BIND = { bone: boneName };
    part(d);
    BIND = saved;
  };

  if (cfg.abs) bodyDecal(absDecalTex, 0.30, 0.105, 'spine');
  // הצלקת יושבת על הבטן החשופה, מתחת לשולי החולצה הקרועה ומעל התחתונים
  if (cfg.bellyScar) bodyDecal(drillScarTex, 0.43, 0.070, 'spine');
  // הסמל יושב *על* התחתונים, ולכן lift גדול יותר מעובי הבגד (pad 0.011)
  if (cfg.heroShield) bodyDecal(heroShieldTex, 0.145, 0.052, 'root', 0.020);

  // ---------- חצאית / קימונו על הרגליים ----------
  // לא נבנית על עקום פלג הגוף (הוא נגמר באגן) אלא על מסלול משלה שיורד
  // מהמותניים כלפי מטה ומתרחב. `sweepShapedEdge` מאפשר קצה תחתון משונן,
  // ולכן "חצאית קרועה" היא בדיוק אותה בנייה עם edgeU אחר.
  if (cfg.skirt) {
    const sk = cfg.skirt;
    const top = S.pelvis.y + (sk.top ?? 0.10);
    const len = sk.len ?? 0.42;
    const skirtCurve = makeCurve([
      V(0, top, 0), V(0, top - len * 0.5, 0.004), V(0, top - len, 0.008),
    ]);
    const r0 = sk.r0 ?? 0.145, r1 = sk.r1 ?? 0.215;
    const skirtProfile = (u) => {
      const k = r0 + (r1 - r0) * u;
      return { rx: k, rz: k * 0.82 };
    };
    const skirtMat = new THREE.MeshStandardMaterial({
      color: sk.color, roughness: 0.9, map: ribbedKnit('#ffffff'), side: THREE.DoubleSide,
    });
    const bottom = sk.torn
      ? (th) => 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(th * 6 + 0.7)) * (0.5 + 0.5 * Math.sin(th * 2.5))
      : () => 1.0;
    BIND = { bone: 'root' };
    part(sweepShapedEdge(skirtMat, skirtCurve, skirtProfile,
      { u0: 0, edgeU: bottom, radial: 40, steps: 22, refDir: V(1, 0, 0) }));
  }

  // ---------- כפות רגליים / מגפיים ----------
  // שוק המגף עדיין מתעוות עם הרגל, אבל הכף עצמה נוסעת קשיח עם עצם הקרסול.
  const ANKLE_BONES = ['ankleL', 'ankleR'];
  [[S.ankleL, legCurves[0], FOOT_YAW.L], [S.ankleR, legCurves[1], FOOT_YAW.R]]
      .forEach(([ankle, legCurve, yaw], fi) => {
    const legKey = LEG_KEYS[fi];
    const footBone = { bone: ANKLE_BONES[fi] };
    const fwd = V(Math.sin(yaw), 0, Math.cos(yaw));
    const y = 0.066;
    const heel = ankle.clone().setY(y).addScaledVector(fwd, -0.060);
    const mid  = ankle.clone().setY(y + 0.004).addScaledVector(fwd, 0.045);
    const toe  = ankle.clone().setY(y - 0.010).addScaledVector(fwd, 0.160);

    if (bootMat) {
      // שוק המגף — המשך ישיר של מסלול הרגל, לא גליל נפרד
      BIND = { chain: legKey };
      part(garment(bootMat, legCurve, LEG_PROFILE, { u0: 0.735, u1: 1.0, pad: 0.019, steps: 16 }));

      // כף המגף — מסלול אופקי, חתך רחב ושטוח, קצוות מעוגלים
      BIND = footBone;
      part(sweep(bootMat, [heel, mid, toe], [
        pr(0.00, 0.38, 0.37), pr(0.34, 0.42, 0.34), pr(0.70, 0.40, 0.30), pr(1.00, 0.31, 0.23),
      ], { steps: 24, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));

      // כיסוי בוהן — מדרגה עדינה בעור, כמו במגף עבודה
      part(sweep(bootMat,
        [mid.clone().addScaledVector(fwd, 0.012), toe.clone().addScaledVector(fwd, -0.012)],
        [pr(0.00, 0.43, 0.325), pr(1.00, 0.345, 0.255)],
        { steps: 12, refDir: V(0, 1, 0), capStart: 'flat', capEnd: 'round', domeScale: 0.7 }));

      // סוליה
      part(sweep(soleMat,
        [heel.clone().setY(y - 0.038), mid.clone().setY(y - 0.044), toe.clone().setY(y - 0.046)],
        [pr(0.00, 0.22, 0.40), pr(0.5, 0.24, 0.37), pr(1.00, 0.18, 0.28)],
        { steps: 18, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));

      // עקב
      part(sweep(soleMat,
        [heel.clone().setY(y - 0.062).addScaledVector(fwd, 0.004),
         heel.clone().setY(y - 0.062).addScaledVector(fwd, 0.062)],
        [pr(0, 0.20, 0.36), pr(1, 0.21, 0.37)],
        { steps: 6, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'flat', domeScale: 0.6 }));

      // לשונית — יושבת על חזית השוק, מתחת לשרוכים
      part(sweep(bootMat, seamPath(legCurve, LEG_PROFILE, 0.013, Math.PI / 2, 0.775, 0.995, 6),
        [pr(0, 0.20, 0.05), pr(0.5, 0.23, 0.06), pr(1, 0.21, 0.05)],
        { steps: 12, radial: 18, refDir: V(1, 0, 0) }));

      // שרוכים משוכלים בין שני טורי לולאות
      const colL = seamPath(legCurve, LEG_PROFILE, 0.024, Math.PI / 2 + 0.62, 0.785, 0.985, 4);
      const colR = seamPath(legCurve, LEG_PROFILE, 0.024, Math.PI / 2 - 0.62, 0.785, 0.985, 4);
      for (let i = 0; i < colL.length - 1; i++) {
        [[colL[i], colR[i + 1]], [colR[i], colL[i + 1]]].forEach(([a, b]) => {
          part(sweep(laceMat, [a, b], [pr(0, 0.038, 0.038), pr(1, 0.038, 0.038)],
            { steps: 4, radial: 8, capStart: 'round', capEnd: 'round', domeScale: 0.8 }));
        });
      }
    } else {
      // מתחילה גבוה ועבה מספיק כדי להיבלע בקרסול, אחרת נראית צביטה
      BIND = footBone;
      part(sweep(skinMat,
        [heel.clone().setY(y + 0.016), mid.clone().setY(y + 0.008), toe],
        [pr(0.00, 0.46, 0.32), pr(0.4, 0.42, 0.31), pr(0.75, 0.38, 0.27), pr(1.00, 0.28, 0.19)],
        { steps: 22, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.8 }));

      // ---------- כפכפים ----------
      // סוליה דקה ושטוחה מתחת לכף הרגל היחפה, ורצועת V פשוטה: עמוד קטן
      // בין הבהונות, ושתי רצועות שנפתחות ממנו לצדדים - כמו כפכף אמיתי.
      if (cfg.flipflops) {
        const flipMat = M(cfg.flipflopColor ?? 0x2b2b2f, 0.75);
        BIND = footBone;
        part(sweep(flipMat,
          [heel.clone().setY(y - 0.018), mid.clone().setY(y - 0.020), toe.clone().setY(y - 0.017)],
          [pr(0.00, 0.30, 0.44), pr(0.5, 0.32, 0.40), pr(1.00, 0.27, 0.33)],
          { steps: 18, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));

        const side = V(Math.cos(yaw), 0, -Math.sin(yaw));
        const post = mid.clone().setY(y + 0.020).addScaledVector(fwd, 0.095);
        part(sweep(flipMat, [post.clone().setY(y - 0.006), post],
          [pr(0, 0.018, 0.018), pr(1, 0.012, 0.012)],
          { steps: 4, radial: 8, capStart: 'round', capEnd: 'round' }));
        [-1, 1].forEach((sgn) => {
          const edge = mid.clone().setY(y + 0.004).addScaledVector(side, sgn * 0.150);
          part(sweep(flipMat, [post, mid.clone().setY(y + 0.012), edge],
            [pr(0, 0.015, 0.015), pr(0.5, 0.012, 0.012), pr(1, 0.009, 0.009)],
            { steps: 8, radial: 8, capStart: 'round', capEnd: 'round' }));
        });
      }

      // ---------- קרוקס ----------
      // סנדל-נעל עבה: סוליה גבוהה, "קליפה" מעוגלת שמכסה את הבהונות ואת
      // גב כף הרגל (אבל לא את העקב), ורצועה אחורית. החורים האופייניים
      // מסומנים כשקעים קטנים כהים על גב הקליפה - לא חורים אמיתיים, שזה
      // היה דורש לחתוך את המש.
      if (cfg.crocs) {
        const crocMat = M(cfg.crocColor ?? 0xe85f9c, 0.72);
        BIND = footBone;
        // סוליה עבה
        part(sweep(crocMat,
          [heel.clone().setY(y - 0.030), mid.clone().setY(y - 0.033), toe.clone().setY(y - 0.028)],
          [pr(0.00, 0.36, 0.50), pr(0.5, 0.38, 0.47), pr(1.00, 0.32, 0.38)],
          { steps: 18, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));
        // קליפה מעוגלת מעל הבהונות ועד אמצע כף הרגל
        part(sweep(crocMat,
          [mid.clone().setY(y + 0.006).addScaledVector(fwd, -0.030),
           mid.clone().setY(y + 0.020).addScaledVector(fwd, 0.055),
           toe.clone().setY(y + 0.004).addScaledVector(fwd, -0.012)],
          [pr(0.00, 0.44, 0.40), pr(0.55, 0.42, 0.36), pr(1.00, 0.33, 0.26)],
          { steps: 16, refDir: V(0, 1, 0), capStart: 'flat', capEnd: 'round', domeScale: 0.75 }));
        // חורים - שקעים כהים קטנים על גב הקליפה
        const holeMat = M(0x8f3a63, 0.8);
        const side2 = V(Math.cos(yaw), 0, -Math.sin(yaw));
        [[-1, 0.02], [0, 0.045], [1, 0.02]].forEach(([sgn, f2]) => {
          const h = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), holeMat);
          h.position.copy(mid.clone().setY(y + 0.040)
            .addScaledVector(fwd, f2).addScaledVector(side2, sgn * 0.030));
          h.scale.set(1, 0.5, 1);
          part(h);
        });
        // רצועה אחורית
        part(sweep(crocMat,
          [heel.clone().setY(y + 0.010).addScaledVector(side2, -0.032),
           heel.clone().setY(y + 0.052).addScaledVector(fwd, -0.012),
           heel.clone().setY(y + 0.010).addScaledVector(side2, 0.032)],
          [pr(0, 0.10, 0.06), pr(0.5, 0.10, 0.05), pr(1, 0.10, 0.06)],
          { steps: 10, radial: 10, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round' }));
      }
    }

    // ---------- גרביים ארוכות ----------
    // רצות על אותו מסלול של הרגל (כמו המכנסיים) מהקרסול כלפי מעלה עד
    // איפה שהמכנס נגמר. `transparent`+`opacity` נותנים את ה"קצת שקוף".
    // נבנות מחוץ ל-if של הנעליים, כי הן שייכות לרגל ולא לכף הרגל.
    if (cfg.socks) {
      const sk = cfg.socks;
      const sockMat = new THREE.MeshStandardMaterial({
        color: sk.color, roughness: 0.9,
