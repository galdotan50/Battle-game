<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - סווארק מול בו</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  #controls {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 0.95rem;
    text-align: center;
    z-index: 10;
    line-height: 1.7;
  }
  #controls b {
    display: inline-block;
    background: #ffffff;
    color: #111;
    border-radius: 5px;
    padding: 1px 7px;
    margin: 0 3px;
    font-family: monospace;
  }
  canvas { display: block; }

  #hpRow {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    direction: ltr;   /* העמוד כולו RTL, אבל סווארק תמיד עומד משמאל בזירה -
                         חייבים סדר פיזי קבוע כדי שהפס שלו לא יתחלף עם של בו */
    justify-content: space-between;
    padding: 0 18px;
    z-index: 10;
    pointer-events: none;
  }
  .hpBar { display: flex; flex-direction: column; gap: 3px; width: 230px; }
  .hpEnemy { align-items: flex-end; }
  .hpName {
    color: #fff;
    font-size: 0.9rem;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }
  .hpTrack {
    width: 100%;
    height: 18px;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 9px;
    overflow: hidden;
  }
  .hpEnemy .hpTrack { display: flex; justify-content: flex-end; }
  .hpFill { height: 100%; width: 100%; transition: width 0.25s ease-out; }
  .hpPlayer .hpFill { background: linear-gradient(90deg, #3ddc74, #24a852); }
  .hpEnemy .hpFill { background: linear-gradient(90deg, #ff6b5b, #e63946); }
  .hpNum { color: #fff; font-size: 0.78rem; opacity: 0.9; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }

  #hitFlash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255,25,25,0.5) 100%);
    opacity: 0;
  }
  @keyframes hitFlashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
  #hitFlash.show { animation: hitFlashAnim 0.35s ease-out; }

  #gameOverOverlay {
    position: fixed;
    inset: 0;
    background: rgba(5,8,14,0.74);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #gameOverOverlay.show { opacity: 1; pointer-events: auto; }
  #gameOverTitle {
    font-size: 3rem;
    color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.7);
    font-weight: 800;
  }
  #playAgainBtn {
    font-size: 1.2rem;
    padding: 12px 34px;
    border-radius: 14px;
    border: none;
    background: #ffcf4d;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #playAgainBtn:hover { background: #ffd968; }
  #btnRow { display: flex; gap: 14px; }
  #lobbyBtn, #backLobbyBtn {
    font-size: 1.2rem;
    padding: 12px 34px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  #lobbyBtn:hover, #backLobbyBtn:hover { background: rgba(255,255,255,0.18); }

  /* ---------- לובי וחנות: מסכים מלאים מעל הזירה ---------- */
  #lobbyOverlay, #shopOverlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 40;
    color: #fff;
    overflow-y: auto;
    padding: 40px 20px;
    box-sizing: border-box;
  }
  #shopOverlay { background: linear-gradient(160deg, #16213a, #0c1220); }
  /* בלובי הרקע שקוף חלקית - כדי שסווארק (מרונדר מאחורי המסך) יראה מבעד לתפריט */
  #lobbyOverlay {
    background: linear-gradient(200deg, rgba(22,33,58,0.55), rgba(12,18,32,0.72));
    justify-content: flex-end;
    padding-bottom: 60px;
  }
  #lobbyOverlay.show, #shopOverlay.show { display: flex; }
  #loadoutLabel {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 8px 22px;
    font-size: 1.05rem;
    margin-bottom: 22px;
  }
  .screenTitle { font-size: 2.4rem; font-weight: 800; margin-bottom: 34px; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
  #lobbyOverlay .bigBtn {
    font-size: 1.3rem;
    padding: 20px 50px;
    margin: 10px;
    border-radius: 16px;
    border: none;
    background: #ffcf4d;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #lobbyOverlay .bigBtn:hover { background: #ffd968; }
  #lobbyOverlay .bigBtn.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.4); }
  #lobbyOverlay .bigBtn.secondary:hover { background: rgba(255,255,255,0.2); }

  #shopNote {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 0.95rem;
    margin-bottom: 22px;
    max-width: 640px;
    text-align: center;
  }
  #shopTabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .shopTab {
    font-size: 1.05rem;
    padding: 10px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  .shopTab:hover { background: rgba(255,255,255,0.16); }
  .shopTab.active { background: #ffcf4d; color: #1a1a1a; border-color: #ffcf4d; }
  #shopGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 980px;
  }
  .itemCard {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .itemName { font-size: 1.05rem; font-weight: bold; margin-bottom: 8px; }
  .itemStat { font-size: 0.85rem; opacity: 0.85; margin: 2px 0; }
  .itemPrice { margin-top: 8px; font-size: 0.95rem; font-weight: bold; color: #ffcf4d; }
  #backLobbyBtn { margin-top: 30px; }
</style>
</head>
<body>
<div id="label">🥊 סווארק מול בו - שלב חיים ונזק</div>
<div id="controls">
  <b>←</b> <b>→</b> לזוז &nbsp;·&nbsp; <b>A</b> אגרוף &nbsp;·&nbsp; <b>S</b> בעיטה &nbsp;·&nbsp; <b>W</b> אבן חדה &nbsp;·&nbsp; <b>D</b> חסימה
</div>

<div id="hpRow">
  <div class="hpBar hpPlayer">
    <div class="hpName">סווארק</div>
    <div class="hpTrack"><div class="hpFill" id="hpFillPlayer"></div></div>
    <div class="hpNum" id="hpNumPlayer">100 / 100</div>
  </div>
  <div class="hpBar hpEnemy">
    <div class="hpName">בו</div>
    <div class="hpTrack"><div class="hpFill" id="hpFillEnemy"></div></div>
    <div class="hpNum" id="hpNumEnemy">75 / 75</div>
  </div>
</div>

<div id="hitFlash"></div>

<div id="gameOverOverlay">
  <div id="gameOverTitle"></div>
  <div id="btnRow">
    <button id="playAgainBtn">🔄 לשחק שוב</button>
    <button id="lobbyBtn">🏠 לובי</button>
  </div>
</div>

<div id="lobbyOverlay">
  <div id="loadoutLabel">🥊 סווארק &nbsp;·&nbsp; 🪨 אבן חדה</div>
  <button class="bigBtn" id="startFightBtn">⚔️ התחל קרב</button>
  <button class="bigBtn secondary" id="openShopBtn">🛒 חנות</button>
</div>

<div id="shopOverlay">
  <div class="screenTitle">🛒 חנות</div>
  <div id="shopNote">👀 אפשר לראות מה יש בחנות, אבל עדיין אי אפשר לקנות - זה יגיע כשיהיה כסף במשחק!</div>
  <div id="shopTabs"></div>
  <div id="shopGrid"></div>
  <button id="backLobbyBtn">⬅ חזרה ללובי</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121a29);
scene.fog = new THREE.Fog(0x121a29, 26, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
// המצלמה יושבת בחלל הפתוח שבין הזירה ליציעים, ומביטה מעל החבל העליון
camera.position.set(0, 3.9, 8.0);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
scene.add(new THREE.HemisphereLight(0xaec6e8, 0x2f2a24, 0.8));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff3dd, 2.2);
keyLight.position.set(-6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0012;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.9);
fillLight.position.set(7, 8, -6);
scene.add(fillLight);

// זרקורי זירה - נותנים תחושת אולם אגרוף
const spotA = new THREE.SpotLight(0xfff6e5, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotA.position.set(-3.5, 10, 3.5);
spotA.target.position.set(-1.7, 0.7, 0);
scene.add(spotA, spotA.target);

const spotB = new THREE.SpotLight(0xeaf2ff, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotB.position.set(3.5, 10, -3.5);
spotB.target.position.set(1.7, 0.7, 0);
scene.add(spotB, spotB.target);

// ---------- מידות הזירה ----------
const RING_HALF = 4.2;        // חצי רוחב הבמה
const RING_TOP = 0.7;         // גובה פני הבמה
const POST_HEIGHT = 1.75;     // גובה עמודי הפינה מעל הבמה
const ROPE_HEIGHTS = [0.5, 0.95, 1.4]; // 3 חבלים בכל צלע

// ---------- רצפת האולם ----------
const hallFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x39404e, roughness: 1 })
);
hallFloor.rotation.x = -Math.PI / 2;
hallFloor.receiveShadow = true;
scene.add(hallFloor);

// ---------- במת הזירה ----------
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.8, RING_TOP, RING_HALF * 2 + 0.8),
  new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.85 })
);
platform.position.y = RING_TOP / 2;
platform.castShadow = true;
platform.receiveShadow = true;
scene.add(platform);

// יריעת הקנבס (משטח הלחימה)
const canvasMat = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.85, 0.06, RING_HALF * 2 + 0.85),
  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, roughness: 0.95 })
);
canvasMat.position.y = RING_TOP + 0.01;
canvasMat.receiveShadow = true;
scene.add(canvasMat);

// עמודי פינה + כריות ריפוד
const cornerColors = [0xd32f2f, 0x1565c0, 0xd32f2f, 0x1565c0];
const corners = [
  [-RING_HALF, -RING_HALF],
  [ RING_HALF, -RING_HALF],
  [ RING_HALF,  RING_HALF],
  [-RING_HALF,  RING_HALF],
];

corners.forEach(([cx, cz], i) => {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, POST_HEIGHT, 14),
    new THREE.MeshStandardMaterial({ color: 0xc2c9d4, roughness: 0.35, metalness: 0.75 })
  );
  post.position.set(cx, RING_TOP + POST_HEIGHT / 2, cz);
  post.castShadow = true;
  scene.add(post);

  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.17, 1.15, 14),
    new THREE.MeshStandardMaterial({ color: cornerColors[i], roughness: 0.8 })
  );
  pad.position.set(cx, RING_TOP + 0.95, cz);
  pad.castShadow = true;
  scene.add(pad);
});

// חבלים - 3 בכל אחת מ-4 הצלעות
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
const ropeLen = RING_HALF * 2;

ROPE_HEIGHTS.forEach((h) => {
  const y = RING_TOP + h;

  [-RING_HALF, RING_HALF].forEach((z) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.z = Math.PI / 2;
    rope.position.set(0, y, z);
    rope.castShadow = true;
    scene.add(rope);
  });

  [-RING_HALF, RING_HALF].forEach((x) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.x = Math.PI / 2;
    rope.position.set(x, y, 0);
    rope.castShadow = true;
    scene.add(rope);
  });
});

// ---------- יציעים וקהל ----------
// חשוב: כל יציע נבנה כ"מסגרת" חלולה מ-4 קטעים, ולא כקובייה מלאה -
// אחרת הקובייה הגדולה בולעת את הזירה ואת המצלמה.
const TIERS = 5;
const TIER_WIDTH = 2.0;
const FIRST_TIER_INNER = 9.0;   // מרוחק מספיק כדי להשאיר חלל פתוח למצלמה
const crowdPositions = [];

for (let t = 0; t < TIERS; t++) {
  const innerHalf = FIRST_TIER_INNER + t * TIER_WIDTH;
  const outerHalf = innerHalf + TIER_WIDTH;
  const height = 0.55 + t * 0.7;
  const mid = innerHalf + TIER_WIDTH / 2;

  const tierMat = new THREE.MeshStandardMaterial({
    color: t % 2 ? 0x3d4553 : 0x343b48,
    roughness: 0.95
  });

  // שני קטעים לאורך ציר X (מלוא הרוחב)
  [-mid, mid].forEach((z) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(outerHalf * 2, height, TIER_WIDTH), tierMat);
    seg.position.set(0, height / 2, z);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // שני קטעים לאורך ציר Z (בלי הפינות, שכבר נוצרו)
  [-mid, mid].forEach((x) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(TIER_WIDTH, height, innerHalf * 2), tierMat);
    seg.position.set(x, height / 2, 0);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // פיזור צופים על גג היציע - שתי שורות בכל צלע
  [0.6, 1.4].forEach((rowOffset) => {
    const out = innerHalf + rowOffset;
    const step = 0.8;
    const span = innerHalf + TIER_WIDTH * 0.5;
    for (let d = -span; d <= span; d += step) {
      const along = d + (Math.random() - 0.5) * 0.3;
      const outJ = out + (Math.random() - 0.5) * 0.25;
      [[along, -outJ], [along, outJ], [-outJ, along], [outJ, along]].forEach(([x, z]) => {
        crowdPositions.push({ x, y: height, z, phase: Math.random() * Math.PI * 2 });
      });
    }
  });
}

const crowdCount = crowdPositions.length;

const crowdBodyGeo = new THREE.CapsuleGeometry(0.17, 0.34, 4, 8);
const crowdHeadGeo = new THREE.SphereGeometry(0.145, 10, 10);
const crowdMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });

const crowdBodies = new THREE.InstancedMesh(crowdBodyGeo, crowdMat, crowdCount);
const crowdHeads = new THREE.InstancedMesh(crowdHeadGeo, crowdMat, crowdCount);
crowdBodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
crowdHeads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const shirtPalette = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xe67e22, 0xecf0f1, 0x1abc9c];
const skinPalette = [0xf0c39a, 0xd9a273, 0xb07a4e, 0x8a5a35, 0x66401f];

const dummy = new THREE.Object3D();
const colorTmp = new THREE.Color();

crowdPositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y + 0.36, p.z);
  dummy.updateMatrix();
  crowdBodies.setMatrixAt(i, dummy.matrix);

  dummy.position.set(p.x, p.y + 0.76, p.z);
  dummy.updateMatrix();
  crowdHeads.setMatrixAt(i, dummy.matrix);

  crowdBodies.setColorAt(i, colorTmp.setHex(shirtPalette[Math.floor(Math.random() * shirtPalette.length)]));
  crowdHeads.setColorAt(i, colorTmp.setHex(skinPalette[Math.floor(Math.random() * skinPalette.length)]));
});

scene.add(crowdBodies, crowdHeads);

// ============================================================================
//  בניית דמות v2 — משטח רציף במקום הרכבת גופים נפרדים
//
//  שלושה עקרונות:
//  1. איבר = מש אחד שנמתח לאורך מסלול, כשעובי החתך משתנה לאורכו.
//     אין תפר → אין מה להסתיר → אין כדורי מפרקים ואין בליטות.
//  2. חתך אליפטי (רוחב ≠ עומק) → גוף, לא נקניק.
//  3. בגד = פרופיל הגוף עצמו + מרווח קבוע, על אותו מסלול בדיוק.
//     לכן הבד תמיד צמוד ואף פעם לא נחתך על ידי הגוף.
//
//  הפרופורציות נמדדו מתמונת הרפרנס: נער רזה בן ~6.2 ראשים, לא בובה של 5.
// ============================================================================

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- אינטרפולציה של פרופיל העובי ----------
function profileAt(keys, t) {
  if (t <= keys[0].t) return { rx: keys[0].rx, rz: keys[0].rz };
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const a = keys[i - 1], b = keys[i];
      let s = (t - a.t) / (b.t - a.t);
      s = s * s * (3 - 2 * s);              // smoothstep → מעבר רך בלי שברים
      return { rx: a.rx + (b.rx - a.rx) * s, rz: a.rz + (b.rz - a.rz) * s };
    }
  }
  const l = keys[keys.length - 1];
  return { rx: l.rx, rz: l.rz };
}

// ---------- מסגרת יציבה לאורך העקום ----------
// לא Frenet (שמתהפך בפיתול): מיישרים את ציר הרוחב לכיוון קבוע, כדי שהאיבר
// לא יתפתל סביב עצמו.
function frameAt(T, ref) {
  let N = ref.clone().addScaledVector(T, -ref.dot(T));
  if (N.lengthSq() < 1e-6) {
    const alt = Math.abs(T.y) > 0.9 ? V(0, 0, 1) : V(0, 1, 0);
    N = alt.clone().addScaledVector(T, -alt.dot(T));
  }
  N.normalize();
  return { N, B: new THREE.Vector3().crossVectors(T, N).normalize() };
}

const makeCurve = (points, tension = 0.5) =>
  new THREE.CatmullRomCurve3(points, false, 'centripetal', tension);

/**
 * מותח משטח רציף לאורך עקום.
 *  profile  - מערך {t,rx,rz} (t מנורמל בתוך uRange) או פונקציה (u) => {rx,rz}
 *  uRange   - איזה קטע מהעקום למתוח. מאפשר לבגד לרוץ על *אותו* מסלול כמו הגוף.
 *  capEnd   - 'flat' (קצה קבור בתוך גוף אחר) | 'round' (כיפה מעוגלת)
 */
function sweepCurve(mat, curve, profile, opts = {}) {
  const {
    radial = 32, steps = 28, refDir = V(1, 0, 0),
    capStart = 'flat', capEnd = 'flat', domeSteps = 7, domeScale = 1.0,
    uRange = [0, 1],
  } = opts;
  const [u0, u1] = uRange;
  const prof = typeof profile === 'function'
    ? profile
    : (u) => profileAt(profile, (u - u0) / (u1 - u0 || 1));

  const rings = [];
  const pushDome = (u, sign) => {
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const p = curve.getPointAt(u);
    const { rx, rz } = prof(u);
    const len = ((rx + rz) / 2) * domeScale;
    const ks = sign < 0
      ? Array.from({ length: domeSteps }, (_, i) => domeSteps - i)
      : Array.from({ length: domeSteps }, (_, i) => i + 1);
    for (const k of ks) {
      const a = (k / domeSteps) * (Math.PI / 2);
      rings.push({
        p: p.clone().addScaledVector(T, sign * Math.sin(a) * len),
        N, B, rx: rx * Math.cos(a), rz: rz * Math.cos(a),
      });
    }
  };

  if (capStart === 'round') pushDome(u0, -1);
  for (let i = 0; i <= steps; i++) {
    const u = u0 + (u1 - u0) * (i / steps);
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const { rx, rz } = prof(u);
    rings.push({ p: curve.getPointAt(u), N, B, rx, rz });
  }
  if (capEnd === 'round') pushDome(u1, 1);

  // ---------- טבעות → מש ----------
  const cols = radial + 1;               // הקודקוד האחרון משכפל את הראשון
  const pos = [], uv = [];
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    for (let j = 0; j < cols; j++) {
      const th = (j / radial) * Math.PI * 2;
      const c = Math.cos(th), s = Math.sin(th);
      pos.push(
        r.p.x + r.N.x * r.rx * c + r.B.x * r.rz * s,
        r.p.y + r.N.y * r.rx * c + r.B.y * r.rz * s,
        r.p.z + r.N.z * r.rx * c + r.B.z * r.rz * s,
      );
      uv.push(j / radial, i / (rings.length - 1));
    }
  }

  // סדר הקודקודים חייב להיות נגד כיוון השעון כשמסתכלים מבחוץ,
  // אחרת המשטח יוצא הפוך והדפדפן מציג לנו את *פנים* האיבר.
  const idx = [];
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * cols + j, b = a + cols;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }

  const addFan = (ringIndex, flip) => {
    const r = rings[ringIndex];
    const c = pos.length / 3;
    pos.push(r.p.x, r.p.y, r.p.z);
    uv.push(0.5, ringIndex / (rings.length - 1));
    for (let j = 0; j < radial; j++) {
      const a = ringIndex * cols + j;
      if (flip) idx.push(c, a + 1, a); else idx.push(c, a, a + 1);
    }
  };
  if (capStart === 'flat') addFan(0, true);
  if (capEnd === 'flat') addFan(rings.length - 1, false);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  // ריתוך התפר: הקודקוד הראשון והאחרון בכל טבעת חולקים מיקום אך קיבלו
  // נורמלים שונים. בלי מיצוע נראה קו תפר לאורך כל האיבר.
  const nrm = geo.attributes.normal;
  for (let i = 0; i < rings.length; i++) {
    const a = i * cols, b = a + radial;
    const nx = (nrm.getX(a) + nrm.getX(b)) / 2;
    const ny = (nrm.getY(a) + nrm.getY(b)) / 2;
    const nz = (nrm.getZ(a) + nrm.getZ(b)) / 2;
    const l = Math.hypot(nx, ny, nz) || 1;
    nrm.setXYZ(a, nx / l, ny / l, nz / l);
    nrm.setXYZ(b, nx / l, ny / l, nz / l);
  }
  nrm.needsUpdate = true;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const sweep = (mat, points, profile, opts = {}) =>
  sweepCurve(mat, makeCurve(points, opts.tension), profile, opts);

/**
 * בגד: רץ על *אותו* מסלול של הגוף, עם פרופיל הגוף + מרווח קבוע.
 * לכן הבד לעולם אינו נחתך על ידי הגוף ואינו "דלי" שהונח מלמעלה.
 *  pad   - מרווח מהעור
 *  bulge - תוספת מקומית (למשל שול מקופל), לפי t של הבגד עצמו
 */
/**
 * מותח משטח שהקצה העליון שלו נמצא בגובה *משתנה לפי הזווית*.
 * זה מה שמאפשר מחשוף אמיתי: הקצה עולה על הכתפיים ויורד בחזית ובגב.
 * צינור נמתח רגיל תמיד נגמר בטבעת שטוחה, ולכן הוא נראה כמו גופייה סטרפלס.
 */
function sweepShapedEdge(mat, curve, profileFn, opts = {}) {
  const { radial = 40, steps = 26, refDir = V(1, 0, 0), u0 = 0, edgeU } = opts;
  const cols = radial + 1;
  const pos = [], uv = [];

  for (let i = 0; i <= steps; i++) {
    for (let j = 0; j < cols; j++) {
      const th = (j / radial) * Math.PI * 2;
      const u = u0 + (edgeU(th) - u0) * (i / steps);
      const p = curve.getPointAt(u);
      const T = curve.getTangentAt(u).normalize();
      const { N, B } = frameAt(T, refDir);
      const { rx, rz } = profileFn(u);
      const c = Math.cos(th), s = Math.sin(th);
      pos.push(
        p.x + N.x * rx * c + B.x * rz * s,
        p.y + N.y * rx * c + B.y * rz * s,
        p.z + N.z * rx * c + B.z * rz * s,
      );
      uv.push(j / radial, i / steps);
    }
  }

  const idx = [];
  for (let i = 0; i < steps; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * cols + j, b = a + cols;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const nrm = geo.attributes.normal;
  for (let i = 0; i <= steps; i++) {
    const a = i * cols, b = a + radial;
    const nx = (nrm.getX(a) + nrm.getX(b)) / 2;
    const ny = (nrm.getY(a) + nrm.getY(b)) / 2;
    const nz = (nrm.getZ(a) + nrm.getZ(b)) / 2;
    const l = Math.hypot(nx, ny, nz) || 1;
    nrm.setXYZ(a, nx / l, ny / l, nz / l);
    nrm.setXYZ(b, nx / l, ny / l, nz / l);
  }
  nrm.needsUpdate = true;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ---------- מרקמי בד פרוצדורליים ----------
// נוצרים בקנבס בזמן ריצה, בלי קבצים חיצוניים — שומר על "קובץ אחד שנפתח בדפדפן".
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}

const ribbedKnit = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  for (let x = 0; x < n; x += 6) {
    ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(x, 0, 2, n);
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(x + 3, 0, 1, n);
  }
}, 14, 1);

const denimTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  for (let k = -n; k < n * 2; k += 4) {            // אריגת טוויל אלכסונית
    ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + n, n); ctx.stroke();
  }
  for (let i = 0; i < 1600; i++) {
    ctx.fillStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.05})`;
    ctx.fillRect(Math.random() * n, Math.random() * n, 1, 1);
  }
}, 5, 5);

const bandageTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  ctx.lineWidth = 2;
  for (let k = -n; k < n * 2; k += 12) {
    ctx.strokeStyle = 'rgba(0,0,0,0.11)';
    ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + n * 0.55, n); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(k + 4, 0); ctx.lineTo(k + 4 + n * 0.55, n); ctx.stroke();
  }
}, 3, 2);

const leatherTex = (hex) => canvasTex(128, (ctx, n) => {
  ctx.fillStyle = hex; ctx.fillRect(0, 0, n, n);
  for (let i = 0; i < 2600; i++) {
    const g = Math.random() < 0.5 ? 0 : 255;
    ctx.fillStyle = `rgba(${g},${g},${g},${0.02 + Math.random() * 0.06})`;
    ctx.fillRect(Math.random() * n, Math.random() * n, 2, 2);
  }
}, 3, 3);

function garment(mat, curve, bodyProfile, opts = {}) {
  const { u0 = 0, u1 = 1, pad = 0.008, bulge = null, ...rest } = opts;
  const profileFn = (u) => {
    const b = profileAt(bodyProfile, u);
    const e = bulge ? profileAt(bulge, (u - u0) / (u1 - u0 || 1)) : { rx: 0, rz: 0 };
    return { rx: b.rx + pad + e.rx, rz: b.rz + pad + e.rz };
  };
  return sweepCurve(mat, curve, profileFn, { ...rest, uRange: [u0, u1] });
}

/**
 * מסלול שרץ *על פני* בגד, בזווית קבועה סביבו.
 * משמש לתפרים, לשרוכים וללשונית — כל דבר שצריך לשבת על המשטח ולא לרחף לידו.
 *  theta - 0 = כיוון N, π/2 = כיוון B. במסלול רגל: π/2 הוא החזית.
 */
function seamPath(curve, profile, pad, theta, u0, u1, n = 10, refDir = V(1, 0, 0)) {
  const pts = [];
  const c = Math.cos(theta), s = Math.sin(theta);
  for (let i = 0; i < n; i++) {
    const u = u0 + (u1 - u0) * (i / (n - 1));
    const p = curve.getPointAt(u);
    const T = curve.getTangentAt(u).normalize();
    const { N, B } = frameAt(T, refDir);
    const { rx, rz } = profileAt(profile, u);
    pts.push(p.clone()
      .addScaledVector(N, (rx + pad) * c)
      .addScaledVector(B, (rz + pad) * s));
  }
  return pts;
}

// ============================================================================
//  פרופורציות — הכל ביחידות רדיוס-גולגולת R, נמדד מתמונת הרפרנס.
//  שינוי R לבדו משנה את גודל הדמות כולה בלי לשבור אף יחס.
// ============================================================================

const R = 0.117;                      // גובה ראש ~0.262 → דמות של ~6.9 ראשים
const pr = (t, rx, rz) => ({ t, rx: rx * R, rz: rz * R });

// יחסי הראש נמדדו מהרפרנס: הראש *צר וגבוה*, לא כדור.
// רוחב/גובה ≈ 0.64, ועומק גדול מרוחב — כמו ראש אנושי אמיתי.
// זו הייתה הסיבה העיקרית שהדמות נראתה כמו בובה.
const HEAD_SCALE = { x: 0.78, y: 1.10, z: 0.90 };

// זרוע רזה: דלתא → דו-ראשי → מרפק צר → אמה → שורש כף יד דק
const ARM_PROFILE = [
  pr(0.00, 0.56, 0.54),

  pr(0.40, 0.36, 0.35),
  pr(0.60, 0.30, 0.32),
  pr(0.76, 0.33, 0.32),
  pr(1.00, 0.23, 0.25),
];

// רגל: ירך → ברך צרה → תפוח שוק → קרסול דק (בקוד הישן זה היה הפוך)
const LEG_PROFILE = [
  pr(0.00, 0.72, 0.69),
  pr(0.16, 0.66, 0.63),
  pr(0.44, 0.56, 0.55),
  pr(0.60, 0.46, 0.49),
  pr(0.72, 0.51, 0.54),
  pr(1.00, 0.285, 0.31),
];

// פלג גוף: אגן → מותן צר → חזה → כתפיים משופעות
const TORSO_PROFILE = [
  pr(0.00, 1.27, 0.86),
  pr(0.30, 1.08, 0.75),
  pr(0.68, 1.35, 0.90),

  pr(1.00, 0.68, 0.60),

const NECK_PROFILE = [pr(0.0, 0.38, 0.36), pr(1.0, 0.35, 0.34)];

// ---------- שלד: עמידת קרב לפי הרפרנס ----------
// הגבהים נמדדו כאחוז מגובה הדמות בתמונה. השינוי המשמעותי מהגרסה הקודמת:
// המפשעה ירדה (0.44 → 0.385 מהגובה), כלומר "רכיבה" ארוכה יותר בין החגורה
// למפשעה — בדיוק כמו ברפרנס, ובלי זה פלג הגוף נראה קצר וילדותי.
const SKEL = {
  ankleL: V(-0.252, 0.135, -0.03), ankleR: V(0.236, 0.135, 0.122),
  kneeL:  V(-0.182, 0.430, 0.022), kneeR:  V(0.174, 0.430, 0.140),
  hipL:   V(-0.098, 0.700, 0.0),   hipR:   V(0.098, 0.700, 0.012),
  pelvis: V(0, 0.655, 0),
  waist:  V(0, 0.965, 0.004),
  chest:  V(0, 1.245, 0.012),
  torsoTop: V(0, 1.355, 0.0),
  shoulderL: V(-0.130, 1.350, 0.0), shoulderR: V(0.130, 1.350, 0.0),
  elbowL: V(-0.232, 1.082, 0.095),  elbowR: V(0.242, 1.072, 0.015),
  wristL: V(-0.138, 1.262, 0.202),  wristR: V(0.158, 1.358, 0.118),
  headCenter: V(0, 1.573, 0),
};

function rng(seed) {                  // זרע קבוע → רינדורים ניתנים להשוואה
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

// ============================================================================
//  שלד עצמות + הצמדת עור (Skinning)
//
//  עד עכשיו הדמות הייתה פסל: משטח קפוא. כאן נשתלות בתוכה עצמות, וכל קודקוד
//  על פני העור מקבל שיוך לעצם הקרובה אליו. כשעצם מסתובבת — העור נמתח איתה.
//
//  שני סוגי שיוך:
//   • קשיח   — כל החלק נצמד לעצם אחת (ראש, שיער, פנים, אגרוף, כף רגל).
//              אלה חלקים שלא אמורים להתעוות בפנים, רק לזוז יחד עם האיבר.
//   • רך     — כל קודקוד משויך בנפרד לפי המקום שלו לאורך שרשרת העצמות,
//              ובאזור המפרק הוא מתחלק בין שתי עצמות → כיפוף חלק בלי שבר.
//
//  עמידת הקרב הקיימת היא *תנוחת הכריכה* (bind pose). כל סיבוב עצם באנימציה
//  הוא סטייה מהעמידה הזו, ולכן ברירת המחדל (אפס סיבוב) היא בדיוק המראה הישן.
// ============================================================================

// כיוון קדימה של כף רגל — נחוץ גם לבניית המגף וגם לקצה שרשרת הרגל
const FOOT_YAW = { L: -0.20, R: 0.17 };
const toeOf = (ankle, yaw) => V(
  ankle.x + Math.sin(yaw) * 0.160, 0.056, ankle.z + Math.cos(yaw) * 0.160);

// ---------- מפרקים: מיקום מנוחה של כל עצם ----------
const J = {
  root:  SKEL.pelvis.clone(),
  spine: SKEL.waist.clone(),
  chest: SKEL.chest.clone(),
  neck:  V(0, 1.365, 0.002),
  head:  V(0, 1.490, -0.004),
  shoulderL: SKEL.shoulderL.clone(), shoulderR: SKEL.shoulderR.clone(),
  elbowL: SKEL.elbowL.clone(),       elbowR: SKEL.elbowR.clone(),
  wristL: SKEL.wristL.clone(),       wristR: SKEL.wristR.clone(),
  hipL:   SKEL.hipL.clone(),         hipR:   SKEL.hipR.clone(),
  kneeL:  SKEL.kneeL.clone(),        kneeR:  SKEL.kneeR.clone(),
  ankleL: SKEL.ankleL.clone(),       ankleR: SKEL.ankleR.clone(),
};
// קצוות (לא עצמות — רק סוף שרשרת, כדי שלקטע האחרון יהיה אורך)
const TIP = {
  headTop: V(0, 1.640, -0.004),
  torsoTop: V(0, 1.400, 0.004),
  handL: V(-0.118, 1.300, 0.268), handR: V(0.182, 1.396, 0.184),
  toeL: toeOf(SKEL.ankleL, FOOT_YAW.L), toeR: toeOf(SKEL.ankleR, FOOT_YAW.R),
};

// ---------- עץ העצמות ----------
// הסדר חשוב: הורה תמיד לפני ילדיו.
const BONE_TREE = [
  ['root', null],
  ['spine', 'root'], ['chest', 'spine'], ['neck', 'chest'], ['head', 'neck'],
  ['shoulderL', 'chest'], ['elbowL', 'shoulderL'], ['wristL', 'elbowL'],
  ['shoulderR', 'chest'], ['elbowR', 'shoulderR'], ['wristR', 'elbowR'],
  ['hipL', 'root'], ['kneeL', 'hipL'], ['ankleL', 'kneeL'],
  ['hipR', 'root'], ['kneeR', 'hipR'], ['ankleR', 'kneeR'],
];
const BONE_NAMES = BONE_TREE.map(([n]) => n);
const BONE_INDEX = Object.fromEntries(BONE_NAMES.map((n, i) => [n, i]));

function buildBones() {
  const byName = {};
  const bones = BONE_TREE.map(([name, parent]) => {
    const b = new THREE.Bone();
    b.name = name;
    // מיקום מקומי = ההפרש מההורה. סיבוב מנוחה = אפס בכל העצמות, ולכן
    // הצירים המקומיים של כל עצם זהים לצירי הדמות — קל מאוד לאנימציה.
    const p = J[name];
    b.position.copy(parent ? p.clone().sub(J[parent]) : p);
    byName[name] = b;
    if (parent) byName[parent].add(b);
    return b;
  });
  return { bones, byName, root: bones[0] };
}

// ---------- שרשרת: קטע = [שם העצם ששולטת בו, נקודת התחלה, נקודת סוף] ----------
const CH = {
  torso: [['root', J.root, J.spine], ['spine', J.spine, J.chest], ['chest', J.chest, TIP.torsoTop]],
  neck:  [['chest', J.chest, J.neck], ['neck', J.neck, J.head], ['head', J.head, TIP.headTop]],
  armL:  [['chest', J.chest, J.shoulderL], ['shoulderL', J.shoulderL, J.elbowL],
          ['elbowL', J.elbowL, J.wristL], ['wristL', J.wristL, TIP.handL]],
  armR:  [['chest', J.chest, J.shoulderR], ['shoulderR', J.shoulderR, J.elbowR],
          ['elbowR', J.elbowR, J.wristR], ['wristR', J.wristR, TIP.handR]],
  legL:  [['root', J.root, J.hipL], ['hipL', J.hipL, J.kneeL],
          ['kneeL', J.kneeL, J.ankleL], ['ankleL', J.ankleL, TIP.toeL]],
  legR:  [['root', J.root, J.hipR], ['hipR', J.hipR, J.kneeR],
          ['kneeR', J.kneeR, J.ankleR], ['ankleR', J.ankleR, TIP.toeR]],
};

/**
 * בונה פונקציית שיוך לשרשרת: מקבלת נקודה, מחזירה עד 2 עצמות ומשקלים.
 *
 * השיטה: מוצאים את הקטע הקרוב ביותר, מחשבים כמה רחוק הקודקוד "התקדם" לאורך
 * השרשרת, ובחלון קטן סביב כל מפרק מחלקים את המשקל בין שתי העצמות השכנות.
 * זה מה שהופך את הכיפוף לחלק במקום לשבר חד.
 *  wnd - חצי-רוחב אזור הערבוב סביב המפרק (ביחידות של הדמות)
 */
function chainBinder(chain, wnd = 0.052) {
  let cum = 0;
  const segs = chain.map(([bone, a, b]) => {
    const d = b.clone().sub(a);
    const len = Math.max(d.length(), 1e-6);
    const s = { bone: BONE_INDEX[bone], a, d, len, dir: d.clone().divideScalar(len), s0: cum };
    cum += len;
    s.s1 = cum;
    return s;
  });

  const tmp = new THREE.Vector3();
  return (p) => {
    let best = 0, bestD = Infinity, bestT = 0;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      let t = tmp.copy(p).sub(s.a).dot(s.dir) / s.len;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dd = tmp.copy(s.a).addScaledVector(s.d, t).distanceToSquared(p);
      if (dd < bestD) { bestD = dd; best = i; bestT = t; }
    }
    const s = segs[best];
    const arc = s.s0 + bestT * s.len;
    const smooth = (a) => a * a * (3 - 2 * a);

    // קרוב למפרק ההתחלה → מתערבב עם העצם שלפני; קרוב לסוף → עם זו שאחרי
    if (best > 0 && arc - s.s0 < wnd) {
      const k = smooth(0.5 + 0.5 * ((arc - s.s0) / wnd));
      return [s.bone, segs[best - 1].bone, k, 1 - k];
    }
    if (best < segs.length - 1 && s.s1 - arc < wnd) {
      const k = smooth(0.5 + 0.5 * ((s.s1 - arc) / wnd));
      return [s.bone, segs[best + 1].bone, k, 1 - k];
    }
    return [s.bone, 0, 1, 0];
  };
}

// חלון הערבוב סביב המפרק. בכתף הוא רחב יותר: שם המעבר הוא מגוף עבה מאוד
// לזרוע דקה, ובחלון צר נוצר קמט חד בדלתא בכל הרמת יד.
const CHAIN_WND = { armL: 0.085, armR: 0.085 };

const BINDER_CACHE = new Map();
function binderFor(key) {
  if (!BINDER_CACHE.has(key)) BINDER_CACHE.set(key, chainBinder(CH[key], CHAIN_WND[key] ?? 0.052));
  return BINDER_CACHE.get(key);
}

/** ממיר מש רגיל למש עם עור מוצמד לעצמות. */
function toSkinned(mesh, chainKey) {
  const geo = mesh.geometry;
  const pos = geo.attributes.position;
  const n = pos.count;
  const idx = new Uint16Array(n * 4);
  const wgt = new Float32Array(n * 4);
  const bind = binderFor(chainKey);
  const p = new THREE.Vector3();

  for (let i = 0; i < n; i++) {
    p.fromBufferAttribute(pos, i);
    const [b0, b1, w0, w1] = bind(p);
    idx[i * 4] = b0; idx[i * 4 + 1] = b1;
    wgt[i * 4] = w0; wgt[i * 4 + 1] = w1;
  }
  geo.setAttribute('skinIndex', new THREE.BufferAttribute(idx, 4));
  geo.setAttribute('skinWeight', new THREE.BufferAttribute(wgt, 4));

  const sm = new THREE.SkinnedMesh(geo, mesh.material);
  sm.castShadow = true;
  sm.receiveShadow = true;
  sm.frustumCulled = false;      // התיבה התוחמת לא מתעדכנת בעיוות → אחרת נעלם
  return sm;
}

// ============================================================================

function createFighter(cfg) {
  const g = new THREE.Group();
  const rand = rng(cfg.seed ?? 12345);
  const S = SKEL;

  // כל חלק נרשם יחד עם השיוך שלו לעצמות. BIND הוא "השיוך הנוכחי" ומשתנה
  // בראש כל אזור בגוף, כדי שלא צריך לחזור עליו בכל שורה.
  //   { chain: 'legL' } → עור רך שמתעוות
  //   { bone: 'head' }  → חלק קשיח שנוסע עם עצם אחת
  const parts = [];
  let BIND = null;
  const part = (m) => { parts.push({ m, bind: BIND }); g.add(m); return m; };
  const M = (color, roughness, metalness = 0) =>
    new THREE.MeshStandardMaterial({ color, roughness, metalness });

  const skinMat  = M(cfg.skin, 0.62);
  const hairMat  = M(cfg.hair, 0.88);
  const topMat = cfg.top ? new THREE.MeshStandardMaterial({
    color: cfg.top, roughness: 0.92, map: ribbedKnit('#ffffff'),
    side: THREE.DoubleSide,          // לקצה המחשוף יש צד פנימי שנראה
  }) : null;
  const pantsMat = cfg.pants ? new THREE.MeshStandardMaterial({
    color: cfg.pants, roughness: 0.94, map: denimTex('#ffffff'),
  }) : null;
  const boxerMat = cfg.boxers ? M(cfg.boxers, 0.85) : null;
  const bootMat = cfg.boots ? new THREE.MeshStandardMaterial({
    color: cfg.boots, roughness: 0.55, map: leatherTex('#ffffff'),
  }) : null;
  const soleMat  = M(0x2f241c, 0.95);
  const laceMat  = M(0xd9c9a8, 0.85);
  const cuffMat = cfg.pants ? new THREE.MeshStandardMaterial({
    color: 0x89a2cb, roughness: 0.94, map: denimTex('#ffffff'),
  }) : null;
  const threadMat = M(0xd8b276, 0.85);
  const beltMat  = new THREE.MeshStandardMaterial({ color: 0x4a3323, roughness: 0.5, map: leatherTex('#ffffff') });
  const buckleMat = M(0xb9a06a, 0.28, 0.85);
  const wrapMat = new THREE.MeshStandardMaterial({
    color: 0xf2efe7, roughness: 0.96, map: bandageTex('#ffffff'),
  });
  const eyeWhiteMat = M(0xfcfcfc, 0.22);
  const irisMat  = M(cfg.eyeColor ?? 0x5a3a20, 0.28);
  const pupilMat = M(0x120e0a, 0.2);
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mouthMat = M(0x8a4a44, 0.6);
  const goldMat  = M(0xd9b23c, 0.2, 0.95);

  const legMat = pantsMat || skinMat;

  // ---------- פלג גוף עליון ----------
  // מסלול רציף מהאגן עד קו הכתפיים, עם כיפה רדודה שיוצרת את שיפוע הטרפז.
  // אין כדור חזה ואין כדור אגן.
  const torsoCurve = makeCurve([S.pelvis, S.waist, S.chest, S.torsoTop]);
  BIND = { chain: 'torso' };
  part(sweepCurve(skinMat, torsoCurve, TORSO_PROFILE, {
    refDir: V(1, 0, 0), steps: 38, capEnd: 'round', domeScale: 0.55,
  }));

  // ---------- רגליים ----------
  // המסלול מתחיל *בתוך* האגן → החיבור קבור ואינו נראה מבחוץ.
  const legCurves = [];
  const LEG_KEYS = ['legL', 'legR'];
  [[S.hipL, S.kneeL, S.ankleL], [S.hipR, S.kneeR, S.ankleR]].forEach(([hip, knee, ankle], li) => {
    const hipIn = V(hip.x * 0.40, hip.y + 0.055, hip.z);
    const c = makeCurve([hipIn, hip, knee, ankle]);
    legCurves.push(c);
    BIND = { chain: LEG_KEYS[li] };
    part(sweepCurve(legMat, c, LEG_PROFILE, { refDir: V(1, 0, 0), steps: 34 }));
  });

  // ---------- תחתונים ----------
  if (boxerMat && !pantsMat) {
    BIND = { chain: 'torso' };
    part(garment(boxerMat, torsoCurve, TORSO_PROFILE, { u0: 0, u1: 0.38, pad: 0.011, steps: 18 }));
    legCurves.forEach((c, li) => {
      BIND = { chain: LEG_KEYS[li] };
      part(garment(boxerMat, c, LEG_PROFILE, { u0: 0.02, u1: 0.26, pad: 0.010, steps: 12 }));
    });
  }

  // ---------- מכנסיים ----------
  // רצים על אותו מסלול של הרגל עם מרווח קבוע → הבד צמוד.
  // השול המקופל הוא תוספת מקומית לאותו משטח, לא טבעת מרחפת.
  if (pantsMat) {
    BIND = { chain: 'torso' };
    part(garment(pantsMat, torsoCurve, TORSO_PROFILE, { u0: 0, u1: 0.40, pad: 0.012, steps: 20 }));

    const CUFF_BULGE = [
      { t: 0.00, rx: 0, rz: 0 }, { t: 0.80, rx: 0, rz: 0 },
      { t: 0.90, rx: 0.011, rz: 0.011 }, { t: 1.00, rx: 0.009, rz: 0.009 },
    ];
    legCurves.forEach((c, li) => {
      BIND = { chain: LEG_KEYS[li] };
      part(garment(pantsMat, c, LEG_PROFILE, {
        u0: 0.02, u1: 0.755, pad: 0.011, bulge: CUFF_BULGE, steps: 30,
      }));
      // שול ג'ינס מקופל (יש ברפרנס) — שכבה קצרה מעל אותו מסלול
      part(garment(cuffMat, c, LEG_PROFILE, { u0: 0.665, u1: 0.775, pad: 0.021, steps: 12 }));

      // תפר חיצוני — חוט בגוון חול, יושב על פני הבד ולא לידו
      const outer = c === legCurves[0] ? Math.PI : 0;
      part(sweep(threadMat, seamPath(c, LEG_PROFILE, 0.012, outer, 0.10, 0.70, 10),
        [pr(0, 0.028, 0.028), pr(1, 0.028, 0.028)],
        { steps: 22, radial: 8, capStart: 'round', capEnd: 'round' }));
    });

    BIND = { chain: 'torso' };
    part(garment(beltMat, torsoCurve, TORSO_PROFILE, { u0: 0.335, u1: 0.390, pad: 0.015, steps: 8 }));
    const bp = torsoCurve.getPointAt(0.362);
    const bprof = profileAt(TORSO_PROFILE, 0.362);
    const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.046, 0.02), buckleMat);
    buckle.position.set(bp.x, bp.y, bp.z + bprof.rz + 0.014);
    buckle.castShadow = true;
    BIND = { bone: 'root' };
    part(buckle);
  }

  // ---------- כפות רגליים / מגפיים ----------
  // שוק המגף עדיין מתעוות עם הרגל, אבל הכף עצמה נוסעת קשיח עם עצם הקרסול.
  const ANKLE_BONES = ['ankleL', 'ankleR'];
  [[S.ankleL, legCurves[0], FOOT_YAW.L], [S.ankleR, legCurves[1], FOOT_YAW.R]]
      .forEach(([ankle, legCurve, yaw], fi) => {
    const legKey = LEG_KEYS[fi];
    const footBone = { bone: ANKLE_BONES[fi] };
    const fwd = V(Math.sin(yaw), 0, Math.cos(yaw));
    const y = 0.066;
    const heel = ankle.clone().setY(y).addScaledVector(fwd, -0.060);
    const mid  = ankle.clone().setY(y + 0.004).addScaledVector(fwd, 0.045);
    const toe  = ankle.clone().setY(y - 0.010).addScaledVector(fwd, 0.160);

    if (bootMat) {
      // שוק המגף — המשך ישיר של מסלול הרגל, לא גליל נפרד
      BIND = { chain: legKey };
      part(garment(bootMat, legCurve, LEG_PROFILE, { u0: 0.735, u1: 1.0, pad: 0.019, steps: 16 }));

      // כף המגף — מסלול אופקי, חתך רחב ושטוח, קצוות מעוגלים
      BIND = footBone;
      part(sweep(bootMat, [heel, mid, toe], [
        pr(0.00, 0.38, 0.37), pr(0.34, 0.42, 0.34), pr(0.70, 0.40, 0.30), pr(1.00, 0.31, 0.23),
      ], { steps: 24, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));

      // כיסוי בוהן — מדרגה עדינה בעור, כמו במגף עבודה
      part(sweep(bootMat,
        [mid.clone().addScaledVector(fwd, 0.012), toe.clone().addScaledVector(fwd, -0.012)],
        [pr(0.00, 0.43, 0.325), pr(1.00, 0.345, 0.255)],
        { steps: 12, refDir: V(0, 1, 0), capStart: 'flat', capEnd: 'round', domeScale: 0.7 }));

      // סוליה
      part(sweep(soleMat,
        [heel.clone().setY(y - 0.038), mid.clone().setY(y - 0.044), toe.clone().setY(y - 0.046)],
        [pr(0.00, 0.22, 0.40), pr(0.5, 0.24, 0.37), pr(1.00, 0.18, 0.28)],
        { steps: 18, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.7 }));

      // עקב
      part(sweep(soleMat,
        [heel.clone().setY(y - 0.062).addScaledVector(fwd, 0.004),
         heel.clone().setY(y - 0.062).addScaledVector(fwd, 0.062)],
        [pr(0, 0.20, 0.36), pr(1, 0.21, 0.37)],
        { steps: 6, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'flat', domeScale: 0.6 }));

      // לשונית — יושבת על חזית השוק, מתחת לשרוכים
      part(sweep(bootMat, seamPath(legCurve, LEG_PROFILE, 0.013, Math.PI / 2, 0.775, 0.995, 6),
        [pr(0, 0.20, 0.05), pr(0.5, 0.23, 0.06), pr(1, 0.21, 0.05)],
        { steps: 12, radial: 18, refDir: V(1, 0, 0) }));

      // שרוכים משוכלים בין שני טורי לולאות
      const colL = seamPath(legCurve, LEG_PROFILE, 0.024, Math.PI / 2 + 0.62, 0.785, 0.985, 4);
      const colR = seamPath(legCurve, LEG_PROFILE, 0.024, Math.PI / 2 - 0.62, 0.785, 0.985, 4);
      for (let i = 0; i < colL.length - 1; i++) {
        [[colL[i], colR[i + 1]], [colR[i], colL[i + 1]]].forEach(([a, b]) => {
          part(sweep(laceMat, [a, b], [pr(0, 0.038, 0.038), pr(1, 0.038, 0.038)],
            { steps: 4, radial: 8, capStart: 'round', capEnd: 'round', domeScale: 0.8 }));
        });
      }
    } else {
      // מתחילה גבוה ועבה מספיק כדי להיבלע בקרסול, אחרת נראית צביטה
      BIND = footBone;
      part(sweep(skinMat,
        [heel.clone().setY(y + 0.016), mid.clone().setY(y + 0.008), toe],
        [pr(0.00, 0.46, 0.32), pr(0.4, 0.42, 0.31), pr(0.75, 0.38, 0.27), pr(1.00, 0.28, 0.19)],
        { steps: 22, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round', domeScale: 0.8 }));
    }
  });

  // ---------- זרועות ----------
  // המסלול מתחיל בתוך בית החזה, והדלתא היא פשוט הקטע העבה של הזרוע.
  // אין כדור כתף בכלל — זה מה שהעיף את "הידיים הנפוחות".
  const ARM_KEYS = ['armL', 'armR'];
  const WRIST_BONES = ['wristL', 'wristR'];
  [[S.shoulderL, S.elbowL, S.wristL, -1], [S.shoulderR, S.elbowR, S.wristR, 1]]
    .forEach(([sh, el, wr, side], ai) => {
      const shIn = V(sh.x * 0.38, sh.y - 0.045, sh.z);
      const armCurve = makeCurve([shIn, sh, el, wr]);
      BIND = { chain: ARM_KEYS[ai] };
      part(sweepCurve(skinMat, armCurve, ARM_PROFILE, { refDir: V(0, 1, 0), steps: 36 }));

      const dir = armCurve.getTangentAt(1).normalize();
      const across = new THREE.Vector3().crossVectors(dir, V(0, 1, 0)).normalize();

      // תחבושת צמודה לאמה — לא עבה ממנה, כמו ברפרנס
      if (cfg.handWraps) {
        part(garment(wrapMat, armCurve, ARM_PROFILE, { u0: 0.76, u1: 1.0, pad: 0.006, steps: 14 }));
      }

      // ---------- אגרוף ----------
      // לא כדור: רחב מעומקו, מתנפח בפרקי האצבעות ומתעגל בקצה.
      // האגרוף על כל פרטיו נוסע קשיח עם עצם שורש כף היד.
      const fistMat = cfg.handWraps ? wrapMat : skinMat;
      BIND = { bone: WRIST_BONES[ai] };
      part(sweep(fistMat,
        [wr.clone().addScaledVector(dir, -0.010),
         wr.clone().addScaledVector(dir, 0.030),
         wr.clone().addScaledVector(dir, 0.068)],
        [pr(0.00, 0.30, 0.28), pr(0.5, 0.44, 0.40), pr(1.00, 0.41, 0.37)],
        { steps: 16, refDir: across, capEnd: 'round', domeScale: 0.8 }));

      // פרקי אצבעות — ארבע בליטות קטנות בחזית האגרוף
      const up2 = new THREE.Vector3().crossVectors(across, dir).normalize();
      [-1.5, -0.5, 0.5, 1.5].forEach((k) => {
        const kn = new THREE.Mesh(new THREE.SphereGeometry(R * 0.075, 12, 10), fistMat);
        kn.position.copy(wr.clone()
          .addScaledVector(dir, 0.052)
          .addScaledVector(across, k * 0.0175)
          .addScaledVector(up2, 0.014));
        kn.scale.set(1, 0.85, 0.8);
        kn.castShadow = true;
        part(kn);
      });

      // אגודל מקופל על צד האגרוף
      part(sweep(fistMat,
        [wr.clone().addScaledVector(dir, 0.004).addScaledVector(across, side * 0.036),
         wr.clone().addScaledVector(dir, 0.048).addScaledVector(across, side * 0.022)],
        [pr(0, 0.16, 0.16), pr(1, 0.13, 0.13)],
        { steps: 8, radial: 20, capEnd: 'round' }));

      if (cfg.fingerRing && side === 1) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.036, 0.008, 8, 20), goldMat);
        ring.position.copy(wr.clone().addScaledVector(dir, 0.036));
        ring.quaternion.setFromUnitVectors(V(0, 0, 1), dir);
        ring.castShadow = true;
        part(ring);
      }
    });

  // ---------- גופייה ----------
  // אותו מסלול של פלג הגוף + מרווח → צמודה, והשוליים עוקבים אחרי קו הגוף.
  // ה-pad קטן מזה של המכנסיים, ולכן היא נכנסת *לתוך* המכנסיים.
  if (topMat) {
    // המסגרת של פלג הגוף היא N=+X, ולכן: θ=0 ימין, θ=π/2 גב, θ=π שמאל, θ=3π/2 חזית.
    // הקצה גבוה בכתפיים (שם נוצרות הכתפיות) ונמוך בחזית ובגב (המחשוף).
    // הזרוע יוצאת מבית החזה מתחת לקצה הגבוה — וזה מייצר את פתח השרוול.
    const edgeU = (th) => 0.880 + 0.112 * Math.pow(Math.abs(Math.cos(th)), 2.1);
    const shirtProfile = (u) => {
      const b = profileAt(TORSO_PROFILE, u);
      return { rx: b.rx + 0.008, rz: b.rz + 0.008 };
    };
    BIND = { chain: 'torso' };
    part(sweepShapedEdge(topMat, torsoCurve, shirtProfile,
      { u0: 0.28, edgeU, radial: 44, steps: 30, refDir: V(1, 0, 0) }));
  }

  // ---------- צוואר ----------
  // קבור משני צדדיו (בחזה ובראש) → אין תפר נראה, ואין כדור מפרק.
  BIND = { chain: 'neck' };
  part(sweep(skinMat, [V(0, 1.285, 0.006), V(0, 1.38, 0.0), V(0, 1.495, -0.006)],
    NECK_PROFILE, { steps: 12, radial: 26 }));

  // ---------- ראש ----------
  // מכאן ועד סוף הפונקציה: ראש, פנים, אוזניים ושיער — הכול קשיח על עצם הראש.
  // אלה חלקים שלא אמורים להתעוות מבפנים, רק לפנות יחד עם הראש.
  BIND = { bone: 'head' };
  const HC = S.headCenter;
  const head = new THREE.Mesh(new THREE.SphereGeometry(R, 44, 34), skinMat);
  head.position.copy(HC);
  head.scale.set(HEAD_SCALE.x, HEAD_SCALE.y, HEAD_SCALE.z);
  head.castShadow = true;
  head.receiveShadow = true;
  part(head);

  // לסת וסנטר — מרככים את "הכדור המושלם" לצורת פנים
  // נשאר *בתוך* אליפסואיד הראש בכל הכיוונים חוץ מלמטה, ולכן הוא מוסיף סנטר
  // בלי ליצור טבעת תפר נראית סביב הפנים.
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(R * 0.78, 34, 26), skinMat);
  jaw.position.set(0, HC.y - R * 0.55, R * 0.05);
  jaw.scale.set(0.68, 0.88, 0.78);
  jaw.castShadow = true;
  part(jaw);

  // ---------- אוזניים ----------
  [-1, 1].forEach((s) => {
    if (cfg.ears === 'pointed') {
      part(sweep(skinMat,
        [V(s * R * 0.70, HC.y + R * 0.02, -R * 0.04),
         V(s * R * 1.00, HC.y + R * 0.62, -R * 0.26),
         V(s * R * 1.22, HC.y + R * 1.22, -R * 0.48)],
        [pr(0, 0.28, 0.16), pr(0.55, 0.20, 0.10), pr(1, 0.04, 0.025)],
        { steps: 14, radial: 20, refDir: V(0, 0, 1), capEnd: 'round', domeScale: 0.6 }));
    } else {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(R * 0.26, 18, 16), skinMat);
      ear.position.set(s * R * 0.72, HC.y - R * 0.06, -R * 0.06);
      ear.scale.set(0.40, 1.15, 0.75);
      ear.castShadow = true;
      part(ear);
    }
  });

  // ---------- פנים ----------
  // עיניים קטנות ומבטאות כמו ברפרנס — לא עיניים ענקיות בסגנון אנימה
  [-1, 1].forEach((s) => {
    const ex = s * R * 0.40, ey = HC.y + R * 0.10, ez = R * 0.80;
    // (ez נבחר כך שחזית הלובן תעבור את פני הפנים בכ-0.001 בלבד)

    // פני הראש בגובה העין נמצאים ב-z=0.876R. כל שכבה כאן בולטת רק במעט מעל
    // קודמתה, אחרת גלגל העין יוצא ככדור מודבק על הפנים במקום עין שקועה בארובה.
    const white = new THREE.Mesh(new THREE.SphereGeometry(R * 0.21, 24, 22), eyeWhiteMat);
    white.position.set(ex, ey, ez);
    white.scale.set(1, 0.70, 0.42);
    part(white);

    // הקשתית תופסת ~45% מרוחב העין, ולכן הלובן נראה משני צדדיה.
    const iris = new THREE.Mesh(new THREE.SphereGeometry(R * 0.095, 20, 18), irisMat);
    iris.position.set(ex + s * R * 0.012, ey - R * 0.008, ez + R * 0.055);
    iris.scale.set(1, 1, 0.45);
    part(iris);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(R * 0.042, 16, 14), pupilMat);
    pupil.position.set(ex + s * R * 0.012, ey - R * 0.008, ez + R * 0.088);
    pupil.scale.set(1, 1, 0.45);
    part(pupil);

    const glint = new THREE.Mesh(new THREE.SphereGeometry(R * 0.028, 10, 10), glintMat);
    glint.position.set(ex + s * R * 0.058, ey + R * 0.062, ez + R * 0.105);
    part(glint);

    // עפעף עליון — כיפה בצבע עור שמכסה את החלק העליון של גלגל העין.
    // בלי זה העין נשארת עיגול שלם והמבט יוצא פעור וקפוא.
    const lid = new THREE.Mesh(
      new THREE.SphereGeometry(R * 0.222, 24, 18, 0, Math.PI * 2, 0, 0.85), skinMat);
    lid.position.set(ex, ey + R * 0.012, ez);
    lid.scale.set(1, 0.70, 0.44);
    lid.castShadow = true;
    part(lid);

    // גבה עבה ומעוקלת (בולטת ברפרנס) — רצועה, לא קופסה
    part(sweep(hairMat,
      [V(ex - s * R * 0.30, HC.y + R * 0.235, R * 0.780),
       V(ex,                HC.y + R * 0.290, R * 0.856),
       V(ex + s * R * 0.30, HC.y + R * 0.245, R * 0.780)],
      [pr(0, 0.04, 0.032), pr(0.5, 0.078, 0.055), pr(1, 0.04, 0.032)],
      { steps: 10, radial: 14, refDir: V(0, 1, 0), capStart: 'round', capEnd: 'round' }));
  });

  // אף = גשר שיוצא מבין הגבות ויורד אל קצה מעוגל, ואז חוזר לתוך הפנים.
  // הגשר קבור בתוך הראש, ולכן אין תפר — רק הקצה בולט החוצה.
  part(sweep(skinMat, [
    V(0, HC.y + R * 0.20, R * 0.72),
    V(0, HC.y + R * 0.00, R * 0.80),
    V(0, HC.y - R * 0.15, R * 0.875),
    V(0, HC.y - R * 0.27, R * 0.775),
  ], [
    pr(0.00, 0.040, 0.040), pr(0.42, 0.082, 0.078),
    pr(0.76, 0.112, 0.106), pr(1.00, 0.078, 0.074),
  ], { steps: 18, radial: 22, refDir: V(1, 0, 0), capStart: 'round', domeScale: 0.7 }));

  const smile = new THREE.Mesh(
    new THREE.TorusGeometry(R * 0.215, R * 0.034, 10, 26, Math.PI * 0.78), mouthMat);
  smile.position.set(0, HC.y - R * 0.48, R * 0.775);
  smile.rotation.z = Math.PI * 1.10;
  part(smile);

  if (cfg.noseRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R * 0.15, R * 0.038, 10, 20), goldMat);
    ring.position.set(0, HC.y - R * 0.31, R * 0.845);
    ring.castShadow = true;
    part(ring);
  }

  // ---------- שיער ----------
  // ברפרנס נפח השיער גדול ומקיף — הוא מה שנותן את הצללית, לא ראש גדול.
  // הכיפה מוטה לאחור: קו השיער בחזית עולה מעל המצח, ובעורף הוא יורד נמוך.
  // בלי ההטיה נוצר "קסדה" עם פס כהה חוצה שמסתיר את העיניים.
  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.02, 34, 26, 0, Math.PI * 2, 0, Math.PI * 0.54), hairMat);
  cap.position.copy(HC);
  cap.position.y += R * 0.06;
  cap.position.z -= R * 0.21;
  cap.rotation.x = -0.44;
  // מסת השיער רחבה מהגולגולת עצמה — ברפרנס היא מה שנותן לראש את הנוכחות.
  cap.scale.set(HEAD_SCALE.x * 1.04, HEAD_SCALE.y * 1.02, HEAD_SCALE.z * 1.04);
  cap.castShadow = true;
  part(cap);

  const hx = R * HEAD_SCALE.x * 1.24, hy = R * HEAD_SCALE.y * 1.06, hz = R * HEAD_SCALE.z * 1.14;
  const RINGS = [
    { phi: 0.18, count: 7 }, { phi: 0.42, count: 12 }, { phi: 0.66, count: 16 },
    { phi: 0.90, count: 19 }, { phi: 1.14, count: 21 }, { phi: 1.38, count: 21 },
    { phi: 1.60, count: 18 },
  ];
  RINGS.forEach(({ phi, count }) => {
    for (let i = 0; i < count; i++) {
      const theta = (i / count) * Math.PI * 2 + phi * 1.7;
      const lx = Math.sin(phi) * Math.cos(theta) * hx;
      const ly = Math.cos(phi) * hy;
      const lz = Math.sin(phi) * Math.sin(theta) * hz;
      // קו השיער: בחזית הוא נעצר גבוה (מעל הגבות), בצדדים ובעורף הוא יורד
      if (lz > R * 0.15 && ly < R * 0.82 - lz * 0.20) continue;

      const jit = () => (rand() - 0.5) * R * 0.18;
      const px = HC.x + lx * 1.16 + jit();
      const py = HC.y + ly * 1.14 + jit() + R * 0.06;
      const pz = lz * 1.16 + jit() - R * 0.04;

      if (cfg.hairStyle === 'spiky') {
        const d = V(lx, ly, lz).normalize();
        part(sweep(hairMat,
          [V(px, py, pz),
           V(px + d.x * R * 0.34, py + d.y * R * 0.34, pz + d.z * R * 0.34),
           V(px + d.x * R * 0.76, py + d.y * R * 0.76, pz + d.z * R * 0.76)],
          [pr(0, 0.25, 0.25), pr(0.55, 0.14, 0.14), pr(1, 0.02, 0.02)],
          { steps: 8, radial: 12, capEnd: 'round', domeScale: 0.5 }));
      } else {
        // תלתל = קשת קצרה שמתעגלת סביב הגולגולת, לא כדור.
        // אשכול כדורים אחידים נראה כמו פאה; קשתות בגדלים ובכיוונים משתנים
        // נותנות את מסת התלתלים הרופפת שברפרנס.
        const d = V(lx, ly, lz).normalize();
        let tang = new THREE.Vector3().crossVectors(d, V(0, 1, 0));
        if (tang.lengthSq() < 0.05) tang.set(1, 0, 0);
        tang.normalize();
        const bend = (rand() - 0.5) * 2;
        const len = R * (0.30 + rand() * 0.18);
        const thick = 0.135 + rand() * 0.065;

        part(sweep(hairMat, [
          V(px, py, pz),
          V(px + d.x * len * 0.55 + tang.x * len * 0.5 * bend,
            py + d.y * len * 0.55 + tang.y * len * 0.5 * bend + len * 0.12,
            pz + d.z * len * 0.55 + tang.z * len * 0.5 * bend),
          V(px + d.x * len * 0.55 + tang.x * len * 1.15 * bend,
            py + d.y * len * 0.30 + tang.y * len * 1.15 * bend - len * 0.20,
            pz + d.z * len * 0.55 + tang.z * len * 1.15 * bend),
        ], [
          pr(0, thick * 0.85, thick * 0.85), pr(0.45, thick, thick), pr(1, thick * 0.62, thick * 0.62),
        ], { steps: 10, radial: 14, capStart: 'round', capEnd: 'round', domeScale: 0.9 }));
      }
    }
  });

  return { group: g, parts };
}

// ============================================================================
//  הרכבת לוחם: דמות + שלד + הצמדת עור
// ============================================================================

const STANCE_YAW = 1.05;      // 3/4 - פונה ליריב אבל הפנים נראות למצלמה
const GROUND_Y = RING_TOP + 0.04;

function makeFighter(cfg, startX, facing, maxHp) {
  const { group, parts } = createFighter(cfg);
  const { bones, byName, root } = buildBones();
  group.add(root);
  group.position.set(startX, GROUND_Y, 0);
  group.rotation.y = facing * STANCE_YAW;
  scene.add(group);

  // חובה לפני החישוב: מטריצות העולם של העצמות ושל החלקים חייבות להיות עדכניות,
  // אחרת ההיפוכים של תנוחת הכריכה יוצאים שגויים והדמות מתפוצצת בפריים הראשון.
  scene.updateMatrixWorld(true);
  const skeleton = new THREE.Skeleton(bones);

  parts.forEach(({ m, bind }) => {
    if (bind.bone) {
      byName[bind.bone].attach(m);          // attach שומר על המיקום בעולם
    } else {
      const sm = toSkinned(m, bind.chain);
      group.remove(m);
      group.add(sm);
      sm.updateMatrixWorld(true);
      sm.bind(skeleton, sm.matrixWorld.clone());
    }
  });

  const near = facing > 0 ? 'L' : 'R';   // הצד שקרוב למצלמה — שם המכות נראות הכי טוב
  return {
    group, byName, skeleton,
    x: startX, facing, near,
    mv: 0, phase: 0, bob: 0,
    // side מתחיל בצד הרחוק, כדי שהאגרוף *הראשון* יהיה של היד הקרובה למצלמה
    action: null, actionT: 0, side: facing > 0 ? 'R' : 'L', hitDone: false,
    blocking: false, blockAmt: 0,
    cool: 0, think: 0, mode: 'wait', blockTimer: 0,
    hp: maxHp, maxHp, stoneMesh: null, forceWeaponVisible: false,
  };
}

/**
 * אבן חדה — הנשק הבסיסי של סווארק מהאפיון. נבנית פעם אחת ותלויה קשיח על עצם
 * שורש כף היד הקרובה למצלמה, מוסתרת כברירת מחדל ומופיעה רק בזמן מכת האבן
 * (`poseFighter` מדליק/מכבה `visible` לפי `f.action`).
 *
 * המיקום מחושב מהשלד: כיוון "מהמרפק לשורש כף היד" בתנוחת המנוחה, אותו כיוון
 * שבו האגרוף עצמו בנוי (ראה `createFighter`). לא ניחוש - נגזר מהקואורדינטות.
 */
function addStoneProp(f) {
  const wristKey = 'wrist' + f.near, elbowKey = 'elbow' + f.near;
  const dir = J[wristKey].clone().sub(J[elbowKey]).normalize();

  const stone = new THREE.Mesh(
    new THREE.ConeGeometry(0.058, 0.21, 6),
    new THREE.MeshStandardMaterial({ color: 0xb3a892, roughness: 0.8, flatShading: true })
  );
  stone.quaternion.setFromUnitVectors(V(0, 1, 0), dir);
  stone.position.copy(dir.clone().multiplyScalar(0.155));
  stone.visible = false;
  stone.castShadow = true;
  f.byName[wristKey].add(stone);
  f.stoneMesh = stone;
}

// ---------- שני הלוחמים ----------

// סווארק - גופייה לבנה, ג'ינס עם חגורה, מגפי עור, תלתלים חומים, תחבושות על האגרופים
const player = makeFighter({
  skin: 0xf3c9a0,
  hair: 0x3a2718,
  hairStyle: 'curly',
  eyeColor: 0x6b4423,
  ears: 'round',
  top: 0xf7f6f3,      // גופייה לבנה
  pants: 0x6f8dc4,    // ג'ינס
  boots: 0x7a4b2a,    // מגפי עור חומים
  handWraps: true,
}, -1.7, 1, 100);

// בו - איש כחול, אוזניים חדות, שיער ירוק, עגיל באף וטבעת באצבע, רק בוקסר שחור
const enemy = makeFighter({
  skin: 0x4a93d4,
  hair: 0x33c04a,
  hairStyle: 'spiky',
  eyeColor: 0xc8a02a,
  ears: 'pointed',
  top: null,          // בלי חולצה
  pants: null,        // בלי מכנסיים
  boxers: 0x16181c,   // בוקסר שחור
  boots: null,        // יחף
  noseRing: true,
  fingerRing: true,
}, 1.7, -1, 75);

addStoneProp(player);
addStoneProp(enemy);

// ============================================================================
//  תנוחות ואנימציה
//
//  כל התנועה היא *סטייה מעמידת הקרב*: אפס בכל הצירים = בדיוק העמידה הקפואה
//  שהייתה קודם. לכן אי אפשר "לאבד" את התנוחה הבסיסית.
//
//  כיווני הסיבוב בצירי הדמות (כולם זהים בכל העצמות, כי סיבוב המנוחה הוא אפס):
//   rotation.x שלילי → איבר נע קדימה (לכיוון היריב)
//   rotation.x חיובי → איבר נע אחורה / ברך מתכופפת
//   rotation.y חיובי → כתף שמאל מגיחה קדימה (פיתול הגוף במכה)
// ============================================================================

// כל מכה מוגדרת פעם אחת במקום אחד: משך, רגע השיא (לצורת התנועה), חלון הפגיעה
// (u0/u1 - החלק מתוך המשך שבו המכה בפועל "נוגעת"), נזק וטווח. גם poseFighter
// וגם מערכת הפגיעה קוראים מכאן, כדי שלא יהיו שני מספרים סותרים בשני מקומות.
// hitAt הוא סף, לא טווח: ברגע שהמכה עברה אותו, הפגיעה נבדקת בפריים הראשון
// שבו u עבר אותו. לא "בין X ל-Y", כי בקצב פריימים משתנה (מחשב איטי, לשונית
// ברקע) פריים בודד יכול "לדלג" מעל חלון צר לגמרי ולפספס אותו. hitDone כבר
// מבטיח שהפגיעה תיספר פעם אחת בלבד, אז אין צורך בגבול עליון בשביל זה.
const ATTACKS = {
  punch: { dur: 0.40, peak: 0.34, hitAt: 0.28, dmg: 3, range: 1.35 },
  kick:  { dur: 0.58, peak: 0.42, hitAt: 0.36, dmg: 5, range: 1.35 },
  stone: { dur: 0.50, peak: 0.40, hitAt: 0.34, dmg: 7, range: 1.55 },
};

const smoothstep = (a) => a * a * (3 - 2 * a);

/** עקומת מכה: יציאה מהירה, חזרה מעט איטית יותר. 0 → 1 → 0 */
function strike(u, peak) {
  const a = u < peak ? u / peak : 1 - (u - peak) / (1 - peak);
  return smoothstep(Math.max(0, Math.min(1, a)));
}

function startAction(f, kind) {
  if (f.action) return;
  f.action = kind;
  f.actionT = 0;
  f.hitDone = false;
  // אגרוף מתחלף בין הידיים; בעיטה ומכת האבן תמיד בצד שקרוב למצלמה
  f.side = kind === 'punch' ? (f.side === f.near ? (f.near === 'L' ? 'R' : 'L') : f.near) : f.near;
}

function poseFighter(f, t, dt) {
  const P = {};
  const rot = (n, x, y, z) => {
    const a = P[n] || (P[n] = [0, 0, 0]);
    a[0] += x; a[1] += y; a[2] += z;
  };
  let bob = 0;

  // ---------- נשימה ותנועת שמירה ----------
  // בלי זה הדמות נראית מתה כשלא לוחצים כלום.
  const br = Math.sin(t * 2.0 + f.facing);
  rot('spine', 0.016 * br, 0, 0);
  rot('chest', 0.030 * br, 0, 0);
  rot('shoulderL', 0.045 * br, 0, 0.028 * br);
  rot('shoulderR', 0.045 * br, 0, -0.028 * br);
  rot('elbowL', 0.05 * br, 0, 0);
  rot('elbowR', 0.05 * br, 0, 0);
  rot('head', -0.018 * br, 0, 0.012 * Math.sin(t * 1.3));
  bob += 0.006 * br;

  // ---------- הליכה ----------
  if (f.mv !== 0 && !f.action) {
    const s = Math.sin(f.phase);
    const c = Math.cos(f.phase);
    rot('hipL', -0.40 * s, 0, 0);
    rot('hipR', 0.40 * s, 0, 0);
    rot('kneeL', 0.42 * Math.max(0, s), 0, 0);
    rot('kneeR', 0.42 * Math.max(0, -s), 0, 0);
    rot('ankleL', -0.18 * Math.max(0, s), 0, 0);
    rot('ankleR', -0.18 * Math.max(0, -s), 0, 0);
    // הכתפיים מתנדנדות הפוך לרגליים — זה מה שהופך צעידה לטבעית
    rot('shoulderL', 0.13 * s, 0, 0);
    rot('shoulderR', -0.13 * s, 0, 0);
    rot('spine', 0, -0.06 * s, 0);
    bob -= 0.020 * Math.abs(c);
  }

  // ---------- חסימה: איקס עם הידיים ----------
  // הזוויות נמצאו בניסוי (רונדרו כמה אפשרויות וצולמו ישר מהחזית, לא נוחשו
  // "בעיניים עצומות"): כל כתף מסתובבת חזק גם קדימה-מעלה (x שלילי) וגם לצד
  // הנגדי של הגוף (z), עד שהאמות חוצות זו את זו ונפגשות גבוה ליד הסנטר.
  // סימני ה-z הפוכים בין שמאל לימין, ולכן הן חוצות ולא רק נפגשות באמצע.
  const k = f.blockAmt;
  if (k > 0.001) {
    rot('shoulderL', -1.50 * k, 0, 1.90 * k);
    rot('shoulderR', -1.50 * k, 0, -1.90 * k);
    rot('elbowL', 2.05 * k, 0, 0);
    rot('elbowR', 2.05 * k, 0, 0);
    rot('spine', -0.10 * k, 0, 0);
    rot('neck', 0.15 * k, 0, 0);
    rot('kneeL', 0.15 * k, 0, 0);
    rot('kneeR', 0.15 * k, 0, 0);
    bob -= 0.035 * k;
  }

  // ---------- מכות ----------
  if (f.action === 'punch') {
    const a = strike(f.actionT / ATTACKS.punch.dur, ATTACKS.punch.peak);
    const S = f.side === 'L' ? 1 : -1;      // לאיזה צד הגוף מתפתל
    const sh = 'shoulder' + f.side, el = 'elbow' + f.side;
    const oSh = 'shoulder' + (f.side === 'L' ? 'R' : 'L');

    // הזוויות לא נוחשו: הן נפתרו. במנוחה האמה מצביעה (0.094,0.180,0.107),
    // וסיבוב של +1.0 סביב X מיישר אותה קדימה — לכן שני המספרים כאן תמיד
    // מסתכמים ב-1.0, וזה מה ששומר על אגרוף *ישר* ולא אלכסוני.
    // הזרוע העליונה נשארת בכוונה נמוכה: הרמה מלאה לאופק קורעת את כתפיית
    // הגופייה, כי הבד מוצמד לגוף והזרוע עוברת דרכו.
    rot(sh, -0.75 * a, 0, -0.10 * a * S);
    rot(el, 1.75 * a, 0, 0);                // האמה נפתחת קדימה — זה עיקר המכה
    rot(oSh, 0.16 * a, 0, 0);               // היד השנייה נמשכת אחורה לאיזון
    rot('chest', 0, 0.30 * a * S, 0);
    rot('spine', 0, 0.15 * a * S, 0);
    rot('root', 0, 0.08 * a * S, 0);
    rot('head', 0, 0.09 * a * S, 0);
    rot('knee' + (f.side === 'L' ? 'R' : 'L'), 0.10 * a, 0, 0);
  }

  if (f.action === 'kick') {
    const u = f.actionT / ATTACKS.kick.dur;
    const a = strike(u, ATTACKS.kick.peak);
    const hip = 'hip' + f.side, knee = 'knee' + f.side;
    const oHip = 'hip' + (f.side === 'L' ? 'R' : 'L');
    const oKnee = 'knee' + (f.side === 'L' ? 'R' : 'L');

    // הברך מתכופפת בהרמה ואז נפתחת בשיא — ככה בעיטה נראית כמו שוט ולא כמו מוט
    // -1.45 מרים את הירך עד שכף הרגל מגיעה לגובה האגן (y≈0.60, z≈0.56).
    // פחות מזה והבעיטה נראית כמו צעד גדול, לא כמו בעיטה.
    rot(hip, -1.45 * a, 0, 0);
    rot(knee, 0.95 * strike(u, 0.16) * (1 - a), 0, 0);
    rot('ankle' + f.side, -0.25 * a, 0, 0);
    rot(oHip, 0.14 * a, 0, 0);              // רגל התמיכה נשענת אחורה
    rot(oKnee, 0.22 * a, 0, 0);
    rot('spine', -0.26 * a, 0, 0);          // הגוף נשען אחורה כנגד המשקל
    rot('chest', -0.12 * a, 0, 0);
    rot('shoulderL', -0.20 * a, 0, 0);
    rot('shoulderR', -0.20 * a, 0, 0);
    bob -= 0.030 * a;
  }

  // ---------- מכת האבן החדה ----------
  // מכה גדולה מהאגרוף: הכתף נפתחת רחוק יותר קדימה, מתפתלת יותר חזק, והגוף
  // רוכן קדימה איתה (spine/chest חיוביים - הפוך מהבעיטה, ששם הגוף נשען
  // אחורה). זה מה שהופך את זה מ"אגרוף גדול" למכת ריסוק עם משקל.
  if (f.action === 'stone') {
    const a = strike(f.actionT / ATTACKS.stone.dur, ATTACKS.stone.peak);
    const S = f.side === 'L' ? 1 : -1;
    const sh = 'shoulder' + f.side, el = 'elbow' + f.side;
    const oSh = 'shoulder' + (f.side === 'L' ? 'R' : 'L');

    rot(sh, -1.30 * a, 0, -0.22 * a * S);
    rot(el, 1.55 * a, 0, 0);
    rot(oSh, 0.20 * a, 0, 0.18 * a * S);
    rot('chest', 0.16 * a, 0.34 * a * S, 0);
    rot('spine', 0.10 * a, 0.18 * a * S, 0);
    rot('root', 0, 0.10 * a * S, 0);
    rot('head', 0.08 * a, 0.10 * a * S, 0);
    rot('knee' + (f.side === 'L' ? 'R' : 'L'), 0.14 * a, 0, 0);
    bob -= 0.02 * a;
  }
  if (f.stoneMesh) f.stoneMesh.visible = f.action === 'stone' || f.forceWeaponVisible;

  // ---------- החלה עם החלקה ----------
  // בלי ההחלקה כל מעבר מצב היה קופץ בפריים אחד. עם החלקה חזקה זה עדיין חד,
  // אבל בלי קפיצות.
  const K = 1 - Math.exp(-dt * 24);
  const Z = [0, 0, 0];
  for (const n of BONE_NAMES) {
    const b = f.byName[n];
    const tg = P[n] || Z;
    b.rotation.x += (tg[0] - b.rotation.x) * K;
    b.rotation.y += (tg[1] - b.rotation.y) * K;
    b.rotation.z += (tg[2] - b.rotation.z) * K;
  }
  f.bob += (bob - f.bob) * K;
  f.byName.root.position.y = J.root.y + f.bob;
}

//  שליטה ותנועה בזירה

const KEYS = {};
const WATCHED = ['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyS', 'KeyD', 'KeyW', 'Space'];
addEventListener('keydown', (e) => {
  KEYS[e.code] = true;
  if (WATCHED.includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });

const WALK_SPEED = 1.95;
const BLOCK_SPEED = 0.75;
const MIN_GAP = 0.95;                 // כמה קרוב מותר להתקרב — בלי לעבור דרך היריב
const EDGE = RING_HALF - 0.75;

function moveFighter(f, other, dt) {
  const speed = f.blocking ? BLOCK_SPEED : WALK_SPEED;
  let nx = f.x + f.mv * speed * dt;
  nx = Math.max(-EDGE, Math.min(EDGE, nx));
  // חוסם מעבר דרך היריב: כל אחד נשאר בצד שלו
  nx = f.facing > 0 ? Math.min(nx, other.x - MIN_GAP) : Math.max(nx, other.x + MIN_GAP);

  if (Math.abs(nx - f.x) < 1e-5) f.mv = 0;   // נלחץ בקיר → לא לצעוד במקום
  f.x = nx;
  f.group.position.x = nx;
  // הפאזה מתקדמת לפי כיוון ההליכה, כך שצעידה אחורה נראית אחורה
  if (f.mv !== 0) f.phase += dt * 8.5 * (f.mv * f.facing > 0 ? 1 : -1);
}

function updatePlayer(f, dt) {
  f.blocking = !!KEYS.KeyD && !f.action;
  if (!f.action && !f.blocking) {
    if (KEYS.KeyA) startAction(f, 'punch');
    else if (KEYS.KeyS) startAction(f, 'kick');
    else if (KEYS.KeyW) startAction(f, 'stone');
  }
  f.mv = f.action ? 0 : ((KEYS.ArrowRight ? 1 : 0) - (KEYS.ArrowLeft ? 1 : 0));
}

// ---------- בו: המחשב משחק ----------
// רמת קושי התחלתית: קלה בכוונה. ההפוגות ארוכות והוא לא רודף בלי הפסקה.
function updateEnemy(f, p, dt) {
  const dist = Math.abs(p.x - f.x);
  f.cool -= dt;
  f.think -= dt;
  f.blockTimer -= dt;

  if (f.action) { f.mv = 0; f.blocking = false; return; }

  // מגיב למכה של השחקן: לפעמים מרים ידיים
  if (p.action && dist < 2.0 && f.blockTimer < -0.2 && Math.random() < 0.05) f.blockTimer = 0.55;
  f.blocking = f.blockTimer > 0;
  if (f.blocking) { f.mv = 0; return; }

  if (dist < 1.55 && f.cool <= 0) {
    const r = Math.random();
    startAction(f, r < 0.48 ? 'punch' : r < 0.80 ? 'kick' : 'stone');
    f.cool = 1.0 + Math.random() * 1.2;
    f.mv = 0;
    return;
  }

  if (f.think <= 0) {
    f.think = 0.5 + Math.random() * 0.9;
    const r = Math.random();
    f.mode = dist > 2.3 ? 'approach'
           : dist < 1.25 ? 'retreat'
           : r < 0.45 ? 'approach' : r < 0.75 ? 'retreat' : 'wait';
  }
  const toward = Math.sign(p.x - f.x);
  f.mv = f.mode === 'approach' ? toward : f.mode === 'retreat' ? -toward : 0;
}

function tickAction(f, dt) {
  if (!f.action) return;
  f.actionT += dt;
  if (f.actionT >= ATTACKS[f.action].dur) { f.action = null; f.actionT = 0; }
}

const hpFillEl = { player: document.getElementById('hpFillPlayer'), enemy: document.getElementById('hpFillEnemy') };

const gameOverTitleEl = document.getElementById('gameOverTitle');
const playAgainBtn = document.getElementById('playAgainBtn');

function updateHealthUI(f, who) {
  const pct = Math.max(0, f.hp / f.maxHp) * 100;
  hpFillEl[who].style.width = pct + '%';
  hpNumEl[who].textContent = f.hp + ' / ' + f.maxHp;
}

function flashHit() {
  hitFlashEl.classList.remove('show');
  void hitFlashEl.offsetWidth;          // מכריח את הדפדפן "לשכוח" את האנימציה הקודמת כדי שתתחיל שוב
  hitFlashEl.classList.add('show');
}

let gameOver = false;

/**
 * בודקת אם למכה הנוכחית של attacker יש "מגע" בפריים הזה: בתוך חלון הפגיעה
 * של האנימציה, בטווח מהיריב, ועוד לא הופעלה באותה מכה (hitDone). חסימה
 * מבטלת את הנזק לגמרי - זו הבחירה הפשוטה והברורה ביותר לילד: "אם חוסמים,
 * לא נפגעים".
 */
function tickCombat(attacker, defender, who, otherWho) {
  if (!attacker.action || attacker.hitDone) return;
  const cfg = ATTACKS[attacker.action];
  const u = attacker.actionT / cfg.dur;
  if (u < cfg.hitAt) return;
  if (Math.abs(attacker.x - defender.x) > cfg.range) return;

  attacker.hitDone = true;
  if (defender.blocking) return;

  defender.hp = Math.max(0, defender.hp - cfg.dmg);
  updateHealthUI(defender, otherWho);
  flashHit();
  if (defender.hp <= 0) endGame(who);
}

function endGame(winnerWho) {
  gameOver = true;
  gameOverTitleEl.textContent = winnerWho === 'player' ? '🏆 ניצחון!' : '❌ הפסד';
  gameOverEl.classList.add('show');
}

function resetGame() {
  [[player, 'player', -1.7, 1], [enemy, 'enemy', 1.7, -1]].forEach(([f, who, x0]) => {
    f.hp = f.maxHp;
    f.x = x0;
    f.group.position.x = x0;
    f.action = null; f.actionT = 0; f.hitDone = false;
    f.blocking = false; f.blockAmt = 0;
    f.mv = 0; f.cool = 0; f.think = 0; f.mode = 'wait'; f.blockTimer = 0;
    updateHealthUI(f, who);
  });
  gameOverEl.classList.remove('show');
  gameOver = false;
}

function showScreen(name) {
  uiScreen = name;
  lobbyEl.classList.toggle('show', name === 'lobby');
  shopEl.classList.toggle('show', name === 'shop');
  const inBattle = name === 'battle';
  hpRowEl.style.display = inBattle ? '' : 'none';
  controlsEl.style.display = inBattle ? '' : 'none';
  labelEl.style.display = inBattle ? '' : 'none';

  // בלובי: מתקרבים לסווארק, מסתירים את בו, ומשאירים את האבן החדה ביד -
  // "רואים את הדמות ואת הנשק שאיתם משחקים", בלי לבנות שום דבר חדש.
  if (name === 'lobby') {
    enemy.group.visible = false;
    player.forceWeaponVisible = true;
    const p = player.group.position;
    camera.position.set(p.x + 0.75, p.y + 1.30, 2.55);
    camera.lookAt(p.x + 0.10, p.y + 0.85, 0);
  } else {
    enemy.group.visible = true;
    player.forceWeaponVisible = false;
    if (name === 'battle') {
      camera.position.copy(BATTLE_CAM.pos);
      camera.lookAt(BATTLE_CAM.look);
    }
  }
}

  btn.textContent = label;
  btn.addEventListener('click', () => renderShopCategory(key));
  shopTabsEl.appendChild(btn);
});

document.getElementById('lobbyBtn').addEventListener('click', () => { resetGame(); showScreen('lobby'); });
document.getElementById('startFightBtn').addEventListener('click', () => { resetGame(); showScreen('battle'); });
document.getElementById('openShopBtn').addEventListener('click', () => { showScreen('shop'); renderShopCategory('characters'); });
document.getElementById('backLobbyBtn').addEventListener('click', () => showScreen('lobby'));

playAgainBtn.addEventListener('click', resetGame);
updateHealthUI(player, 'player');
updateHealthUI(enemy, 'enemy');

// ---------- לולאת רינדור ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  // סדר חשוב: getDelta חייב לרוץ ראשון. getElapsedTime של three.js קורא ל-getDelta
  // בעצמו ומאפס את הזמן, ואז ה-dt שאחריו יוצא 0 והמשחק קופא לגמרי.
  const dt = Math.min(clock.getDelta(), 0.05);   // תקרה: מונע קפיצה אחרי לשונית ברקע
  const t = clock.elapsedTime;

  if (gameOver || uiScreen !== 'battle') {
    player.mv = 0; enemy.mv = 0;
    player.blocking = false; enemy.blocking = false;
  } else {
    updatePlayer(player, dt);
    updateEnemy(enemy, player, dt);
    tickCombat(player, enemy, 'player', 'enemy');
    tickCombat(enemy, player, 'enemy', 'player');
  }

  [player, enemy].forEach((f) => {
    tickAction(f, dt);
    f.blockAmt += ((f.blocking ? 1 : 0) - f.blockAmt) * (1 - Math.exp(-dt * 16));
  });

  moveFighter(player, enemy, dt);
  moveFighter(enemy, player, dt);

  poseFighter(player, t, dt);
  poseFighter(enemy, t, dt);

  // תנועת קהל עדינה - נותנת חיים לאולם
  crowdPositions.forEach((p, i) => {
    const bob = Math.sin(t * 2.2 + p.phase) * 0.06;
    dummy.position.set(p.x, p.y + 0.36 + bob, p.z);
    dummy.updateMatrix();
    crowdBodies.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, p.y + 0.76 + bob, p.z);
    dummy.updateMatrix();
    crowdHeads.setMatrixAt(i, dummy.matrix);
  });
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

// ידית לבדיקה: מאפשרת לרנדר תנוחה מסוימת ולצלם אותה בזמן פיתוח.
// אין לה שום השפעה על המשחק עצמו.
window.game = {
  player, enemy, startAction, KEYS, camera, scene, resetGame, endGame, showScreen,
  get gameOver() { return gameOver; }, get uiScreen() { return uiScreen; },
};
</script>
