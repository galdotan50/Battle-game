<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - זירה תלת מימדית</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="label">🏟️ שלב גרפיקה: זירה תלת מימדית - סווארק מול בריון (עדיין בלי תנועה)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc7e8);
scene.fog = new THREE.Fog(0x9fc7e8, 12, 30);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
// מצלמה קבועה מהצד - סגנון משחקי לחימה קלאסיים
camera.position.set(0, 1.9, 8.5);
camera.lookAt(0, 1.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
const hemiLight = new THREE.HemisphereLight(0xbfd9ff, 0x554433, 0.55);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff2d6, 1.6);
sunLight.position.set(-6, 10, 6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -10;
sunLight.shadow.camera.right = 10;
sunLight.shadow.camera.top = 10;
sunLight.shadow.camera.bottom = -10;
sunLight.shadow.bias = -0.0015;
scene.add(sunLight);

const rimLight = new THREE.PointLight(0x88aaff, 0.6, 20);
rimLight.position.set(4, 3, -4);
scene.add(rimLight);

// ---------- זירה ----------
const arenaRadius = 6;

const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(arenaRadius, arenaRadius, 0.3, 48),
  new THREE.MeshStandardMaterial({ color: 0x8a7357, roughness: 0.95, metalness: 0.02 })
);
floor.position.y = -0.15;
floor.receiveShadow = true;
scene.add(floor);

// טבעת פנימית (רצפת קרב מוגבהת קלות)
const ring = new THREE.Mesh(
  new THREE.CylinderGeometry(arenaRadius - 0.4, arenaRadius - 0.4, 0.05, 48),
  new THREE.MeshStandardMaterial({ color: 0xb08d5f, roughness: 0.85 })
);
ring.position.y = 0.03;
ring.receiveShadow = true;
scene.add(ring);

// קיר זירה מקיף (תחושת קולוסיאום)
const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(arenaRadius + 0.3, arenaRadius + 0.6, 2.2, 48, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x9a8c7a, roughness: 0.9, side: THREE.DoubleSide })
);
wall.position.y = 1.0;
wall.receiveShadow = true;
scene.add(wall);

// רצפת רקע רחוקה (כדי שלא ייראה ריק אחרי הקיר)
const groundFar = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x6f9954, roughness: 1 })
);
groundFar.rotation.x = -Math.PI / 2;
groundFar.position.y = -0.2;
groundFar.receiveShadow = true;
scene.add(groundFar);

// ---------- בניית דמות אנושית (פרימיטיבים בפרופורציה אנושית) ----------
function createFighter({ skin, shirt, pants, hair }) {
  const group = new THREE.Group();

  const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.6, metalness: 0.05 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: shirt, roughness: 0.75 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: pants, roughness: 0.8 });
  const hairMat = new THREE.MeshStandardMaterial({ color: hair, roughness: 0.7 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x2b2320, roughness: 0.6 });

  function part(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }

  // רגליים
  const legGeo = new THREE.CapsuleGeometry(0.11, 0.42, 4, 8);
  const legL = part(new THREE.Mesh(legGeo, pantsMat));
  legL.position.set(-0.13, 0.46, 0);
  const legR = part(new THREE.Mesh(legGeo, pantsMat));
  legR.position.set(0.13, 0.46, 0);
  group.add(legL, legR);

  // כפות רגליים
  const footGeo = new THREE.BoxGeometry(0.15, 0.08, 0.26);
  const footL = part(new THREE.Mesh(footGeo, shoeMat));
  footL.position.set(-0.13, 0.05, 0.05);
  const footR = part(new THREE.Mesh(footGeo, shoeMat));
  footR.position.set(0.13, 0.05, 0.05);
  group.add(footL, footR);

  // אגן/מותניים
  const hips = part(new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.06, 4, 8), pantsMat));
  hips.position.set(0, 0.75, 0);
  group.add(hips);

  // פלג גוף עליון
  const torso = part(new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.42, 4, 8), shirtMat));
  torso.position.set(0, 1.12, 0);
  group.add(torso);

  // זרועות (כתף עד מרפק, מרפק עד יד) - תלויות בזווית קלה לצד
  function buildArm(sideSign) {
    const armGroup = new THREE.Group();
    armGroup.position.set(sideSign * 0.29, 1.35, 0);

    const upperArm = part(new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.3, 4, 8), skinMat));
    upperArm.position.set(0, -0.17, 0);
    upperArm.rotation.z = sideSign * 0.12;
    armGroup.add(upperArm);

    const lowerArm = part(new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.28, 4, 8), skinMat));
    lowerArm.position.set(sideSign * 0.02, -0.46, 0.02);
    lowerArm.rotation.z = sideSign * 0.05;
    armGroup.add(lowerArm);

    const hand = part(new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 10), skinMat));
    hand.position.set(sideSign * 0.03, -0.62, 0.03);
    armGroup.add(hand);

    return armGroup;
  }
  group.add(buildArm(-1));
  group.add(buildArm(1));

  // צוואר וראש
  const neck = part(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.08, 10), skinMat));
  neck.position.set(0, 1.38, 0);
  group.add(neck);

  const head = part(new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skinMat));
  head.position.set(0, 1.53, 0);
  group.add(head);

  const hairCap = part(new THREE.Mesh(new THREE.SphereGeometry(0.155, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat));
  hairCap.position.set(0, 1.56, 0);
  group.add(hairCap);

  return group;
}

const player = createFighter({ skin: 0xe0a874, shirt: 0x2e6fd1, pants: 0x3a3a3a, hair: 0x3b2a1a });
player.position.set(-1.8, 0, 0);
player.rotation.y = Math.PI / 2.4; // פונה לעבר היריב
scene.add(player);

const enemy = createFighter({ skin: 0x9c6b4f, shirt: 0x8a2a2a, pants: 0x2a2a2a, hair: 0x161616 });
enemy.position.set(1.8, 0, 0);
enemy.rotation.y = -Math.PI / 2.4;
scene.add(enemy);

// ---------- לולאת רינדור ----------
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
