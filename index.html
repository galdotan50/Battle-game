<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הקרבות - סווארק מול בו</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
    z-index: 10;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="label">🥊 שלב גרפיקה: זירת אגרוף - סווארק מול בו (עדיין בלי תנועה)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- בסיס: סצנה, מצלמה, רנדרר ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121a29);
scene.fog = new THREE.Fog(0x121a29, 26, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
// המצלמה יושבת בחלל הפתוח שבין הזירה ליציעים, ומביטה מעל החבל העליון
camera.position.set(0, 3.9, 8.0);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- תאורה ----------
scene.add(new THREE.HemisphereLight(0xaec6e8, 0x2f2a24, 0.8));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff3dd, 2.2);
keyLight.position.set(-6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0012;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.9);
fillLight.position.set(7, 8, -6);
scene.add(fillLight);

// זרקורי זירה - נותנים תחושת אולם אגרוף
const spotA = new THREE.SpotLight(0xfff6e5, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotA.position.set(-3.5, 10, 3.5);
spotA.target.position.set(-1.7, 0.7, 0);
scene.add(spotA, spotA.target);

const spotB = new THREE.SpotLight(0xeaf2ff, 420, 30, Math.PI / 5.5, 0.5, 1.5);
spotB.position.set(3.5, 10, -3.5);
spotB.target.position.set(1.7, 0.7, 0);
scene.add(spotB, spotB.target);

// ---------- מידות הזירה ----------
const RING_HALF = 4.2;        // חצי רוחב הבמה
const RING_TOP = 0.7;         // גובה פני הבמה
const POST_HEIGHT = 1.75;     // גובה עמודי הפינה מעל הבמה
const ROPE_HEIGHTS = [0.5, 0.95, 1.4]; // 3 חבלים בכל צלע

// ---------- רצפת האולם ----------
const hallFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x39404e, roughness: 1 })
);
hallFloor.rotation.x = -Math.PI / 2;
hallFloor.receiveShadow = true;
scene.add(hallFloor);

// ---------- במת הזירה ----------
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.8, RING_TOP, RING_HALF * 2 + 0.8),
  new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.85 })
);
platform.position.y = RING_TOP / 2;
platform.castShadow = true;
platform.receiveShadow = true;
scene.add(platform);

// יריעת הקנבס (משטח הלחימה)
const canvasMat = new THREE.Mesh(
  new THREE.BoxGeometry(RING_HALF * 2 + 0.85, 0.06, RING_HALF * 2 + 0.85),
  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, roughness: 0.95 })
);
canvasMat.position.y = RING_TOP + 0.01;
canvasMat.receiveShadow = true;
scene.add(canvasMat);

// עמודי פינה + כריות ריפוד
const cornerColors = [0xd32f2f, 0x1565c0, 0xd32f2f, 0x1565c0];
const corners = [
  [-RING_HALF, -RING_HALF],
  [ RING_HALF, -RING_HALF],
  [ RING_HALF,  RING_HALF],
  [-RING_HALF,  RING_HALF],
];

corners.forEach(([cx, cz], i) => {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, POST_HEIGHT, 14),
    new THREE.MeshStandardMaterial({ color: 0xc2c9d4, roughness: 0.35, metalness: 0.75 })
  );
  post.position.set(cx, RING_TOP + POST_HEIGHT / 2, cz);
  post.castShadow = true;
  scene.add(post);

  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.17, 1.15, 14),
    new THREE.MeshStandardMaterial({ color: cornerColors[i], roughness: 0.8 })
  );
  pad.position.set(cx, RING_TOP + 0.95, cz);
  pad.castShadow = true;
  scene.add(pad);
});

// חבלים - 3 בכל אחת מ-4 הצלעות
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
const ropeLen = RING_HALF * 2;

ROPE_HEIGHTS.forEach((h) => {
  const y = RING_TOP + h;

  [-RING_HALF, RING_HALF].forEach((z) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.z = Math.PI / 2;
    rope.position.set(0, y, z);
    rope.castShadow = true;
    scene.add(rope);
  });

  [-RING_HALF, RING_HALF].forEach((x) => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ropeLen, 10), ropeMat);
    rope.rotation.x = Math.PI / 2;
    rope.position.set(x, y, 0);
    rope.castShadow = true;
    scene.add(rope);
  });
});

// ---------- יציעים וקהל ----------
// חשוב: כל יציע נבנה כ"מסגרת" חלולה מ-4 קטעים, ולא כקובייה מלאה -
// אחרת הקובייה הגדולה בולעת את הזירה ואת המצלמה.
const TIERS = 5;
const TIER_WIDTH = 2.0;
const FIRST_TIER_INNER = 9.0;   // מרוחק מספיק כדי להשאיר חלל פתוח למצלמה
const crowdPositions = [];

for (let t = 0; t < TIERS; t++) {
  const innerHalf = FIRST_TIER_INNER + t * TIER_WIDTH;
  const outerHalf = innerHalf + TIER_WIDTH;
  const height = 0.55 + t * 0.7;
  const mid = innerHalf + TIER_WIDTH / 2;

  const tierMat = new THREE.MeshStandardMaterial({
    color: t % 2 ? 0x3d4553 : 0x343b48,
    roughness: 0.95
  });

  // שני קטעים לאורך ציר X (מלוא הרוחב)
  [-mid, mid].forEach((z) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(outerHalf * 2, height, TIER_WIDTH), tierMat);
    seg.position.set(0, height / 2, z);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // שני קטעים לאורך ציר Z (בלי הפינות, שכבר נוצרו)
  [-mid, mid].forEach((x) => {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(TIER_WIDTH, height, innerHalf * 2), tierMat);
    seg.position.set(x, height / 2, 0);
    seg.receiveShadow = true;
    scene.add(seg);
  });

  // פיזור צופים על גג היציע - שתי שורות בכל צלע
  [0.6, 1.4].forEach((rowOffset) => {
    const out = innerHalf + rowOffset;
    const step = 0.8;
    const span = innerHalf + TIER_WIDTH * 0.5;
    for (let d = -span; d <= span; d += step) {
      const along = d + (Math.random() - 0.5) * 0.3;
      const outJ = out + (Math.random() - 0.5) * 0.25;
      [[along, -outJ], [along, outJ], [-outJ, along], [outJ, along]].forEach(([x, z]) => {
        crowdPositions.push({ x, y: height, z, phase: Math.random() * Math.PI * 2 });
      });
    }
  });
}

const crowdCount = crowdPositions.length;

const crowdBodyGeo = new THREE.CapsuleGeometry(0.17, 0.34, 4, 8);
const crowdHeadGeo = new THREE.SphereGeometry(0.145, 10, 10);
const crowdMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });

const crowdBodies = new THREE.InstancedMesh(crowdBodyGeo, crowdMat, crowdCount);
const crowdHeads = new THREE.InstancedMesh(crowdHeadGeo, crowdMat, crowdCount);
crowdBodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
crowdHeads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const shirtPalette = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xe67e22, 0xecf0f1, 0x1abc9c];
const skinPalette = [0xf0c39a, 0xd9a273, 0xb07a4e, 0x8a5a35, 0x66401f];

const dummy = new THREE.Object3D();
const colorTmp = new THREE.Color();

crowdPositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y + 0.36, p.z);
  dummy.updateMatrix();
  crowdBodies.setMatrixAt(i, dummy.matrix);

  dummy.position.set(p.x, p.y + 0.76, p.z);
  dummy.updateMatrix();
  crowdHeads.setMatrixAt(i, dummy.matrix);

  crowdBodies.setColorAt(i, colorTmp.setHex(shirtPalette[Math.floor(Math.random() * shirtPalette.length)]));
  crowdHeads.setColorAt(i, colorTmp.setHex(skinPalette[Math.floor(Math.random() * skinPalette.length)]));
});

scene.add(crowdBodies, crowdHeads);

// ---------- בניית דמות אנושית מחוברת ----------
// כל "עצם" נמתחת בין שתי נקודות שלד, ובכל מפרק יש כדור שמסתיר את התפר.
// כך לא נוצרים פערים ולא חפיפות כפולות.

const UP = new THREE.Vector3(0, 1, 0);

function bone(mat, rTop, rBottom, from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, len, 14), mat);
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function joint(mat, r, pos) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 12), mat);
  mesh.position.copy(pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// חומר זהב משותף לתכשיטים (עגילים / טבעות)
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd9b23c, roughness: 0.2, metalness: 0.95 });

/**
 * בונה דמות לוחם לפי הגדרות מראה, בסגנון מונפש (ראש גדול, עיניים גדולות).
 * cfg:
 *   skin, hair            - צבעים
 *   hairStyle             - 'curly' (תלתלים) | 'spiky' (קוצני)
 *   eyeColor              - צבע הקשתית
 *   ears                  - 'round' | 'pointed' (אוזניים חדות)
 *   top                   - צבע גופייה, או null לגוף חשוף
 *   pants                 - צבע מכנסיים ארוכים, או null
 *   boxers                - צבע תחתונים, או null
 *   boots                 - צבע מגפיים, או null לרגליים יחפות
 *   handWraps             - תחבושות לבנות על האגרופים
 *   noseRing, fingerRing  - תכשיטי זהב
 */
function createFighter(cfg) {
  const g = new THREE.Group();

  // ---------- חומרים ----------
  const skinMat = new THREE.MeshStandardMaterial({ color: cfg.skin, roughness: 0.55, metalness: 0.02 });
  const hairMat = new THREE.MeshStandardMaterial({ color: cfg.hair, roughness: 0.85 });
  const topMat   = cfg.top    ? new THREE.MeshStandardMaterial({ color: cfg.top,    roughness: 0.9 })  : null;
  const pantsMat = cfg.pants  ? new THREE.MeshStandardMaterial({ color: cfg.pants,  roughness: 0.92 }) : null;
  const boxerMat = cfg.boxers ? new THREE.MeshStandardMaterial({ color: cfg.boxers, roughness: 0.85 }) : null;
  const bootMat  = cfg.boots  ? new THREE.MeshStandardMaterial({ color: cfg.boots,  roughness: 0.5 })  : null;
  const soleMat  = new THREE.MeshStandardMaterial({ color: 0x3a2b20, roughness: 0.9 });
  const laceMat  = new THREE.MeshStandardMaterial({ color: 0xe4d5b8, roughness: 0.8 });
  const cuffMat  = cfg.pants ? new THREE.MeshStandardMaterial({ color: 0x9fb4d6, roughness: 0.92 }) : null;
  const beltMat  = new THREE.MeshStandardMaterial({ color: 0x543a25, roughness: 0.55 });
  const buckleMat = new THREE.MeshStandardMaterial({ color: 0xb9a06a, roughness: 0.3, metalness: 0.85 });
  const wrapMat  = new THREE.MeshStandardMaterial({ color: 0xf0ece2, roughness: 0.95 });
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xfbfbfb, roughness: 0.25 });
  const irisMat  = new THREE.MeshStandardMaterial({ color: cfg.eyeColor ?? 0x6b4423, roughness: 0.3 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x140f0c, roughness: 0.2 });
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mouthMat = new THREE.MeshStandardMaterial({ color: 0x7a3535, roughness: 0.6 });

  const legMat = pantsMat || skinMat;              // מכנסיים אם יש, אחרת עור חשוף
  const hipMat = pantsMat || boxerMat || skinMat;  // מכנסיים > תחתונים > עור

  // ---------- נקודות שלד: עמידת קרב ----------
  // הדמות פונה לכיוון +Z. רגליים פשוקות, ברכיים כפופות, אגרופים מורמים לשמירה.
  const ankleL = V(-0.33, 0.17, -0.05), ankleR = V( 0.30, 0.17, 0.17);
  const kneeL  = V(-0.24, 0.53,  0.05), kneeR  = V( 0.22, 0.53, 0.21);
  const hipL   = V(-0.135, 0.86, 0.0),  hipR   = V( 0.135, 0.86, 0.02);
  const pelvis = V(0, 0.88, 0);
  const chest  = V(0, 1.27, 0.01);
  const shoulderL = V(-0.245, 1.22, 0.0), shoulderR = V( 0.245, 1.22, 0.0);
  const elbowL = V(-0.325, 0.95, 0.11),   elbowR = V( 0.345, 0.96, 0.03);
  const wristL = V(-0.175, 1.14, 0.30),   wristR = V( 0.205, 1.29, 0.20);
  const neckBase = V(0, 1.30, 0), neckTop = V(0, 1.44, 0);
  const headCenter = V(0, 1.61, 0);

  // חצאי הצירים של אליפסואיד הראש (משמש למיקום שיער ותווי פנים)
  const HEAD_R = 0.175;
  const hx = HEAD_R * 0.96, hy = HEAD_R * 1.10, hz = HEAD_R;

  // ---------- רגליים ----------
  g.add(bone(legMat, 0.105, 0.12, kneeL, ankleL));
  g.add(bone(legMat, 0.105, 0.12, kneeR, ankleR));
  g.add(bone(legMat, 0.15, 0.11, hipL, kneeL));
  g.add(bone(legMat, 0.15, 0.11, hipR, kneeR));
  g.add(joint(legMat, 0.11, kneeL));
  g.add(joint(legMat, 0.11, kneeR));
  g.add(joint(legMat, 0.15, hipL));
  g.add(joint(legMat, 0.15, hipR));

  // ---------- כפות רגליים / מגפיים ----------
  // כיוון כל כף רגל נגזר מהמיקום שלה, כדי שתצביע החוצה בעמידת הקרב
  [[ankleL, kneeL, -0.35], [ankleR, kneeR, 0.30]].forEach(([ankle, knee, yaw]) => {
    if (bootMat) {
      // מגף עור גבוה: שוק + כף + סוליה + שרוכים
      const bootGrp = new THREE.Group();
      bootGrp.position.set(ankle.x, 0, ankle.z);
      bootGrp.rotation.y = yaw;

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.108, 0.122, 0.30, 16), bootMat);
      shaft.position.set(0, 0.21, 0);
      shaft.castShadow = true;
      bootGrp.add(shaft);

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.15, 0.35), bootMat);
      foot.position.set(0, 0.095, 0.075);
      foot.castShadow = true;
      bootGrp.add(foot);

      const sole = new THREE.Mesh(new THREE.BoxGeometry(0.215, 0.05, 0.37), soleMat);
      sole.position.set(0, 0.025, 0.075);
      sole.castShadow = true;
      bootGrp.add(sole);

      [0.19, 0.25, 0.31].forEach((ly) => {
        const lace = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.016, 0.02), laceMat);
        lace.position.set(0, ly, 0.108);
        bootGrp.add(lace);
      });

      bootGrp.traverse((o) => { if (o.isMesh) o.receiveShadow = true; });
      g.add(bootGrp);

      // שולי מכנסיים מקופלים מעל המגף
      if (cuffMat) {
        const t = 0.62; // נקודה על הקו ברך→קרסול, בגובה שפת המגף
        const cuffPos = ankle.clone().lerp(knee, t);
        const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.128, 0.10, 16), cuffMat);
        cuff.position.copy(cuffPos);
        cuff.castShadow = true;
        g.add(cuff);
      }
    } else {
      // רגל יחפה
      g.add(joint(skinMat, 0.10, ankle));
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.11, 0.32), skinMat);
      foot.position.set(ankle.x, 0.055, ankle.z + 0.09);
      foot.rotation.y = yaw;
      foot.castShadow = true;
      foot.receiveShadow = true;
      g.add(foot);
    }
  });

  // ---------- אגן ----------
  g.add(bone(hipMat, 0.205, 0.195, V(0, 0.95, 0), V(0, 0.80, 0)));

  // תחתונים (בוקסר) - שכבה מעט רחבה יותר על האגן וראש הירכיים
  if (boxerMat && !pantsMat) {
    g.add(bone(boxerMat, 0.215, 0.21, V(0, 0.95, 0), V(0, 0.81, 0)));
    [hipL, hipR].forEach((h) => {
      g.add(bone(boxerMat, 0.163, 0.14, V(h.x, 0.90, h.z), V(h.x * 1.12, 0.63, h.z + 0.02)));
    });
  }

  // חגורה עם אבזם - רק כשיש מכנסיים ארוכים
  if (pantsMat) {
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.075, 22), beltMat);
    belt.position.set(0, 0.935, 0);
    belt.castShadow = true;
    g.add(belt);

    const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.075, 0.03), buckleMat);
    buckle.position.set(0, 0.935, 0.21);
    buckle.castShadow = true;
    g.add(buckle);
  }

  // ---------- פלג גוף עליון (תמיד עור; הבגד מונח מעליו) ----------
  g.add(bone(skinMat, 0.235, 0.19, chest, pelvis));
  g.add(joint(skinMat, 0.235, chest));
  g.add(joint(skinMat, 0.175, shoulderL));
  g.add(joint(skinMat, 0.175, shoulderR));

  // גופייה - שכבה מעל פלג הגוף, עם שתי כתפיות מעל הכתפיים
  if (topMat) {
    g.add(bone(topMat, 0.244, 0.203, V(0, 1.19, 0.005), V(0, 0.87, 0)));
    [-1, 1].forEach((s) => {
      const frontPt    = V(s * 0.12, 1.185, 0.195);
      const shoulderPt = V(s * 0.205, 1.325, 0.0);
      const backPt     = V(s * 0.14, 1.185, -0.18);
      g.add(bone(topMat, 0.032, 0.032, frontPt, shoulderPt));
      g.add(bone(topMat, 0.032, 0.032, shoulderPt, backPt));
      g.add(joint(topMat, 0.034, shoulderPt));
    });
  }

  // ---------- זרועות ----------
  [[shoulderL, elbowL, wristL], [shoulderR, elbowR, wristR]].forEach(([sh, el, wr]) => {
    g.add(bone(skinMat, 0.09, 0.072, sh, el));
    g.add(joint(skinMat, 0.074, el));
    g.add(bone(skinMat, 0.07, 0.06, el, wr));

    if (cfg.handWraps) {
      // תחבושת סביב האמה + אגרוף עטוף
      const dir = new THREE.Vector3().subVectors(wr, el).normalize();
      g.add(bone(wrapMat, 0.074, 0.08, wr.clone().addScaledVector(dir, -0.17), wr.clone().addScaledVector(dir, -0.01)));
      const fist = new THREE.Mesh(new THREE.SphereGeometry(0.092, 14, 14), wrapMat);
      fist.position.copy(wr);
      fist.castShadow = true;
      fist.receiveShadow = true;
      g.add(fist);
    } else {
      g.add(joint(skinMat, 0.085, wr));
    }
  });

  // ---------- צוואר ----------
  g.add(bone(skinMat, 0.085, 0.10, neckTop, neckBase));
  g.add(joint(skinMat, 0.088, neckTop));

  // ---------- ראש ----------
  const head = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R, 24, 24), skinMat);
  head.position.copy(headCenter);
  head.scale.set(0.96, 1.10, 1.0);
  head.castShadow = true;
  head.receiveShadow = true;
  g.add(head);

  // אוזניים - עגולות רגילות או חדות ומחודדות כלפי מעלה
  [-1, 1].forEach((s) => {
    let ear;
    if (cfg.ears === 'pointed') {
      ear = new THREE.Mesh(new THREE.ConeGeometry(0.062, 0.23, 10), skinMat);
      ear.position.set(s * 0.168, headCenter.y + 0.06, -0.012);
      ear.rotation.z = s * -0.45;
      ear.rotation.x = -0.25;
      ear.scale.set(0.55, 1, 0.9);
    } else {
      ear = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), skinMat);
      ear.position.set(s * 0.163, headCenter.y - 0.005, -0.008);
      ear.scale.set(0.5, 1.05, 0.8);
    }
    ear.castShadow = true;
    g.add(ear);
  });

  // ---------- פנים (עיניים גדולות בסגנון מונפש) ----------
  [-1, 1].forEach((s) => {
    const eyeX = s * 0.075, eyeY = headCenter.y + 0.028;

    const white = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), eyeWhiteMat);
    white.position.set(eyeX, eyeY, 0.132);
    white.scale.set(1, 0.94, 0.5);
    g.add(white);

    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.029, 14, 14), irisMat);
    iris.position.set(eyeX + s * 0.004, eyeY - 0.004, 0.156);
    iris.scale.set(1, 1, 0.55);
    g.add(iris);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 12), pupilMat);
    pupil.position.set(eyeX + s * 0.004, eyeY - 0.004, 0.166);
    pupil.scale.set(1, 1, 0.55);
    g.add(pupil);

    // ניצוץ - מה שנותן לעין מבט "חי"
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 8), glintMat);
    glint.position.set(eyeX + s * 0.017, eyeY + 0.019, 0.171);
    g.add(glint);

    // גבה עבה
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.026, 0.035), hairMat);
    brow.position.set(eyeX, headCenter.y + 0.105, 0.142);
    brow.rotation.z = s * -0.14;
    brow.castShadow = true;
    g.add(brow);
  });

  // אף קטן ורך
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 12), skinMat);
  nose.position.set(0, headCenter.y - 0.022, 0.158);
  nose.scale.set(0.9, 0.85, 0.8);
  nose.castShadow = true;
  g.add(nose);

  // חיוך - חצי טבעת שפונה כלפי מטה
  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.012, 8, 20, Math.PI), mouthMat);
  smile.position.set(0, headCenter.y - 0.075, 0.15);
  smile.rotation.z = Math.PI;
  g.add(smile);

  // ---------- עגיל באף ----------
  if (cfg.noseRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.0075, 8, 18), goldMat);
    ring.position.set(0, headCenter.y - 0.062, 0.168);
    ring.castShadow = true;
    g.add(ring);
  }

  // ---------- טבעת באצבע (יד ימין) ----------
  if (cfg.fingerRing) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.012, 8, 18), goldMat);
    ring.position.set(wristR.x, wristR.y - 0.06, wristR.z + 0.01);
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = true;
    g.add(ring);
  }

  // ---------- שיער ----------
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(HEAD_R * 1.03, 22, 22, 0, Math.PI * 2, 0, Math.PI * 0.5),
    hairMat
  );
  hairCap.position.copy(headCenter);
  hairCap.position.y += 0.012;
  hairCap.scale.set(0.97, 1.18, 1.02);
  hairCap.castShadow = true;
  g.add(hairCap);

  // צורות שיער מונחות על פני הגולגולת לפי טבעות זווית,
  // ומדלגות על אזור המצח כדי שהפנים יישארו חשופות
  const HAIR_RINGS = [
    { phi: 0.26, count: 6 },
    { phi: 0.60, count: 10 },
    { phi: 0.94, count: 14 },
    { phi: 1.26, count: 16 },
    { phi: 1.55, count: 16 },
  ];

  HAIR_RINGS.forEach(({ phi, count }) => {
    for (let i = 0; i < count; i++) {
      const theta = (i / count) * Math.PI * 2 + phi * 1.7;
      const lx = Math.sin(phi) * Math.cos(theta) * hx;
      const ly = Math.cos(phi) * hy;
      const lz = Math.sin(phi) * Math.sin(theta) * hz;

      // דילוג על המצח והפנים (קו שיער בגובה הגבות)
      if (lz > 0.05 && ly < 0.105) continue;

      const jitter = () => (Math.random() - 0.5) * 0.028;
      const px = headCenter.x + lx * 1.04 + jitter();
      const py = headCenter.y + ly * 1.04 + jitter();
      const pz = lz * 1.04 + jitter();

      let tuft;
      if (cfg.hairStyle === 'spiky') {
        tuft = new THREE.Mesh(new THREE.ConeGeometry(0.042, 0.16, 7), hairMat);
        const dir = new THREE.Vector3(lx, ly, lz).normalize();
        tuft.position.set(px + dir.x * 0.05, py + dir.y * 0.05, pz + dir.z * 0.05);
        tuft.quaternion.setFromUnitVectors(UP, dir);
      } else {
        // תלתלים - כדורים גדולים וצפופים שנותנים נפח
        const r = 0.048 + Math.random() * 0.016;
        tuft = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), hairMat);
        tuft.position.set(px, py, pz);
      }
      tuft.castShadow = true;
      g.add(tuft);
    }
  });

  return g;
}

// ---------- הצבת הלוחמים על הבמה ----------

// סווארק - גופייה לבנה, ג'ינס עם חגורה, מגפי עור, תלתלים חומים, תחבושות על האגרופים
const player = createFighter({
  skin: 0xf0bd92,
  hair: 0x3a2718,
  hairStyle: 'curly',
  eyeColor: 0x6b4423,
  ears: 'round',
  top: 0xf6f5f1,      // גופייה לבנה
  pants: 0x7089b5,    // ג'ינס
  boots: 0x8a5733,    // מגפי עור חומים
  handWraps: true,
});
player.position.set(-1.7, RING_TOP + 0.04, 0);
player.rotation.y = 1.05;   // 3/4 - פונה ליריב אבל הפנים נראות למצלמה
scene.add(player);

// בו - איש כחול, אוזניים חדות, שיער ירוק, עגיל באף וטבעת באצבע, רק בוקסר שחור
const enemy = createFighter({
  skin: 0x4a93d4,
  hair: 0x33c04a,
  hairStyle: 'spiky',
  eyeColor: 0xc8a02a,
  ears: 'pointed',
  top: null,          // בלי חולצה
  pants: null,        // בלי מכנסיים
  boxers: 0x16181c,   // בוקסר שחור
  boots: null,        // יחף
  noseRing: true,
  fingerRing: true,
});
enemy.position.set(1.7, RING_TOP + 0.04, 0);
enemy.rotation.y = -1.05;
scene.add(enemy);

// ---------- לולאת רינדור ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // תנועת קהל עדינה - נותנת חיים לאולם
  crowdPositions.forEach((p, i) => {
    const bob = Math.sin(t * 2.2 + p.phase) * 0.06;
    dummy.position.set(p.x, p.y + 0.36 + bob, p.z);
    dummy.updateMatrix();
    crowdBodies.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, p.y + 0.76 + bob, p.z);
    dummy.updateMatrix();
    crowdHeads.setMatrixAt(i, dummy.matrix);
  });
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();
</script>
